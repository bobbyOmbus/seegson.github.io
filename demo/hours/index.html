<style>

  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #7a4f00;

}

    --ink: #ffffff; --ink2: #c3c2b7; --muted: #8f8d86;
    --grid: #2c2c2a; --base: #383835; --ring: rgba(255,255,255,.14);
    --accent: #d9a62e; --accent-soft: #2e2711; --focus: #6da7ec;
    --bar: #0a0d14; --bar-ink: #ffffff;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-ink: #0ca30c; --warn-ink: #fab219; --crit-ink: #ee7b7b; --info-ink: #6da7ec;
    --track: #232a36;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #212120;
  --ink: #ffffff; --ink2: #c3c2b7; --muted: #8f8d86;
  --grid: #2c2c2a; --base: #383835; --ring: rgba(255,255,255,.14);
  --accent: #d9a62e; --accent-soft: #2e2711; --focus: #6da7ec;
  --bar: #0a0d14; --bar-ink: #ffffff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-ink: #0ca30c; --warn-ink: #fab219; --crit-ink: #ee7b7b; --info-ink: #6da7ec;
  --track: #232a36;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.topbar { background: var(--bar); color: var(--bar-ink); }
.topbar .in { max-width: 1160px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 800; letter-spacing: .14em; font-size: 13px; }
.brand i { font-style: normal; color: var(--accent); margin: 0 .35em; }
.brand small { font-weight: 500; letter-spacing: 0; font-size: 13px; opacity: .72; margin-left: 12px; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  background: rgba(255,255,255,.1); color: var(--bar-ink); border: 0; cursor: pointer; font-size: 13px; }
.chip:hover { background: rgba(255,255,255,.18); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff6b5e; }
.btn-top { background: var(--accent); color: #0f1623; border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-size: 13px; }
.btn-top.ghost { background: transparent; color: var(--bar-ink); border: 1px solid rgba(255,255,255,.35); }
nav.tabs { background: var(--surface); border-bottom: 1px solid var(--grid); }
nav.tabs .in { max-width: 1160px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; }
nav.tabs a { padding: 12px 14px; color: var(--ink2); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }
main { max-width: 1160px; margin: 0 auto; padding: 24px 20px 64px; } main > *, .card { min-width: 0; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; font-size: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner b { font-weight: 700; }

/* layout bits */
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.filters { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .field > label { font-size: 13px; color: var(--ink2); font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
input[type=text], input[type=date], input[type=number], select, textarea {
  background: var(--raised); border: 1px solid var(--base); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 64px; }
select { padding-right: 24px; }
.btn { background: var(--ink); color: var(--surface); border: 1px solid var(--ink); border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { opacity: .88; }
.btn.sec { background: transparent; color: var(--ink); border-color: var(--base); }
.btn.sec:hover { border-color: var(--ink); opacity: 1; }
.btn.danger { background: transparent; color: var(--crit-ink); border-color: var(--crit); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.link { background: none; border: 0; padding: 0; color: var(--info-ink); text-decoration: underline; cursor: pointer; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
.card > h2 { font-size: 17px; margin-bottom: 4px; }
.card > .sub { color: var(--ink2); font-size: 13px; margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
@media (max-width: 860px) { .grid4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .grid3 { grid-template-columns: minmax(0,1fr); } }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap: 28px; align-items: end; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 16px; } }
.hero .big { font-size: 64px; font-weight: 800; letter-spacing: -.025em; line-height: 1; }
.hero .big small { font-size: 22px; font-weight: 600; letter-spacing: 0; color: var(--ink2); margin-left: 6px; }
.hero .cap { color: var(--ink2); margin-top: 6px; }
.hero .facts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 20px; }
.fact b { display: block; font-size: 20px; font-weight: 700; }
.fact span { color: var(--ink2); font-size: 13px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.status.good { color: var(--good-ink); } .status.warn { color: var(--warn-ink); } .status.crit { color: var(--crit-ink); } .status.info { color: var(--info-ink); }
.note { color: var(--ink2); font-size: 14px; margin-top: 10px; }

/* ledger bar */
.ledger { margin-top: 22px; }
.ledger .track { position: relative; height: 30px; background: var(--track); border-radius: 6px; display: flex; gap: 2px; }

.ledger .seg:first-child { border-radius: 6px 0 0 6px; } .ledger .seg:last-child { border-radius: 0 4px 4px 0; }
.ledger .seg:only-child { border-radius: 6px 4px 4px 6px; }

.ledger .mark { position: absolute; top: -7px; bottom: -7px; width: 3px; margin-left: -1px; background: var(--accent); border-radius: 2px; pointer-events: none; }
.ledger .mark-l { position: absolute; top: -26px; transform: translateX(-50%); font-size: 12px; color: var(--ink2); white-space: nowrap; font-weight: 600; }
.ledger .lim { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px solid var(--ink); pointer-events: none; }
.ledger .axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 13px; color: var(--ink2); }
.legend .k { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.ln { width: 18px; height: 0; border-top: 2px solid; display: inline-block; flex: none; }

/* stat tiles */
.tile { background: var(--raised); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px; }
.tile .l { color: var(--ink2); font-size: 13px; }
.tile .v { font-size: 26px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
.tile .d { color: var(--muted); font-size: 12px; margin-top: 2px; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 13px; font-weight: 600; color: var(--ink2); padding: 8px 10px; border-bottom: 1px solid var(--base); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.r, th.r { text-align: right; } td.num, th.num { font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 700; border-top: 1px solid var(--base); border-bottom: 0; }
tr.cur td { background: var(--accent-soft); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.est { font-size: 11px; font-weight: 700; border: 1px solid var(--base); border-radius: 4px; padding: 0 5px; color: var(--ink2); margin-left: 6px; vertical-align: 1px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--base); color: var(--ink2); white-space: nowrap; }
.pill.good { color: var(--good-ink); border-color: var(--good); } .pill.warn { color: var(--warn-ink); border-color: var(--warn); }
.pill.crit { color: var(--crit-ink); border-color: var(--crit); } .pill.info { color: var(--info-ink); border-color: var(--info-ink); }
details.tablev { margin-top: 12px; } details.tablev summary { cursor: pointer; font-size: 13px; color: var(--info-ink); font-weight: 600; }

/* chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { font: 12px system-ui, sans-serif; fill: var(--muted); }
.chart .lbl { fill: var(--ink2); font-weight: 600; }

/* meter */
.meter { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.catrow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 64px; gap: 12px; align-items: center; padding: 5px 0; font-size: 14px; }
.catrow .meter { height: 12px; }

/* projects */
.proj { border: 1px solid var(--ring); border-radius: 10px; background: var(--surface); padding: 18px 20px; margin-bottom: 16px; }
.proj .hd { display: flex; gap: 12px; align-items: start; flex-wrap: wrap; }
.proj h3 { font-size: 17px; }
.proj .meta { color: var(--ink2); font-size: 13px; }
.goal { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--grid); }
.goal .t { min-width: 0; } .goal .t b { font-weight: 600; } .goal.done .t b { color: var(--muted); text-decoration: line-through; }
.gicon { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--base); background: transparent; cursor: pointer; font-size: 13px; line-height: 1; display: grid; place-items: center; padding: 0; color: var(--ink2); }
.gicon.done { background: var(--good); border-color: var(--good); color: #fff; } .gicon.prog { border-color: var(--info-ink); color: var(--info-ink); } .gicon.block { border-color: var(--crit); color: var(--crit-ink); }

.modal { background: var(--surface); border-radius: 12px; width: min(640px, 100%); padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal h2 { font-size: 19px; margin-bottom: 14px; }

.err { color: var(--crit-ink); font-size: 13px; font-weight: 600; min-height: 18px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; z-index: 80; opacity: 0; pointer-events: none; transition: opacity .15s; }
#toast.on { opacity: 1; }
#tip { position: fixed; z-index: 70; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--base); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; max-width: 260px; }
#tip .th { color: var(--ink2); margin-bottom: 4px; font-weight: 600; }
#tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
#tip .tr span.k { display: inline-flex; align-items: center; gap: 7px; color: var(--ink2); }
#tip .tr b { font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.timerbox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--raised); border: 1px solid var(--ring); border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; }
.timerbox .clock { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 120px; }
.empty { text-align: center; color: var(--ink2); padding: 28px 12px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
pre.out { background: var(--raised); border: 1px solid var(--ring); border-radius: 8px; padding: 14px; white-space: pre-wrap; font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace; margin: 0; max-height: 420px; overflow: auto; }
.foot { color: var(--muted); font-size: 13px; margin-top: 8px; }
@media print {
  .topbar, nav.tabs, .noprint, .btn, #toast, #tip { display: none !important; }
  body, html { background: #fff; } .card, .proj { box-shadow: none; break-inside: avoid; }
  main { max-width: none; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
