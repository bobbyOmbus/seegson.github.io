      </div>
      <h3>Recipe packs</h3><p class="muted" style="font-size:13px">New packs drop through the year. Buy once, keep forever. Premium required.</p>
      ${Object.entries(PACKS).map(([id, pk]) => { const own = P2.packs.includes(id); const n = RECIPES.filter(r => r.tier === id).length; return `<div class="pack-banner" style="background:linear-gradient(135deg,${pk.grad[0]},${pk.grad[1]})"><span class="p-ico">${pk.emoji}</span><div class="grow"><h3>${pk.name}</h3><p>${n} recipes · ${pk.blurb}</p></div>
        ${own ? '<span class="pill good">Owned</span>' : `<button class="btn btn-sm" style="background:#fff;color:#26183A" data-act="buypack" data-id="${id}" ${prem ? '' : 'disabled'}>$${pk.price}</button>`}</div>`; }).join('')}
      <div class="note"><span>ℹ️</span><p>Demo checkout — no card is charged. In the store app this runs through the App Store or Google Play. Kids never see a buy button.</p></div>`;
  }
  if (tab === 'family') {
    body = `<section class="card section">${S.kids.map(x => `<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:10px">${avatarSVG(x.avatar, 48)}
        <input class="grow" id="kn-${x.id}" value="${esc(x.name)}" data-change="kidname" data-id="${x.id}" aria-label="Name" style="min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 10px;min-width:0">
        <span class="pill num">Age ${x.age}</span>${S.kids.length > 1 ? `<button class="btn btn-sm btn-line" data-act="rmkid" data-id="${x.id}">${UI.rmArm === x.id ? 'Tap to confirm' : 'Remove'}</button>` : ''}</div>`).join('')}</section>
      <form class="card section" id="addKidForm"><h3>Add a chef</h3><div class="row"><label class="field grow">Name<input id="nkName" required maxlength="16" placeholder="First name"></label><label class="field" style="width:90px">Age<input id="nkAge" type="number" min="4" max="12" value="7"></label></div>
        <button class="btn btn-primary" type="submit">Add chef</button></form>
      <form class="card section" id="pinForm"><h3>Change PIN</h3><label class="field">New 4-digit PIN<input id="newPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button class="btn btn-line" type="submit">Save PIN</button></form>
      <section class="card section"><h3>Demo data</h3><p class="muted" style="font-size:13px">Progress is saved in this browser only.</p>
        <div class="row wrap"><button class="btn btn-sm btn-line" data-act="resetfresh">${UI.resetArm === 'fresh' ? 'Tap again to erase' : 'Start fresh (one new chef)'}</button><button class="btn btn-sm btn-line" data-act="resetsample">${UI.resetArm === 'sample' ? 'Tap again to reload' : 'Reload sample family'}</button></div></section>`;
  }
  return `<div class="screen bare pz">
    <div class="topbar"><button class="icon-btn" data-act="pzexit" aria-label="Leave grown-ups zone">←</button><h2>Grown-ups</h2><span class="pill">${P2.plan === 'premium' ? 'Premium' : 'Free'}</span></div>
    <div class="ptabs" role="tablist">${tabs.map(([id, l]) => `<button role="tab" data-act="ptab" data-t="${id}" aria-selected="${tab === id}">${l}</button>`).join('')}</div>
    ${body}</div>`;
};
MOUNT.parent = () => {
  leaveHooks.push(() => { if (route.name !== 'parent') { UI.pz = false; UI.pin = ''; } });
  $('#addKidForm')?.addEventListener('submit', e => {
    e.preventDefault(); const name = $('#nkName').value.trim(), age = Math.max(4, Math.min(12, +$('#nkAge').value || 7)); if (!name) return;
    S.kids.push(makeKid({ id: 'k' + Date.now(), name, age })); save(); toast(`${name} joined the kitchen`); rerender();
  });
  $('#pinForm')?.addEventListener('submit', e => { e.preventDefault(); const v = $('#newPin').value; if (!/^\d{4}$/.test(v)) return toast('Use exactly 4 numbers'); S.parent.pin = v; save(); toast('PIN saved'); rerender(); });
};
function rerender() { const y = scrollY; render(); scrollTo(0, y); }

/* ============================================================
   Actions (event delegation)
   ============================================================ */
const ACT = {
  noop() {},
  back() { back(); },
  'close-sheet'() { closeSheet(); },
  nav(t) { hist.length = 0; P = null; go(t.dataset.to, {}, { replace: true }); },
  pick(t) { S.active = t.dataset.id; const k = kid(); ensureQuests(k); save(); hist.length = 0; sfx('tap'); go('home', {}, { replace: true }); },
  switch() { S.active = null; save(); hist.length = 0; go('landing', {}, { replace: true }); },
  parent() { UI.ptab = UI.ptab || 'overview'; go('parent'); },
  pzexit() { UI.pz = false; UI.pin = ''; back(); },
  filter(t) { UI.filter = t.dataset.f; rerender(); },
  rtab(t) { UI.rtab = t.dataset.t; rerender(); },
  gather(t) { const id = t.dataset.id, i = +t.dataset.i; const g = UI.gathered[id] = UI.gathered[id] || []; g.includes(i) ? g.splice(g.indexOf(i), 1) : g.push(i); rerender(); },
  play(t) { startPlayer(t.dataset.id, t.dataset.step || 0); },
  preview(t) { startPlayer(t.dataset.id, 0, true); },
  unlock(t) { if (t.dataset.type === 'skill') return startLesson(t.dataset.skill); UI.ptab = t.dataset.type === 'control' ? 'controls' : 'plan'; UI.pkid = S.active; go('parent'); },
  addlist(t) { const n = addToList(R(t.dataset.id)); toast(n ? `Added ${n} item${n > 1 ? 's' : ''} to the shopping list` : 'Already on your list'); },
  atab(t) { UI.atab = t.dataset.t; rerender(); },
  avopt(t) {
    const k = kid(), cat = t.dataset.cat, o = AV[cat].find(x => x.id === t.dataset.id);
    if (ownsAv(k, cat, o)) { k.avatar[cat] = o.id; save(); sfx('tap'); return rerender(); }
    openSheet(`<div class="section" style="align-items:center;text-align:center">${avatarSVG(Object.assign({}, k.avatar, { [cat]: o.id }), 140)}<h2>${esc(o.name || 'New look')}</h2>
      <p class="muted">Unlock for ${o.cost} coins? You have ${k.coins.toLocaleString()}.</p>
      <div class="row" style="width:100%"><button class="btn btn-line grow" data-act="close-sheet">Not now</button><button class="btn btn-primary grow" data-act="buyav" data-cat="${cat}" data-id="${o.id}" ${k.coins < o.cost ? 'disabled' : ''}>${k.coins < o.cost ? `Need ${o.cost - k.coins} more` : 'Unlock'}</button></div></div>`);
  },
  buyav(t) { const k = kid(), cat = t.dataset.cat, o = AV[cat].find(x => x.id === t.dataset.id); if (k.coins < o.cost) return; k.coins -= o.cost; k.owned.push(`${cat}:${o.id}`); k.avatar[cat] = o.id; save(); sfx('coin'); confetti(80); closeSheet(); rerender(); },
  ktab(t) { UI.ktab = t.dataset.t; rerender(); },
  buyitem(t) {
    const k = kid(), it = KITCHEN.find(x => x.id === t.dataset.id);
    if (k.kitchen.includes(it.id)) return toast(`${it.name} is already in your kitchen`);
    openSheet(`<div class="section" style="align-items:center;text-align:center"><span style="font-size:72px">${it.e}</span><h2>${esc(it.name)}</h2>${it.perk ? `<p class="pill good">${esc(it.perk)}</p>` : ''}
      <p class="muted">Costs ${it.cost} coins. You have ${k.coins.toLocaleString()}.</p>
      <div class="row" style="width:100%"><button class="btn btn-line grow" data-act="close-sheet">Not now</button><button class="btn btn-primary grow" data-act="buyconfirm" data-id="${it.id}" ${k.coins < it.cost ? 'disabled' : ''}>${k.coins < it.cost ? `Need ${it.cost - k.coins} more` : 'Buy it'}</button></div></div>`);
  },
  buyconfirm(t) { const k = kid(), it = KITCHEN.find(x => x.id === t.dataset.id); if (k.coins < it.cost) return; k.coins -= it.cost; k.kitchen.push(it.id); logIt(k, `Added ${it.name} to their kitchen`); save(); closeSheet(); sfx('coin'); confetti(90); rerender(); checkBadges(k); },
  copylist() {
    const txt = S.shopping.filter(s => !s.done).map(s => `- ${s.q ? s.q + ' ' : ''}${s.n}`).join('\n') || 'Shopping list is empty';
    const done = () => toast('List copied — paste it into a text or notes');
    try { navigator.clipboard.writeText(txt).then(done, () => showCopy(txt)); } catch (e) { showCopy(txt); }
  },
  shoptoggle(t) { const s = S.shopping.find(x => x.id === t.dataset.id); s.done = !s.done; save(); rerender(); },
  clearshop() { S.shopping = S.shopping.filter(s => !s.done); save(); rerender(); },
  react(t) { const key = kid().id + ':' + t.dataset.k; S.reacts[key] = S.reacts[key] === t.dataset.t ? null : t.dataset.t; save(); sfx('tap'); rerender(); },
  skill(t) {
    const k = kid(), s = SK(t.dataset.id);
    if (!k.skills[s.id] && !s.req.every(q => k.skills[q])) return toast(`Master ${s.req.filter(q => !k.skills[q]).map(q => SK(q).name).join(' and ')} first`);
    startLesson(s.id);
  },
  'toggle-voice'(t) { const k = kid(); k.controls.voice = !k.controls.voice; save(); t.setAttribute('aria-checked', k.controls.voice); },
  'toggle-sound'(t) { S.sound = !S.sound; save(); t.setAttribute('aria-checked', S.sound); },
  replaygame(t) { closeSheet(); go('game', { id: t.dataset.id }, { replace: true }); },
  taste(t) { const w = kid().wall.find(x => x.id === t.dataset.wid); if (w) { w.rating = +t.dataset.v; save(); } $$('.taste button').forEach(b => b.setAttribute('aria-pressed', b === t)); sfx('tap'); },

  /* player */
  pexit() {
    if (!P) return back();
    if (P.mode === 'lesson' || P.preview || P.done.size === 0) { stopNarr(); P = null; return back(); }
    pauseNarr();
    openSheet(`<div class="section" style="text-align:center;align-items:center"><span style="font-size:48px">🍳</span><h2>Leave this cook-along?</h2><p class="muted">You’re ${P.done.size} clips in. Stars and coins come when you finish.</p>
      <div class="row" style="width:100%"><button class="btn btn-line grow" data-act="pleave">Leave</button><button class="btn btn-go grow" data-act="close-sheet">Keep cooking</button></div></div>`);
  },
  pleave() { closeSheet(); stopNarr(); P = null; back(); },
  ptoggle() { togglePlay(); },
  pprev() { loadClip(P.i - 1, true); },
  pnext() { loadClip(P.i + 1, true); },
  pback() { loadClip(P.i - 1, true); },
  pspeed(t) { P.speed = P.speed === 1 ? 0.75 : P.speed === 0.75 ? 1.25 : 1; t.textContent = P.speed + '×'; if (P.playing) { cancelSpeech(); speakFrom(Math.max(0, P.wi)); } },
  pcap(t) { P.bigCap = !P.bigCap; $('#caps').classList.toggle('big', P.bigCap); t.setAttribute('aria-pressed', P.bigCap); },
  pvoice() { const k = kid(); k.controls.voice = !k.controls.voice; save(); updateVoiceBtn(); if (!k.controls.voice) cancelSpeech(); else if (P.playing) speakFrom(Math.max(0, P.wi)); },
  async pcounter(t) {
    const on = !$('#player').classList.contains('counter-mode');
    $('#player').classList.toggle('counter-mode', on); t.setAttribute('aria-pressed', on); P.bigCap = on; $('#caps').classList.toggle('big', on);
    if (on) { try { P.wake = await navigator.wakeLock?.request('screen'); } catch (e) {} try { await document.documentElement.requestFullscreen?.(); } catch (e) {} toast('Counter mode: screen stays awake, text gets big'); }
    else { P.wake?.release?.().catch(() => {}); if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); }
  },
  pcook() { P.preview = false; loadClip(0, true); },
  didit(t) { didIt(t); },
  mise(t) { const i = +t.dataset.i; P.gathered.has(i) ? P.gathered.delete(i) : P.gathered.add(i); sfx('tap'); renderSide(); },
  clean(t) { const i = +t.dataset.i; P.cleaned.has(i) ? P.cleaned.delete(i) : P.cleaned.add(i); sfx('tap'); renderSide(); },
  finish() { finishRecipe(); },
  tstart() { timerStart(); },
  tpause() { stopTimer(); renderSide(); },
  tskip() { timerDone(); },
  watchhow(t) { watchHow(t.dataset.id); },
  qstart() { stopNarr(); quest(kid(), 'learn'); P.phase = 'quiz'; P.q = 0; P.score = 0; P.answered = null; renderSide(); },
  qa(t) { if (P.answered != null) return; const q = P.skill.quiz[P.q]; P.answered = +t.dataset.i; if (P.answered === q.c) { P.score++; sfx('coin'); } else sfx('wrong'); renderSide(); },
  qnext() { P.answered = null; if (P.q < P.skill.quiz.length - 1) { P.q++; renderSide(); } else lessonResult(); },
  lretry() { P.phase = 'watch'; P.q = 0; P.score = 0; P.answered = null; loadClip(0, true); },

  /* parent */
  pin(t) {
    UI.pin = (UI.pin || '') + t.dataset.d; sfx('tap');
    if (UI.pin.length < 4) { $$('#pindots i').forEach((d, i) => d.classList.toggle('on', i < UI.pin.length)); return; }
    if (UI.pin === S.parent.pin) { UI.pz = true; UI.pin = ''; UI.pkid = UI.pkid || S.active || S.kids[0].id; rerender(); }
    else { UI.pin = ''; sfx('wrong'); const d = $('#pindots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); $$('#pindots i').forEach(x => x.classList.remove('on')); toast('That PIN didn’t match. Try again.'); }
  },
  pindel() { UI.pin = (UI.pin || '').slice(0, -1); $$('#pindots i').forEach((d, i) => d.classList.toggle('on', i < UI.pin.length)); },
  ptab(t) { UI.ptab = t.dataset.t; rerender(); },
  pkid(t) { UI.pkid = t.dataset.id; rerender(); },
  ctl(t) { const k = S.kids.find(x => x.id === UI.pkid); k.controls[t.dataset.k] = !k.controls[t.dataset.k]; save(); rerender(); },
  ctlknife(t) { const k = S.kids.find(x => x.id === UI.pkid); k.controls.knife = +t.dataset.v; save(); rerender(); },
  ctllimit(t) { const k = S.kids.find(x => x.id === UI.pkid); k.controls.limit = +t.dataset.v; save(); rerender(); },
  ctlage(t) { const k = S.kids.find(x => x.id === UI.pkid); k.age = Math.max(4, Math.min(12, k.age + +t.dataset.d)); save(); rerender(); },
  ctldefaults() { const k = S.kids.find(x => x.id === UI.pkid); Object.assign(k.controls, DEFAULT_CONTROLS(k.age)); save(); toast(`Recommended settings for age ${k.age} applied`); rerender(); },
  pref(t) { S.parent.prefs[t.dataset.k] = !S.parent.prefs[t.dataset.k]; save(); rerender(); },
  addweek() { let n = 0; Object.values(S.parent.meal).filter(Boolean).forEach(id => n += addToList(R(id))); toast(n ? `Added ${n} items to the shopping list` : 'Everything is already on the list'); },
  approve(t) { const k = S.kids.find(x => x.id === t.dataset.kid), w = k.wall.find(x => x.id === t.dataset.w); w.status = t.dataset.ok === '1' ? 'approved' : 'private'; save(); toast(w.status === 'approved' ? `${k.name}’s post is live in Chef Club` : 'Kept private'); rerender(); },
  setplan(t) { S.parent.plan = t.dataset.v; save(); if (t.dataset.v === 'premium') { confetti(120); toast('Premium is on (demo — no charge)'); } rerender(); },
  buypack(t) { if (S.parent.plan !== 'premium') return; S.parent.packs.push(t.dataset.id); save(); confetti(120); toast(`${PACKS[t.dataset.id].name} unlocked for the whole family`); rerender(); },
  rmkid(t) {
    if (UI.rmArm !== t.dataset.id) { UI.rmArm = t.dataset.id; return rerender(); }
    UI.rmArm = null; S.kids = S.kids.filter(x => x.id !== t.dataset.id); if (S.active === t.dataset.id) S.active = null; UI.pkid = S.kids[0].id; save(); rerender();
  },
  resetfresh() { if (UI.resetArm !== 'fresh') { UI.resetArm = 'fresh'; return rerender(); } UI.resetArm = null; const s = seed(); s.kids = [makeKid({ id: 'k' + Date.now(), name: 'Chef', age: 7 })]; S = s; UI.pkid = S.kids[0].id; save(); toast('Fresh start — rename your chef below'); UI.ptab = 'family'; rerender(); },
  resetsample() { if (UI.resetArm !== 'sample') { UI.resetArm = 'sample'; return rerender(); } UI.resetArm = null; S = seed(); UI.pkid = S.kids[0].id; save(); toast('Sample family reloaded'); rerender(); },
};
function showCopy(txt) {
  openSheet(`<h2>Copy your list</h2><p class="muted">Select the text and copy it.</p><textarea id="copyBox" style="min-height:180px;border-radius:14px;border:2px solid var(--line);padding:12px;background:var(--surface);font:inherit">${esc(txt)}</textarea><button class="btn btn-primary" data-act="close-sheet">Done</button>`);
  setTimeout(() => $('#copyBox')?.select(), 60);
}
const CHG = {
  meal(t) { S.parent.meal[t.dataset.d] = t.value; save(); },
  kidname(t) { const k = S.kids.find(x => x.id === t.dataset.id); const v = t.value.trim().slice(0, 16); if (v) { k.name = v; save(); toast('Name saved'); } },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act]'); if (!t || t.disabled) return;
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go, { id: t.dataset.id }); }
  const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('change', e => { const t = e.target.closest('[data-change]'); if (t) CHG[t.dataset.change]?.(t); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.sheet-bg')) closeSheet(); });

/* ---------- daily minutes + friendly break ---------- */
UI.extra = 0;
setInterval(() => {
  const k = kid(); if (!k || document.visibilityState !== 'visible' || ['landing', 'parent'].includes(route.name)) return;
  const d = TODAY(); k.minutes[d] = (k.minutes[d] || 0) + 1; save();
  const lim = k.controls.limit;
  if (lim && k.minutes[d] >= lim + UI.extra && !$('.sheet-bg')) {
    if (P?.playing) pauseNarr();
    openSheet(`<div class="section" style="text-align:center;align-items:center"><span style="font-size:56px">⏰</span><h2>Break time, chef!</h2>
      <p class="muted">You’ve been in the kitchen for ${k.minutes[d]} minutes today. Go show someone what you made!</p>
      <div class="grownup" style="width:100%"><b>Grown-up: add 15 more minutes</b><button class="hold" id="holdBtn"><i></i><span>Press &amp; hold</span></button></div></div>`);
    const b = $('#holdBtn'); let raf = 0, t0 = 0; const fill = b.querySelector('i');
    const stop = () => { cancelAnimationFrame(raf); fill.style.width = 0; };
    const step = now => { const f = Math.min(1, (now - t0) / 1500); fill.style.width = f * 100 + '%'; if (f >= 1) { UI.extra += 15; closeSheet(); toast('15 more minutes added'); } else raf = requestAnimationFrame(step); };
    b.addEventListener('pointerdown', e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  }
}, 60000);

/* ---------- boot ---------- */
if (S.active && kid()) { ensureQuests(kid()); route = { name: 'home', p: {} }; }
render();
</script>

</body>
</html>
