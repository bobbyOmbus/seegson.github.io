  const i = S.inspections.find((x) => x.id === id); if (!i) return; const s = M.signMap.get(i.signId);

  const checks = Object.entries(i.checks || {}), pan = Object.entries(i.panels || {});

  modal(`<div class="mf"><div class="row" style="justify-content:space-between"><h2>${esc(s?.market)} ${esc(s?.code)}</h2>${condHTML(i.condition)}</div>

    <p class="help">${niceDate(i.date)}${i.inspector ? " · " + esc(i.inspector) : ""}</p><div class="scroll">

    ${i.notes ? `<p>${esc(i.notes)}</p>` : ""}

    ${checks.length ? `<div class="sect"><span class="lbl">Checklist</span><div class="chk">${checks.map(([c, v]) => `<div class="chk-i"><span>${esc(c)}</span><span class="pill ${v ? "full" : "bad"}">${v ? "Yes" : "No"}</span></div>`).join("")}</div></div>` : ""}

    ${pan.length ? `<div class="sect"><span class="lbl">Panels</span><div class="chk">${pan.map(([lid, v]) => `<div class="chk-i"><span>${esc(cName(S.leases.find((l) => l.id === lid)?.clientId))}</span><span class="pill ${v === "OK" ? "full" : "bad"}">${esc(v)}</span></div>`).join("")}</div></div>` : ""}

    ${i.photos?.length ? `<div class="sect"><span class="lbl">Photos</span><div class="thumbs" id="iv-ph">${i.photos.map((p) => `<span class="ph" data-ph="${p}">Loading</span>`).join("")}</div></div>` : ""}

    ${i.repair?.needed ? `<div class="note ${i.repair.status === "Fixed" ? "" : "red"}"><b>Repair: ${esc(i.repair.status)}</b> · ${esc(i.repair.what || "No details")}${i.repair.fixed ? " · fixed " + niceDate(i.repair.fixed) : ""}</div>` : ""}

    </div><div class="mfoot">${i.repair?.needed ? `<button class="btn" type="button" id="iv-r" style="margin-right:auto">Update repair</button>` : ""}<button class="btn" type="button" id="iv-e">Edit</button><button class="btn pri" type="button" data-cancel>Close</button></div></div>`, (r) => {

    if (i.photos?.length) fillThumbs(r.querySelector("#iv-ph"), i.photos).then(() => r.querySelectorAll("#iv-ph img").forEach((im) => { im.style.width = "140px"; im.style.height = "140px"; }));

    r.querySelector("#iv-e").onclick = () => inspectionForm({ id });

    const rb = r.querySelector("#iv-r"); if (rb) rb.onclick = () => repairForm(id);

  }, true);

}

function repairForm(id) {

  const i = S.inspections.find((x) => x.id === id); if (!i) return; const s = M.signMap.get(i.signId);

  modal(`<div class="mf"><h2>Repair on ${esc(s?.code)}</h2><p class="help">${esc(i.repair.what || i.condition)} · found ${niceDate(i.date)}</p>

    <div class="seg2" id="rf-s">${["Open", "Scheduled", "Fixed"].map((x) => `<button type="button" class="${x === "Fixed" ? "good" : x === "Scheduled" ? "warn" : "bad"}" data-v="${x}" aria-pressed="${i.repair.status === x}">${x}</button>`).join("")}</div>

    <div class="fld" id="rf-dw"><label for="rf-d">Date fixed</label><input class="input" id="rf-d" type="date" value="${esc(i.repair.fixed || TODAY)}"></div>

    <div class="checks" id="rf-aw"></div>

    <div class="mfoot"><button class="btn" type="button" data-cancel>Cancel</button><button class="btn pri" type="button" data-ok>Save</button></div></div>`, (r) => {

    let v = i.repair.status; const q = (x) => r.querySelector(x);

    const sync = () => { q("#rf-dw").hidden = v !== "Fixed"; const sig = S.signs.find((x) => x.id === i.signId); q("#rf-aw").innerHTML = v === "Fixed" && sig && sig.status !== "Active" ? `<label style="white-space:normal"><input type="checkbox" id="rf-act" checked> Set ${esc(sig.code)} back to Active</label>` : ""; };

    q("#rf-s").onclick = (e) => { const b = e.target.closest("[data-v]"); if (!b) return; v = b.dataset.v; q("#rf-s").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); sync(); }; sync();

    q("[data-ok]").onclick = () => { snapshot(); i.repair.status = v; i.repair.fixed = v === "Fixed" ? q("#rf-d").value : ""; if (q("#rf-act")?.checked) S.signs.find((x) => x.id === i.signId).status = "Active"; closeModal(); save(v === "Fixed" ? "Repair marked fixed" : `Repair ${v.toLowerCase()}`, true); };

  });

}

      <div class="row"><div class="chips" id="cv">${[["dir", "Directory"], ["rank", "Most valuable"]].map(([k, l]) => `<button type="button" class="chip" data-v="${k}" aria-pressed="${ui.cview === k}">${l}</button>`).join("")}</div><button class="btn pri" type="button" id="c-new">${ICON.plus} Add a client</button></div></div><div id="cbody"></div>`;

function directory() {

  const types = ["All", ...CTYPES.filter((t) => M.clients.some((c) => c.type === t))];

  const list = M.clients.filter((c) => (ui.ctype === "All" || c.type === ui.ctype) && qMatch(ui.cq, c.name + " " + (c.aliases || []).join(" ") + " " + c.contact + " " + c.communities.join(" "))).sort((a, b) => b.mrr - a.mrr || a.name.localeCompare(b.name));

  if (!ui.client || !M.clients.some((c) => c.id === ui.client)) ui.client = list[0]?.id || null;

  $("cbody").innerHTML = `<div class="cdir"><div class="card clist"><label class="search" style="display:block;margin-bottom:8px">${ICON.search}<input class="input" id="cq" type="search" placeholder="Search clients or communities" aria-label="Search clients" value="${esc(ui.cq)}"></label>

      <div class="chips" id="ct" style="margin-bottom:6px">${types.map((t) => `<button type="button" class="chip" data-t="${esc(t)}" aria-pressed="${ui.ctype === t}" style="padding:5px 10px 3px;font-size:13px">${t === "All" ? "All types" : esc(t)}</button>`).join("")}</div>

      <div id="cl">${list.map((c) => `<button type="button" class="citem" data-c="${esc(c.id)}" aria-current="${c.id === ui.client}"><span class="grow"><b>${esc(c.name)}</b><small>${esc(c.type)} · ${c.panels} panel${c.panels === 1 ? "" : "s"}</small></span><span class="r">${c.mrr ? money(c.mrr) : "$0"}</span></button>`).join("") || `<div class="empty">No clients match.</div>`}</div></div>

    <div class="card prof" id="prof"></div></div>`;

  let t; $("cq").oninput = (e) => { clearTimeout(t); const pos = e.target.selectionStart; t = setTimeout(() => { ui.cq = e.target.value.trim(); directory(); const n = $("cq"); n.focus(); n.setSelectionRange(pos, pos); }, 200); };

  $("ct").onclick = (e) => { const b = e.target.closest("[data-t]"); if (b) { ui.ctype = b.dataset.t; saveUi(); directory(); } };

  $("cl").onclick = (e) => { const b = e.target.closest("[data-c]"); if (b) { ui.client = b.dataset.c; saveUi(); directory(); if (innerWidth < 980) $("prof").scrollIntoView({ behavior: "smooth" }); } };

  profile();

}

function profile() {

  const c = M.clients.find((x) => x.id === ui.client), el = $("prof");

  if (!c) { el.innerHTML = `<div class="empty"><b>No client selected.</b></div>`; return; }

  const rank = [...M.clients].sort((a, b) => b.mrr - a.mrr).findIndex((x) => x.id === c.id) + 1;

  const byM = {}; c.cur.forEach((l) => { const s = M.signMap.get(l.signId); if (!s) return; (byM[s.market] ||= []).push({ l, s }); });

  const events = []; c.leases.forEach((l) => { const s = M.signMap.get(l.signId); const where = s ? `${s.market} ${s.code}` : "a removed sign"; if (l.start) events.push({ d: l.start, cls: "", t: `${l.start > TODAY ? "Booked" : "Started"} ${l.panels} panel${l.panels > 1 ? "s" : ""} on ${where}${l.community ? " for " + l.community : ""}` }); if (l.end && l.end <= TODAY) events.push({ d: l.end, cls: "end", t: `Ended ${l.panels} panel${l.panels > 1 ? "s" : ""} on ${where}` }); });

  S.inspections.forEach((i) => Object.entries(i.panels || {}).forEach(([lid, v]) => { if (v !== "OK" && c.leases.some((l) => l.id === lid)) { const s = M.signMap.get(i.signId); events.push({ d: i.date, cls: "insp", t: `Inspection: panel on ${s?.code || "sign"} ${v.toLowerCase()}` }); } }));

  events.sort((a, b) => (a.d < b.d ? 1 : -1));

  const month = new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" });

  const summary = `${c.name}: sign panel lease, ${month}\n\n${Object.entries(byM).flatMap(([m, rows]) => rows.map(({ l, s }) => `${m} ${s.code}${s.sides.length > 1 ? " " + l.side : ""}: ${l.panels} panel${l.panels > 1 ? "s" : ""}${l.community ? " (" + l.community + ")" : ""}  ${kind(l) === "paid" ? (billing(l) ? money(l.rate * l.panels) : "starts " + niceDate(l.start)) : kind(l) === "free" ? "no charge" : "no price set"}`)).join("\n")}\n\nTotal this month: ${money(c.mrr)} for ${c.panels} panel${c.panels === 1 ? "" : "s"}`;

  el.innerHTML = `<div class="prof-h"><div><div class="row" style="gap:8px">${tierHTML(c.tier)}<span class="pill grey">${esc(c.type)}</span>${c.mrr ? `<span class="pill grey">#${rank} by billing</span>` : ""}</div><h2 style="margin-top:8px">${esc(c.name)}</h2>

      <div class="contact" style="margin-top:8px">${c.contact ? `<span>👤 ${esc(c.contact)}</span>` : ""}${c.phone ? `<span>☎ ${esc(c.phone)}</span>` : ""}${c.email ? `<span>✉ ${esc(c.email)}</span>` : ""}${!c.contact && !c.phone && !c.email ? `<span style="color:var(--muted)">No contact details yet. <button class="btn link" type="button" data-cedit style="padding:0">Add them</button></span>` : ""}</div>

      ${c.notes ? `<p style="margin-top:6px;color:var(--ink-2)">${esc(c.notes)}</p>` : ""}</div>

      <div class="row"><button class="btn" type="button" data-cedit>Edit</button><button class="btn" type="button" id="p-copy">Copy billing summary</button><button class="btn pri" type="button" id="p-lease">${ICON.plus} Lease a panel</button></div></div>

    <div class="stats5"><div><small>Per month</small><b>${money(c.mrr)}</b></div><div><small>Per year</small><b>${money(c.mrr * 12)}</b></div><div><small>Billed to date</small><b>${money(c.lifetime)}</b></div><div><small>Panels · signs</small><b>${c.panels} · ${c.signs}</b></div><div><small>Client since</small><b style="font-size:17px;padding-top:3px">${c.since ? niceDate(c.since, true) : "—"}</b></div></div>

    ${c.atRisk ? `<div class="note red"><b>${c.atRisk} panel${c.atRisk > 1 ? "s are" : " is"} on a damaged or missing sign.</b> Fix it before the client notices.</div>` : ""}

function whatIf(mrr) {

  const pools = M.markets.map((m) => { const ss = M.signs.filter((s) => s.market === m); return { open: ss.reduce((a, s) => a + s.open, 0), rate: M.rates[m] || 85 }; });

  let run = mrr, cash = 0, fullAt = 0; const pts = [{ v: run, label: "Today" }];

  for (let i = 1; i <= ui.months; i++) { const avail = pools.reduce((a, p) => a + p.open, 0); if (avail > 0) pools.forEach((p) => { const n = Math.min(p.open, (ui.sell * p.open) / avail); p.open -= n; run += n * p.rate; }); else if (!fullAt) fullAt = i; cash += run; pts.push({ v: run, label: "Month " + i }); }

  $("wi-a").innerHTML = ui.sell ? `Selling <b>${ui.sell} panels a month</b>, you'd bill <b>${money(run)} a month</b> in ${ui.months} months. That's <b>+${money(run - mrr)}</b> a month and <b>${money(cash - mrr * ui.months)}</b> more cash over that time.${fullAt ? ` Every sign is full by month ${fullAt - 1}.` : ""}` : "Move the slider to see what selling more panels would add.";

  $("wi-c").innerHTML = line(pts, { h: 150, base: mrr });

}

function growth() {

  const paid = S.leases.filter((l) => l.start && l.start <= TODAY && !l.free && l.rate > 0);

  if (!paid.length) { $("grow").innerHTML = `<p class="sub">No start dates yet.</p>`; return; }

  const first = paid.map((l) => l.start.slice(0, 7)).sort()[0], end = TODAY.slice(0, 7); const pts = []; let [y, m] = first.split("-").map(Number);

  while (`${y}-${String(m).padStart(2, "0")}` <= end) { const k = `${y}-${String(m).padStart(2, "0")}`, ref = k + "-28"; const v = paid.filter((l) => l.start.slice(0, 7) <= k && (!l.end || l.end > ref)).reduce((a, l) => a + l.rate * l.panels, 0); pts.push({ v, label: new Date(k + "-15T12:00").toLocaleDateString("en-US", { month: "short", year: "numeric" }), year: m === 1 ? y : null }); m++; if (m > 12) { m = 1; y++; } }

  $("grow").innerHTML = line(pts, { h: 190, zero: true });

}

function ticks(lo, hi, n) { const raw = (hi - lo) / n || 1, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; const out = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * .999; v += step) out.push(v); return out; }

function line(pts, o) {

  const W = 560, H = o.h, L = 50, R = 12, T = 10, B = 22, vals = pts.map((p) => p.v);

  const t = ticks(o.zero ? 0 : Math.min(...vals) * .97, Math.max(...vals), 4), lo = t[0], hi = t[t.length - 1];

  const x = (i) => L + (i / Math.max(pts.length - 1, 1)) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);

  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");

  const fmt = (v) => (v >= 1000 ? "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "k" : "$" + v);

  let g = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart">`;

  t.forEach((v) => (g += `<line class="g" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`));

  if (pts.some((p) => p.year)) pts.forEach((p, i) => { if (p.year) g += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${p.year}</text>`; });

  else [0, Math.floor((pts.length - 1) / 2), pts.length - 1].forEach((i) => (g += `<text x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${esc(pts[i].label)}</text>`));

  if (o.base != null) g += `<line x1="${L}" x2="${W - R}" y1="${y(o.base)}" y2="${y(o.base)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;

  g += `<path d="${d} L${x(pts.length - 1)},${y(lo)} L${x(0)},${y(lo)} Z" fill="var(--accent)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1].v)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`;

  const w = (W - L - R) / Math.max(pts.length - 1, 1);

  pts.forEach((p, i) => (g += `<rect x="${x(i) - w / 2}" y="${T}" width="${w}" height="${H - T - B}" fill="transparent" data-tip="${esc(`${p.label}: <b>${money(p.v)}</b>/mo`)}"/>`));

  return g + "</svg>";

}

function loadXLSX() { if (window.XLSX) return Promise.resolve(window.XLSX); return xlsxLib ||= new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "[https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js](https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js)"; sc.onload = () => res(window.XLSX); sc.onerror = () => { xlsxLib = null; rej(new Error("Couldn't load the Excel reader. Check the internet connection and try again.")); }; document.head.appendChild(sc); }); }

async function readBook(file) { const X = await loadXLSX(); const wb = X.read(await file.arrayBuffer(), { cellDates: true }); return wb.SheetNames.map((n) => ({ name: n, rows: X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }) })); }

const CLEAN = [[/^kb( homes?)?$/i, "KB Home"], [/^(rah|richmond american( homes)?)$/i, "Richmond American"], [/^(pulte|putle)( homes)?$/i, "Pulte Homes"], [/^ri(s)?ewell$/i, "Risewell"], [/^century( communities| trails-s)?$/i, "Century Communities"], [/^lennar( homes)?$/i, "Lennar"], [/^(tm|taylor morrison)$/i, "Taylor Morrison"], [/^(tri ?pointe( homes)?|trip)$/i, "Tri Pointe Homes"], [/^dw$/i, "David Weekley Homes"], [/^drb( homes)?$/i, "DRB Homes"], [/^mcstain$/i, "McStain"], [/^aurora highlands( llc)?$/i, "Aurora Highlands LLC"], [/^work ?shop$/i, "Workshop"], [/^blvd builders$/i, "BLVD Builders"], [/^toll brothers$/i, "Toll Brothers"], [/^trumark homes$/i, "Trumark Homes"], [/^hba$/i, "HBA"], [/^lgi homes$/i, "LGI Homes"], [/^oakwood homes$/i, "Oakwood Homes"], [/^dream finders( homes)?$/i, "Dream Finders Homes"], [/^brookfield( residential)?$/i, "Brookfield Residential"]];

const titleIfCaps = (s) => (s === s.toUpperCase() && /[A-Z]/.test(s) ? s.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase()) : s);

function matchClient(raw) {

  const s = String(raw).replace(/\s+/g, " ").trim(); const n = norm(s);

  const ex = S.clients.find((c) => norm(c.name) === n || (c.aliases || []).some((a) => norm(a) === n)); if (ex) return { name: ex.name, id: ex.id };

  const hit = CLEAN.find(([re]) => re.test(s)); const name = hit ? hit[1] : titleIfCaps(s);

  const ex2 = S.clients.find((c) => norm(c.name) === norm(name)); return { name, id: ex2?.id || null };

}

const cleanComm = (raw) => { if (raw == null) return ""; const s = String(raw).replace(/\s+/g, " ").trim(); if (!s || s === "?" || /^no idea$/i.test(s)) return ""; if (/^all$/i.test(s)) return "All communities"; if (/^brighton crossings$/i.test(s)) return "Brighton Crossing"; return titleIfCaps(s); };

function toISO(v) { if (v == null || v === "") return ""; if (v instanceof Date) return isNaN(v) ? "" : new Date(v.getTime() + 12 * 36e5).toISOString().slice(0, 10); const s = String(v).trim(); let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`; m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/); if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`; } return ""; }

const STATUSW = { "NOT THERE": "Missing", "NOT ON MAP": "Not on map", "LAYING ON GROUND": "Down / damaged" };

function sheetMeta(name, codes) {

  const faced = codes.some((k) => /^[A-Z]+-\d+\s*(NB|SB|EB|WB)$/i.test(k));

  if (/fusion/i.test(name)) return { market: "Aurora", owner: "Fusion kiosks", prefix: "F", faced: false };

  const market = name.trim().replace(/\s*kiosks?$/i, "").replace(/\b\w/g, (c) => c.toUpperCase());

  if (faced) return { market, owner: "Kiosk Key", prefix: "", faced: true };

  const known = S.signs.map((s) => s.market === market && s.owner === "Fusion kiosks" && s.code.match(/^([A-Z]+)-\d+$/)).find(Boolean);

  const words = market.split(/\s+/); const prefix = market === "Timnath" ? "" : known ? known[1] : (words.length > 1 ? words.map((w) => w[0]).join("") : market[0] + (market.slice(1).match(/[bcdfghjklmnpqrstvwxz]/i)?.[0] || market[1])).toUpperCase();

  return { market, owner: "Fusion kiosks", prefix, faced: false };

}

function parseOld(books) {

  const out = { sheets: [], signs: [], leases: [], renames: {}, newClients: new Set(), issues: 0 };

  for (const sh of books) {

    const rows = sh.rows, hi = rows.findIndex((r) => r && /kiosk/i.test(String(r[0] ?? "")) && r.some((c) => /client/i.test(String(c ?? ""))));

    if (hi < 0) continue;

    const h = rows[hi].map((c) => String(c ?? "").toLowerCase().trim()), col = (re) => h.findIndex((c) => re.test(c));

    const iD = col(/date/), iC = col(/client/), iCm = col(/community|project/), iN = col(/panels/), iR = col(/lease|per month/), iT = col(/total/);

    const body = rows.slice(hi + 1).filter((r) => r && r[0] != null && !(r[0] instanceof Date) && String(r[0]).trim());

    if (!body.length) continue;

    const meta = sheetMeta(sh.name, body.map((r) => String(r[0]).trim().toUpperCase()));

    const smap = new Map(); let mrr = 0, n = 0;

    for (const r of body) {

      const ks = String(r[0]).replace(/\s+/g, " ").trim(); let code, side = "Main";

      if (meta.faced) { const m = ks.toUpperCase().match(/^([A-Z]+-\d+)\s*(NB|SB|EB|WB)?$/); code = m ? m[1] : ks.toUpperCase(); side = m && m[2] ? m[2] : "Main"; }

      else if (meta.prefix) code = `${meta.prefix}-${/^\d+(\.0)?$/.test(ks) ? parseInt(ks, 10) : ks}`; else code = ks.toUpperCase().replace(/^TR(\d)$/, "TR-$1");

      const id = `${meta.market}|${meta.owner}|${code}`;

      let s = smap.get(id); if (!s) { const prev = S.signs.find((x) => x.id === id); s = { id, code, market: meta.market, owner: meta.owner, sides: [], slots: prev ? prev.slots : meta.market === "Timnath" ? 2 : meta.faced ? 5 : 10, status: "Active", location: prev?.location || "", notes: prev?.notes || "" }; smap.set(id, s); }

      if (!s.sides.includes(side)) s.sides.push(side);

      const dv = r[iD], cv = r[iC], ds = typeof dv === "string" ? dv.trim().toUpperCase() : "", cs = typeof cv === "string" ? cv.trim().toUpperCase() : "";

      if (STATUSW[ds] || STATUSW[cs]) { s.status = STATUSW[ds] || STATUSW[cs]; s.notes = s.notes || `Spreadsheet says: ${ds || cs}`; out.issues++; continue; }

      if (cv == null || !cs || cs === "EMPTY") continue;

      const mc = matchClient(cv), raw = String(cv).trim();

      if (raw !== mc.name) (out.renames[raw + " → " + mc.name] = (out.renames[raw + " → " + mc.name] || 0) + 1);

      if (!mc.id) out.newClients.add(mc.name);

      const panels = typeof r[iN] === "number" ? r[iN] : parseInt(r[iN], 10) || 1; if (panels <= 0) continue;

      const rate = typeof r[iR] === "number" ? r[iR] : parseFloat(r[iR]) || 0, total = typeof r[iT] === "number" ? r[iT] : parseFloat(r[iT]) || 0;

      const rt = mc.name === "HBA" ? 0 : total && Math.abs(rate * panels - total) > .01 ? total / panels : rate || (total ? total / panels : 0);

      const start = toISO(dv); if (!start) out.issues++;

      out.leases.push({ signId: id, side, clientName: mc.name, raw, community: cleanComm(r[iCm]), panels, rate: rt, free: mc.name === "HBA", start, end: "", notes: "", source: "spreadsheet" });

      mrr += mc.name === "HBA" ? 0 : rt * panels; n++;

    }

    out.signs.push(...smap.values()); out.sheets.push({ name: sh.name, market: meta.market, owner: meta.owner, signs: smap.size, leases: n, mrr });

  }

  return out;

}

function preview(p) {

  const total = p.sheets.reduce((a, s) => a + s.mrr, 0), ren = Object.entries(p.renames).sort((a, b) => b[1] - a[1]);

  const replacing = new Set(p.sheets.map((s) => s.market + "|" + s.owner)), touched = S.leases.filter((l) => replacing.has(l.signId.split("|").slice(0, 2).join("|")) && l.source === "app").length;

  modal(`<div class="mf"><h2>Here's what we found</h2><div class="scroll">

    <div class="wiz-list">${p.sheets.map((s) => `<div><span><b>${esc(s.name)}</b> → ${esc(s.market)} (${esc(s.owner)})</span><span>${s.signs} signs · ${s.leases} leases · ${money(s.mrr)}/mo</span></div>`).join("")}</div>

    <p><b>${p.signs.length} signs, ${p.leases.length} leases, ${money(total)} a month.</b> ${p.issues ? `${p.issues} entries need a look afterwards (missing dates or flagged signs). They'll show on Home.` : ""}</p>

    ${ren.length ? `<div class="sect"><span class="lbl">Names we'll clean up (${ren.length})</span><div class="wiz-list">${ren.map(([k, n]) => `<div><span>${esc(k)}</span><span>${n}×</span></div>`).join("")}</div></div>` : ""}

    ${p.newClients.size ? `<div class="sect"><span class="lbl">New clients we'll add (${p.newClients.size})</span><div class="row">${[...p.newClients].map((c) => `<span class="pill grey">${esc(c)}</span>`).join("")}</div></div>` : ""}

    <div class="radio"><label><input type="radio" name="wz-mode" value="markets" checked><span><b>Replace just these markets</b><small>Signs and leases for the markets above are swapped for what's in the file. Clients, inspections and other markets stay.</small></span></label>

      <label><input type="radio" name="wz-mode" value="all"><span><b>Replace all signs and leases</b><small>Start the sign and lease records over from these files. Clients and inspections stay.</small></span></label></div>

    ${touched ? `<div class="note amb">${touched} lease${touched > 1 ? "s" : ""} entered in the app for these markets will be replaced. Download a backup first if you want to keep them.</div>` : ""}

    </div><div class="mfoot"><button class="btn" type="button" data-cancel>Cancel</button><button class="btn pri" type="button" data-ok>Import</button></div></div>`, (r) => {

    r.querySelector("[data-ok]").onclick = () => {

      const all = r.querySelector('input[name="wz-mode"]:checked').value === "all"; snapshot();

      const ids = {}; for (const name of new Set(p.leases.map((l) => l.clientName))) { let c = S.clients.find((x) => norm(x.name) === norm(name)); if (!c) { c = { id: uid("c"), name, type: name === "HBA" ? "Association" : / llc$/i.test(name) ? "Developer" : "Builder", contact: "", email: "", phone: "", notes: "", aliases: [] }; S.clients.push(c); } ids[name] = c.id; }

      for (const l of p.leases) { const c = S.clients.find((x) => x.id === ids[l.clientName]); if (l.raw !== c.name && !(c.aliases || []).includes(l.raw)) (c.aliases ||= []).push(l.raw); }

      const keepSign = (s) => !all && !replacing.has(s.market + "|" + s.owner);

      const kept = S.signs.filter(keepSign), keptIds = new Set(kept.map((s) => s.id));

      S.signs = [...kept, ...p.signs]; S.leases = [...S.leases.filter((l) => keptIds.has(l.signId)), ...p.leases.map(({ clientName, raw, ...l }) => ({ id: uid("l"), clientId: ids[clientName], ...l }))];

      const live = new Set(S.signs.map((s) => s.id)); S.inspections = S.inspections.filter((i) => live.has(i.signId));

      closeModal(); save(`Imported ${p.leases.length} leases on ${p.signs.length} signs`, true);

    };

  }, true);

}

function framed() { try { return window.self !== window.top; } catch (e) { return true; } }

function download(name, blob) { if (framed()) return false; try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); return true; } catch (e) { return false; } }

const csvOf = (rows) => rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");

async function exportExcel(err) {

  const T = tables();

  try { const X = await loadXLSX(); const wb = X.utils.book_new(); for (const [n, rows] of Object.entries(T)) { const ws = X.utils.aoa_to_sheet(rows); ws["!cols"] = rows[0].map((h, i) => ({ wch: Math.min(40, Math.max(h.length, ...rows.slice(1, 200).map((r) => String(r[i] ?? "").length)) + 2) })); X.utils.book_append_sheet(wb, ws, n); }

    const out = X.write(wb, { type: "array", bookType: "xlsx" }); if (download(`City-Wide-Signs-${TODAY}.xlsx`, new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }))) toast("Excel file downloaded"); else copy(csvOf(T.Leases), "Downloads don't work in this preview, so the lease list was copied. Paste it into Excel.");

  } catch (x) { err.textContent = x.message; }

}

let toastT;

function toast(msg, undoable) { document.querySelectorAll(".toast").forEach((t) => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.innerHTML = `<span>${esc(msg)}</span>${undoable && undoSnap ? '<button type="button">Undo</button>' : ""}`; (document.querySelector("dialog.modal[open]") || document.querySelector("dialog.drawer[open]") || document.body).appendChild(t); const b = t.querySelector("button"); if (b) b.onclick = () => { t.remove(); undo(); }; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 5000); }

async function copy(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg || "Copied"); } catch (e) { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; (document.querySelector("dialog[open]") || document.body).appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); if (ok) toast(msg || "Copied"); else modal(`<div class="mf"><h2>Copy this</h2><p class="help">Select all and copy.</p><textarea class="input num" style="min-height:220px;font-size:13px" readonly>${esc(text)}</textarea><div class="mfoot"><button class="btn" type="button" data-cancel>Close</button></div></div>`, (r) => r.querySelector("textarea").select()); } }
