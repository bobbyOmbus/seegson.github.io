<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Industrial Assistance Group — Operating System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#1B2027;
    --graphite-2:#242B33;
    --steel:#2F4858;
    --brass:#B8894F;
    --brass-bright:#D3A868;
    --paper:#F1ECE1;
    --paper-2:#E8E1D2;
    --ink:#211E1A;
    --ink-soft:#544E44;
    --moss:#4B6B4F;
    --amber:#C08A2E;
    --rust:#8B4A3B;
    --hairline:#C9BFA9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--graphite);}
  body{
    font-family:'Source Serif 4', serif;
    color:var(--ink);
    display:flex;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .slab{font-family:'Zilla Slab',serif;}

  /* ---------- LEFT RAIL ---------- */
  #rail{
    width:300px;min-width:300px;
    background:var(--graphite);color:var(--paper);
    display:flex;flex-direction:column;
    border-right:1px solid #000;
    z-index:100;
  }
  .rail-head{padding:22px 20px 16px;border-bottom:1px solid #33393f;}
  .rail-head .wordmark{font-family:'Zilla Slab',serif;font-weight:700;font-size:15px;letter-spacing:1.5px;color:var(--paper);}
  .rail-head .wordmark span{color:var(--brass-bright);}
  .rail-head .sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#8b93a0;margin-top:4px;text-transform:uppercase;}
  #railScroll{flex:1;overflow-y:auto;padding:6px 0;-webkit-overflow-scrolling:touch;}
  .rail-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#5c6570;text-transform:uppercase;padding:14px 20px 4px;}
  .spine{display:flex;align-items:center;gap:12px;padding:11px 20px;cursor:pointer;border-left:3px solid transparent;transition:background .15s;}
  .spine:hover,.spine:active{background:var(--graphite-2);}
  .spine.active{background:var(--graphite-2);border-left:3px solid var(--brass-bright);}
  .spine.locked{opacity:.42;}
  .spine-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-bright);width:20px;flex-shrink:0;}
  .spine-body{flex:1;min-width:0;}
  .spine-title{font-family:'Zilla Slab',serif;font-size:13.5px;line-height:1.25;color:var(--paper);}
  .spine-tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:#7d8794;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .gauge-mini{width:34px;height:20px;flex-shrink:0;}
  .tool-item{display:flex;align-items:center;gap:12px;padding:11px 20px;cursor:pointer;border-left:3px solid transparent;transition:background .15s;}
  .tool-item:hover,.tool-item:active{background:var(--graphite-2);}
  .tool-item.active{background:var(--graphite-2);border-left:3px solid var(--brass-bright);}
  .tool-icon{width:20px;text-align:center;font-size:13px;}
  .tool-title{font-family:'Zilla Slab',serif;font-size:13.5px;color:var(--paper);}

  .rail-foot{padding:14px 20px;border-top:1px solid #33393f;display:flex;flex-direction:column;gap:8px;}
  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{flex:1;text-align:center;padding:9px 0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#8b93a0;border:1px solid #3a414a;cursor:pointer;transition:all .15s;}
  .toggle-btn.on{background:var(--brass-bright);color:var(--graphite);border-color:var(--brass-bright);font-weight:600;}
  .edit-toggle{text-align:center;padding:8px 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#8b93a0;border:1px dashed #3a414a;cursor:pointer;}
  .edit-toggle.on{background:var(--rust);color:#fff;border-color:var(--rust);}

  .menu-btn{
    display:none;
    background:none;border:1px solid var(--hairline);
    font-family:'IBM Plex Mono',monospace;font-size:16px;
    padding:6px 10px;cursor:pointer;color:var(--ink);line-height:1;
    flex-shrink:0;
  }
  #railBackdrop{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.45);z-index:90;
  }

  /* ---------- MAIN ---------- */
  #main{flex:1;background:var(--paper);overflow-y:auto;position:relative;min-width:0;-webkit-overflow-scrolling:touch;}
  .topbar{
    position:sticky;top:0;background:var(--paper);
    border-bottom:1px solid var(--hairline);
    padding:16px 40px;display:flex;justify-content:space-between;align-items:center;z-index:5;
    gap:12px;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
  #searchbox{
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    border:1px solid var(--hairline);background:var(--paper-2);
    padding:8px 12px;width:260px;max-width:100%;color:var(--ink);outline:none;flex-shrink:1;
  }
  #searchbox::placeholder{color:#9c927d;}
  #content{padding:40px 60px 100px;max-width:800px;}

  .titleblock{border:1.5px solid var(--ink);margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;}
  .tb-cell{padding:8px 12px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);}
  .tb-cell:nth-child(4n){border-right:none;}
  .tb-cell.wide{grid-column:span 4;border-right:none;padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .tb-label{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
  .tb-value{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;}
  .tb-value.book-title{font-family:'Zilla Slab',serif;font-size:22px;font-weight:700;line-height:1.15;}
  .status-pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;color:#fff;}
  .status-done{background:var(--moss);}
  .status-pending{background:var(--brass);}
  .status-progress{background:var(--amber);}
  .status-notstarted{background:var(--rust);}
  .status-locked{background:#8a8577;}

  .link-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);background:none;border:1px solid var(--brass);padding:2px 7px;cursor:pointer;white-space:nowrap;}
  .link-btn:hover{background:var(--brass);color:#fff;}
  .toolbar-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px;flex-wrap:wrap;}

  section.chapter{margin-bottom:46px;}
  .chapter-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin:0 0 22px;gap:10px;flex-wrap:wrap;}
  h2.chapter-title{font-family:'Zilla Slab',serif;font-size:20px;font-weight:600;margin:0;}
  .sec-block{margin-bottom:30px;padding-bottom:6px;scroll-margin-top:90px;}
  .sec-block.flash{animation:flashbg 1.8s ease;}
  @keyframes flashbg{0%{background:#e9d9b8;}100%{background:transparent;}}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:6px;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
  h3.sec-title{font-family:'Zilla Slab',serif;font-size:16px;font-weight:600;margin:0;}
  .sec-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .sec-body p{font-size:15px;line-height:1.65;margin:0 0 14px;}
  .sec-body ul,.sec-body ol{margin:0 0 14px;padding-left:20px;}
  .sec-body li{font-size:15px;line-height:1.6;margin-bottom:3px;}
  .sec-body h4{font-family:'Zilla Slab',serif;font-size:14.5px;margin:16px 0 6px;}
  .note-box{background:var(--paper-2);border-left:3px solid var(--rust);padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:10px;}
  .note-box b{color:var(--ink);}
  table.spec{width:100%;border-collapse:collapse;font-size:12.5px;margin:14px 0 20px;}
  table.spec th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;text-align:left;background:var(--graphite);color:var(--paper);padding:7px 10px;}
  table.spec td{padding:7px 10px;border-bottom:1px solid var(--hairline);vertical-align:top;}
  table.spec tr:nth-child(even){background:var(--paper-2);}

  .edit-field{width:100%;font-family:'Source Serif 4',serif;font-size:14px;border:1px solid var(--hairline);background:#fffdf8;padding:8px;min-height:110px;line-height:1.5;}
  .edit-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .edit-row input,.edit-row select{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--hairline);padding:5px 8px;background:#fffdf8;}
  .save-book-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--moss);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;}
  .add-btn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--steel);background:none;border:1px dashed var(--steel);padding:6px 12px;cursor:pointer;margin-top:6px;}
  .add-btn:hover{background:var(--steel);color:#fff;}

  .locked-page{text-align:center;padding:70px 20px;}
  .locked-page .lockicon{font-size:34px;color:var(--hairline);margin-bottom:14px;}
  .locked-page h1{font-family:'Zilla Slab',serif;font-size:26px;margin-bottom:8px;}
  .locked-page .answers{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass);text-transform:uppercase;letter-spacing:.5px;margin-bottom:22px;}
  .locked-page .outline{display:inline-block;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);line-height:2;}
  .start-writing-btn{margin-top:24px;font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--brass);color:#fff;border:none;padding:9px 18px;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;}

  .cmd-header{margin-bottom:28px;}
  .cmd-header h1{font-family:'Zilla Slab',serif;font-size:26px;margin:0 0 4px;}
  .cmd-header .mono{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .metrics-row{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--ink);border:1px solid var(--ink);margin-bottom:34px;}
  .metric{background:var(--paper);padding:14px 10px;text-align:center;}
  .metric .num{font-family:'Zilla Slab',serif;font-size:26px;font-weight:700;}
  .metric .lbl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-top:4px;}
  .gauge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;}
  .gauge-card{border:1px solid var(--ink);background:var(--paper-2);padding:16px;text-align:center;cursor:pointer;}
  .gauge-card .book-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass);}
  .gauge-card .book-name{font-family:'Zilla Slab',serif;font-size:13px;font-weight:600;margin:2px 0 10px;min-height:34px;}
  .board{border:1px solid var(--ink);border-collapse:collapse;width:100%;}
  .board th{background:var(--graphite);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;text-align:left;}
  .board td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--hairline);}
  .board tr:nth-child(even) td{background:var(--paper-2);}
  .owner-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}

  #toast{position:fixed;bottom:24px;left:320px;background:var(--graphite);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:10px 18px;border-left:3px solid var(--brass-bright);box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:999;display:none;max-width:min(420px,calc(100vw - 40px));word-break:break-all;}

  #riskFrame{width:100%;height:100%;border:none;display:block;min-height:calc(100vh - 60px);}

  /* ========== MOBILE ========== */
  @media (max-width: 900px) {
    body {
      display: block;
      overflow: hidden;
      height: 100%;
      height: 100dvh;
    }
    #rail {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 280px; min-width: 280px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,.35);
    }
    #rail.open { transform: translateX(0); }
    #railBackdrop.open { display: block; }
    .menu-btn { display: block; }
    #main {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .topbar { padding: 12px 16px; }
    #searchbox { width: 100%; max-width: 170px; font-size: 13px; }
    #content { padding: 24px 16px 80px !important; max-width: none !important; }
    .titleblock { grid-template-columns: 1fr 1fr; }
    .tb-cell:nth-child(2n) { border-right: none; }
    .tb-cell.wide { grid-column: span 2; flex-direction: column; align-items: flex-start; }
    .tb-value.book-title { font-size: 18px; }
    .metrics-row { grid-template-columns: 1fr 1fr; }
    .metric .num { font-size: 22px; }
    .gauge-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .board { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #toast { left: 16px; right: 16px; max-width: none; }
    h2.chapter-title { font-size: 18px; }
    h3.sec-title { font-size: 15px; }
    .locked-page { padding: 40px 16px; }
    .locked-page h1 { font-size: 22px; }
    #riskFrame { min-height: calc(100dvh - 56px); }
  }
  @media (max-width: 520px) {
    .metrics-row { grid-template-columns: 1fr; }
    .gauge-grid { grid-template-columns: 1fr; }
    .titleblock { grid-template-columns: 1fr; }
    .tb-cell { border-right: none; }
    .tb-cell.wide { grid-column: span 1; }
    #searchbox { max-width: 120px; }
    .edit-row input, .edit-row select { width: 100%; }
  }
</style>
</head>
<body>

<div id="railBackdrop" onclick="closeRail()"></div>

<nav id="rail">
  <div class="rail-head">
    <div class="wordmark">INDUSTRIAL<span> ASSISTANCE</span> GROUP</div>
    <div class="sub">Operating System — Rev. 2</div>
  </div>
  <div id="railScroll">
    <div class="rail-label">Books</div>
    <div id="spines"></div>
    <div class="rail-label">Tools</div>
    <div id="toolsNav"></div>
  </div>
  <div class="rail-foot">
    <div class="toggle-row">
      <div class="toggle-btn on" id="btn-library" onclick="setView('library');closeRail()">Library</div>
      <div class="toggle-btn" id="btn-command" onclick="setView('command');closeRail()">Command</div>
    </div>
    <div class="edit-toggle" id="editToggle" onclick="toggleEdit()">✎ Edit Mode: Off</div>
  </div>
</nav>

<main id="main">
  <div class="topbar" id="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" onclick="toggleRail()" aria-label="Menu">☰</button>
      <div class="doc-kicker mono" id="crumb">INDUSTRIAL ASSISTANCE GROUP</div>
    </div>
    <input id="searchbox" placeholder="Search the library…" oninput="onSearch(this.value)">
  </div>
  <div id="content">
    <div class="locked-page mono" style="color:#9c927d;">Loading library…</div>
  </div>
</main>

<div id="toast"></div>

<template id="riskTemplate">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{--graphite:#1B2027;--steel:#2F4858;--brass:#B8894F;--brass-bright:#D3A868;--paper:#F1ECE1;--paper-2:#E8E1D2;--ink:#211E1A;--ink-soft:#544E44;--moss:#4B6B4F;--amber:#C08A2E;--rust:#8B4A3B;--hairline:#C9BFA9;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Source Serif 4',serif;background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.45;-webkit-text-size-adjust:100%;}
  .header{background:var(--graphite);color:var(--paper);padding:16px 16px 12px;border-bottom:3px solid var(--brass);}
  .header h1{font-family:'Zilla Slab',serif;font-size:1.25rem;font-weight:700;}
  .header h2{font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--brass-bright);margin-top:3px;}
  .header-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .header-meta span{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:#a8b0ba;background:rgba(255,255,255,.06);padding:3px 8px;border:1px solid #3a414a;}
  .meta-bar{background:var(--paper-2);padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--hairline);}
  .meta-group{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .meta-group label{font-family:'IBM Plex Mono',monospace;font-size:.58rem;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-soft);}
  .meta-group input,.meta-group select{font-family:'IBM Plex Mono',monospace;font-size:.75rem;padding:7px 8px;border:1px solid var(--hairline);background:#fffdf8;color:var(--ink);width:100%;max-width:160px;}
  .meta-group input:focus,.meta-group select:focus{outline:none;border-color:var(--brass);}
  .completion-wrap{margin-left:auto;text-align:right;}
  .completion-wrap label{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-soft);}
  #completionText{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;color:var(--steel);margin-top:2px;}
  .completion-bar-wrap{width:110px;height:5px;background:var(--hairline);margin-top:4px;}
  .completion-bar{height:5px;background:var(--moss);transition:width .4s;}
  .container{max-width:1480px;margin:0 auto;padding:14px 14px 32px;}
  .dashboard-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px;}
  .summary-card{background:var(--paper-2);border:1px solid var(--ink);padding:12px 8px 10px;text-align:center;}
  .summary-card .s-number{font-family:'Zilla Slab',serif;font-size:1.5rem;font-weight:700;line-height:1;}
  .summary-card .s-label{font-family:'IBM Plex Mono',monospace;font-size:.55rem;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);margin-top:5px;}
  .summary-card .s-sub{font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:#9c927d;margin-top:2px;}
  .section-title{font-family:'Zilla Slab',serif;font-size:.95rem;font-weight:600;margin:20px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--ink);}
  .overall-risk-card{background:var(--paper-2);border:1px solid var(--ink);padding:14px;margin-bottom:16px;}
  .overall-risk-inner{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;}
  .overall-score-ring{display:inline-block;width:100px;height:100px;position:relative;}
  .ring-svg{transform:rotate(-90deg);}
  .ring-bg-circle{fill:none;stroke:var(--hairline);stroke-width:10;}
  .ring-fill-circle{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s,stroke .3s;}
  .ring-center-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .ring-score{font-family:'Zilla Slab',serif;font-size:1.5rem;font-weight:700;}
  .ring-label{font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:var(--ink-soft);}
  .ring-sub{font-family:'IBM Plex Mono',monospace;font-size:.62rem;text-align:center;margin-top:6px;font-weight:500;}
  .chart-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .chart-label{width:90px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--ink-soft);text-align:right;flex-shrink:0;}
  .chart-bar-bg{flex:1;background:var(--hairline);height:15px;overflow:hidden;}
  .chart-bar-fill{height:15px;transition:width .5s;display:flex;align-items:center;padding-left:6px;min-width:0;}
  .chart-bar-fill span{font-family:'IBM Plex Mono',monospace;font-size:.55rem;font-weight:600;color:#fff;white-space:nowrap;}
  .chart-val{width:20px;font-family:'IBM Plex Mono',monospace;font-size:.65rem;font-weight:600;flex-shrink:0;}
  .filter-bar{background:var(--paper-2);border:1px solid var(--hairline);padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .filter-bar label{font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);}
  .filter-btn{font-family:'IBM Plex Mono',monospace;font-size:.62rem;padding:6px 10px;border:1px solid var(--hairline);background:var(--paper);color:var(--ink-soft);cursor:pointer;min-height:32px;}

<script>
const RISKS=[{id:'r01',category:'Industrial Market Conditions',defaultLevel:'high',impact:'High',mitigation:'Focus on aftermarket services, recurring maintenance, diversified end markets',description:'Exposure to cyclical industrial demand.',kpis:'Aftermarket revenue %, diversification index',owner:'CEO / BD'},{id:'r02',category:'Economic Downturn',defaultLevel:'high',impact:'High',mitigation:'Conservative leverage, strong liquidity',description:'Macro contraction reduces industrial spending.',kpis:'Debt/EBITDA, cash runway',owner:'CFO'},{id:'r03',category:'Acquisition Competition',defaultLevel:'high',impact:'High',mitigation:'Proprietary deal sourcing, founder relationships',description:'Increased PE activity drives multiples up.',kpis:'Pipeline size, win rate',owner:'M&A'},{id:'r04',category:'Valuation Inflation',defaultLevel:'high',impact:'High',mitigation:'Walk away from overpriced deals',description:'Expanded multiples threaten returns.',kpis:'Entry EV/EBITDA vs target',owner:'Investment Committee'},{id:'r05',category:'Industry Consolidation',defaultLevel:'medium',impact:'Medium',mitigation:'Build regional density, operational excellence',description:'Consolidation may reduce available targets.',kpis:'Market share, competitor M&A',owner:'CEO / Strategy'},{id:'r06',category:'Customer Concentration',defaultLevel:'high',impact:'High',mitigation:'Diversify customer base, recurring revenue',description:'Over-reliance on key customers.',kpis:'Top 3 customer %, retention',owner:'Sales / CEO'},{id:'r07',category:'Labor Availability',defaultLevel:'high',impact:'High',mitigation:'Leadership Development, apprenticeship programs',description:'Skilled trades shortage is structural.',kpis:'Fill rate, turnover %',owner:'HR / Ops'},{id:'r08',category:'Leadership Succession',defaultLevel:'medium',impact:'Medium',mitigation:'Internal pipeline, succession planning',description:'Loss of key leaders post-acquisition.',kpis:'Succession coverage %, retention',owner:'CEO / HR'},{id:'r09',category:'Technology Disruption',defaultLevel:'medium',impact:'Medium',mitigation:'Continuous tech investment, AI, predictive maintenance',description:'IoT and AI could disrupt service models.',kpis:'Tech investment %, digital revenue',owner:'CTO / Ops'},{id:'r10',category:'Capital Availability',defaultLevel:'high',impact:'High',mitigation:'Multiple lenders, conservative debt',description:'Access to acquisition financing is critical.',kpis:'Available credit, debt/EBITDA',owner:'CFO'},{id:'r11',category:'Interest Rate Environment',defaultLevel:'medium',impact:'Medium',mitigation:'Conservative leverage, fixed-rate debt',description:'Elevated rates increase financing cost.',kpis:'Wtd avg rate, interest coverage',owner:'CFO'},{id:'r12',category:'Integration Execution',defaultLevel:'high',impact:'High',mitigation:'Integration Playbook, 30-60-90 plans',description:'Failed integrations destroy value.',kpis:'Milestone completion, synergy rate',owner:'Integration / COO'},{id:'r13',category:'Regulatory & Environmental',defaultLevel:'medium',impact:'Medium',mitigation:'Compliance programs, safety systems',description:'OSHA, EPA, sector regulations.',kpis:'Incident rate, audit findings',owner:'Compliance / Legal'},{id:'r14',category:'Reputation',defaultLevel:'very-high',impact:'Very High',mitigation:'Employees First culture, ethical leadership',description:'Brand is a critical differentiator.',kpis:'Employee NPS, Glassdoor, retention',owner:'CEO'},{id:'r15',category:'Cybersecurity',defaultLevel:'medium',impact:'Medium',mitigation:'IT governance, training, incident response',description:'Ransomware and OT/IT convergence risk.',kpis:'Assessment score, patch compliance',owner:'IT / CISO'}];
const LEVEL_ORDER={'very-high':5,high:4,medium:3,low:2,na:1};
const LEVEL_LABELS={'very-high':'Very High',high:'High',medium:'Medium',low:'Low',na:'N/A'};
const LEVEL_COLORS={'very-high':'#7b1d1d',high:'#8B4A3B',medium:'#C08A2E',low:'#4B6B4F',na:'#8a8577'};
const SCORE_LABELS={1:'Very Low',2:'Low',3:'Moderate',4:'Elevated',5:'Critical'};
const SCORE_COLORS={1:'#4B6B4F',2:'#5a8a5e',3:'#C08A2E',4:'#c06a3a',5:'#8B4A3B'};
const TREND_LABELS={up:'Increasing',flat:'Stable',down:'Decreasing'};
let state={scores:{},levels:{},trends:{},notes:{},priorities:{},detailNotes:{},detailActions:{},currentFilter:'all',sortCol:null,sortDir:1,allExpanded:false};
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('metaDate').valueAsDate=new Date();
  RISKS.forEach(r=>{state.levels[r.id]=r.defaultLevel;state.trends[r.id]='flat';state.scores[r.id]=0;state.priorities[r.id]=false;state.notes[r.id]='';state.detailNotes[r.id]='';state.detailActions[r.id]='';});
  buildTable();loadData();updateHeader();updateDashboard();
});
function updateHeader(){
  const co=document.getElementById('metaCompany').value||'—',an=document.getElementById('metaAnalyst').value||'—',dt=document.getElementById('metaDate').value||'—',pr=document.getElementById('metaPeriod').value||'—';
  const stLabels={'on-track':'On Track',watch:'Watch List',concern:'Concern',critical:'Critical'};
  document.getElementById('hdrCompany').textContent=`Company: ${co}`;
  document.getElementById('hdrAnalyst').textContent=`Analyst: ${an}`;
  document.getElementById('hdrDate').textContent=`Date: ${dt}`;
  document.getElementById('hdrPeriod').textContent=`Period: ${pr}`;
  document.getElementById('hdrStatus').textContent=`Status: ${stLabels[document.getElementById('metaStatus').value]||'—'}`;
  autoSave();
}
function buildTable(){
  const tbody=document.getElementById('riskTableBody');tbody.innerHTML='';
  RISKS.forEach(risk=>{
    const lv=state.levels[risk.id];
    const tr=document.createElement('tr');tr.className='main-row';tr.id=`row_${risk.id}`;tr.dataset.level=lv;
    tr.innerHTML=`<td style="text-align:center"><span class="priority-star ${state.priorities[risk.id]?'active':''}" id="star_${risk.id}" onclick="togglePriority('${risk.id}')">★</span></td>
      <td><div style="font-family:'Zilla Slab',serif;font-weight:600;font-size:.78rem">${risk.category}</div><div style="font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:#9c927d;margin-top:2px">${risk.owner}</div></td>
      <td><div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap"><div class="score-selector">${[1,2,3,4,5].map(n=>`<button class="score-btn" id="scoreBtn_${risk.id}_${n}" onclick="setScore('${risk.id}',${n})">${n}</button>`).join('')}</div><div class="mini-bar-wrap"><div class="mini-bar" id="miniBar_${risk.id}"></div></div><span id="scoreLabel_${risk.id}" style="font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:#9c927d"></span></div></td>
      <td><select class="table-select" id="levelSel_${risk.id}" onchange="setLevel('${risk.id}',this.value)"><option value="very-high" ${lv==='very-high'?'selected':''}>Very High</option><option value="high" ${lv==='high'?'selected':''}>High</option><option value="medium" ${lv==='medium'?'selected':''}>Medium</option><option value="low" ${lv==='low'?'selected':''}>Low</option><option value="na" ${lv==='na'?'selected':''}>N/A</option></select><div id="levelBadge_${risk.id}"></div></td>
      <td><span class="impact-badge impact-${risk.impact.toLowerCase().replace(' ','-')}">${risk.impact}</span></td>
      <td><select class="table-select" id="trendSel_${risk.id}" onchange="setTrend('${risk.id}',this.value)"><option value="up" ${state.trends[risk.id]==='up'?'selected':''}>Increasing</option><option value="flat" ${state.trends[risk.id]==='flat'?'selected':''}>Stable</option><option value="down" ${state.trends[risk.id]==='down'?'selected':''}>Decreasing</option></select></td>
      <td><div class="residual-display" id="residual_${risk.id}" style="background:#f0f0f0;color:#aaa">—</div></td>
      <td><textarea class="notes-input" id="notes_${risk.id}" placeholder="Notes…" oninput="setNote('${risk.id}',this.value)">${state.notes[risk.id]}</textarea></td>
      <td style="text-align:center"><button class="expand-btn" id="expandBtn_${risk.id}" onclick="toggleDetail('${risk.id}')">▶</button></td>`;
    tbody.appendChild(tr);

]},
{num:3,id:'acquisition',title:'Acquisition Playbook',tagline:'How do we buy companies?',status:'locked',outline:['Finding Deals','Deal Flow','Relationship Management','Valuation','LOI','Due Diligence','Negotiation','Legal','Closing','Transition']},
{num:4,id:'integration',title:'Integration Playbook',tagline:'What happens after closing?',status:'locked',outline:['Day 1','Week 1','30 Days','90 Days','180 Days','First Year','Employee meetings','Customer meetings','Financial reporting','Systems integration']},
{num:5,id:'opsystem',title:'The IAG Operating System',tagline:'This becomes your company.',status:'locked',outline:['Commercial Excellence','Operational Excellence','Leadership Excellence','Technology','Finance','KPIs','Dashboards','Continuous Improvement']},
{num:6,id:'financial',title:'Financial Playbook',tagline:'Protects capital allocation.',status:'locked',outline:['Financial model','Debt model','Cash flow','Returns','Capital allocation','Sensitivity analysis','Bank package']},
{num:7,id:'capraise',title:'Capital Raise Package',tagline:'Ready to raise capital.',status:'locked',outline:['Investor Presentation','Executive Summary','Financial Model','Market Analysis','Management Team','Returns','Risk','Appendix']},
{num:8,id:'seller',title:'Seller Presentation',tagline:'Why sell to IAG?',status:'locked',outline:['Why Sell to IAG?','Employee Philosophy','Legacy','Transition','Culture','The Future']},
{num:9,id:'board',title:'Board Package',tagline:'Quarterly reporting to the board.',status:'locked',outline:['Quarterly Reporting','KPIs','Acquisitions','Capital Allocation','Risk','Strategy']}
]};

const STATUS_LABEL={done:'Done',pending:'Pending Approval',progress:'In Progress',notstarted:'Not Started',locked:'Not Started'};
const STATUS_CLASS={done:'status-done',pending:'status-pending',progress:'status-progress',notstarted:'status-notstarted',locked:'status-locked'};

let DATA=SEED,LINKS={},currentView='library',currentBook=DATA.books[0],EDIT_MODE=false;

function toggleRail(){const r=document.getElementById('rail'),b=document.getElementById('railBackdrop');const open=r.classList.toggle('open');b.classList.toggle('open',open);}
function closeRail(){document.getElementById('rail').classList.remove('open');document.getElementById('railBackdrop').classList.remove('open');}

async function loadContent(){try{const r=await window.storage.get('iag-content',true);DATA=JSON.parse(r.value);}catch(e){DATA=SEED;try{await window.storage.set('iag-content',JSON.stringify(DATA),true);}catch(e2){}}currentBook=DATA.books.find(b=>b.id===currentBook.id)||DATA.books[0];}
async function saveContent(){try{await window.storage.set('iag-content',JSON.stringify(DATA),true);toast('Published.');}catch(e){toast('Save failed.');}}
async function loadLinks(){try{const r=await window.storage.get('iag-links',true);LINKS=JSON.parse(r.value);}catch(e){LINKS={};try{await window.storage.set('iag-links',JSON.stringify(LINKS),true);}catch(e2){}}}
async function saveLinks(){try{await window.storage.set('iag-links',JSON.stringify(LINKS),true);}catch(e){}}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>{t.style.display='none';},3600);}
function makeCode(){return Math.random().toString(36).slice(2,7).toUpperCase();}
async function generateLink(bookId,chIdx,secIdx){const code=makeCode();LINKS[code]={bookId,chapterIdx:chIdx===undefined?null:chIdx,sectionIdx:secIdx===undefined?null:secIdx};await saveLinks();const url=location.origin+location.pathname+'?s='+code;try{await navigator.clipboard.writeText(url);toast('Link copied');}catch(e){toast('Link: '+url);}}
function resolveDeepLink(){const code=new URLSearchParams(location.search).get('s');if(!code||!LINKS[code])return false;const t=LINKS[code],book=DATA.books.find(b=>b.id===t.bookId);if(!book)return false;currentBook=book;currentView='library';renderRail();renderMain();if(t.chapterIdx!==null){setTimeout(()=>{const elId=t.sectionIdx!==null?`sec-${book.id}-${t.chapterIdx}-${t.sectionIdx}`:`ch-${book.id}-${t.chapterIdx}`;const el=document.getElementById(elId);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');}},80);}return true;}

function bookPercent(b){if(!b.chapters||!b.chapters.length)return 0;let secs=[];b.chapters.forEach(ch=>secs.push(...(ch.sections||[])));if(!secs.length)return 0;const w={done:100,pending:90,progress:50,notstarted:0};return Math.round(secs.reduce((a,s)=>a+(w[s.status]||0),0)/secs.length);}
function gaugeSVG(pct,size){size=size||34;const r=size*.42,cx=size/2,cy=size*.55,frac=Math.max(0,Math.min(1,pct/100)),angle=Math.PI-frac*Math.PI;const x1=cx+r*Math.cos(Math.PI),y1=cy+r*Math.sin(Math.PI),x2=cx+r*Math.cos(0),y2=cy+r*Math.sin(0),xm=cx+r*Math.cos(angle),ym=cy+r*Math.sin(angle),large=frac>.5?1:0,nl=r*.85,nx=cx+nl*Math.cos(angle),ny=cy+nl*Math.sin(angle);return`<svg viewBox="0 0 ${size} ${size*.6}" width="${size}" height="${size*.6}"><path d="M ${x1} ${y1} A ${r} ${r} 0 1 1 ${x2} ${y2}" fill="none" stroke="#3a3a34" stroke-width="${size*.09}" stroke-linecap="round" opacity=".25"/><path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${xm} ${ym}" fill="none" stroke="#B8894F" stroke-width="${size*.09}" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#211E1A" stroke-width="1.4"/><circle cx="${cx}" cy="${cy}" r="${size*.05}" fill="#211E1A"/></svg>`;}

function renderRail(){
  document.getElementById('spines').innerHTML=DATA.books.map(b=>{
    const locked=b.status==='locked',pct=bookPercent(b);
    return`<div class="spine ${locked?'locked':''} ${currentView==='library'&&currentBook.id===b.id?'active':''}" onclick="selectBook('${b.id}');closeRail()">
      <div class="spine-num">${String(b.num).padStart(2,'0')}</div>
      <div class="gauge-mini">${gaugeSVG(pct,34)}</div>
      <div class="spine-body"><div class="spine-title">${b.title}</div><div class="spine-tag">${locked?'Not yet written':STATUS_LABEL[b.status]+' · '+pct+'%'}</div></div>
    </div>`;
  }).join('');
  document.getElementById('toolsNav').innerHTML=`<div class="tool-item ${currentView==='risk'?'active':''}" onclick="openRiskTool();closeRail()"><div class="tool-icon">📊</div><div class="tool-title">Risk Scorecard</div></div>`;
}

function selectBook(id){currentBook=DATA.books.find(b=>b.id===id);currentView='library';document.getElementById('searchbox').value='';document.getElementById('btn-library').classList.add('on');document.getElementById('btn-command').classList.remove('on');renderRail();renderMain();}
function setView(view){currentView=view;document.getElementById('btn-library').classList.toggle('on',view==='library');document.getElementById('btn-command').classList.toggle('on',view==='command');renderRail();renderMain();}
function toggleEdit(){EDIT_MODE=!EDIT_MODE;const btn=document.getElementById('editToggle');btn.classList.toggle('on',EDIT_MODE);btn.textContent='✎ Edit Mode: '+(EDIT_MODE?'On':'Off');renderMain();}

function openRiskTool(){
  currentView='risk';
  document.getElementById('btn-library').classList.remove('on');
  document.getElementById('btn-command').classList.remove('on');
  document.getElementById('searchbox').style.display='none';
  document.getElementById('crumb').textContent='TOOLS · RISK SCORECARD';
  const content=document.getElementById('content');
  content.style.padding='0';content.style.maxWidth='none';
  content.innerHTML='<iframe id="riskFrame" title="Risk Scorecard"></iframe>';
  document.getElementById('riskFrame').srcdoc=document.getElementById('riskTemplate').innerHTML;
  renderRail();
}

function renderMain(){
  document.getElementById('searchbox').style.display=currentView==='risk'?'none':'block';
  const content=document.getElementById('content');
  content.style.padding='';content.style.maxWidth='';
  if(currentView==='command'){document.getElementById('crumb').textContent='COMMAND VIEW · STATUS';renderCommand();return;}
  if(currentView==='risk')return;
  const b=currentBook;
  document.getElementById('crumb').textContent='BOOK '+String(b.num).padStart(2,'0')+' · '+b.title.toUpperCase();
  if(b.status==='locked'){
    content.innerHTML=`<div class="locked-page"><div class="lockicon">🔒</div><div class="answers">This answers: ${b.tagline}</div><h1>${b.title}</h1><div class="outline">${(b.outline||[]).map(o=>'— '+o).join('<br>')}</div>${EDIT_MODE?`<button class="start-writing-btn" onclick="startWriting('${b.id}')">＋ Start Writing This Book</button>`:''}</div>`;
    return;
  }
  const pct=bookPercent(b);
  let html=`<div class="titleblock">
    <div class="tb-cell"><div class="tb-label">Book</div><div class="tb-value">${String(b.num).padStart(2,'0')}</div></div>
    <div class="tb-cell"><div class="tb-label">Status</div><div class="tb-value"><span class="status-pill ${STATUS_CLASS[b.status]}">${STATUS_LABEL[b.status]}</span></div></div>
    <div class="tb-cell"><div class="tb-label">Completion</div><div class="tb-value">${pct}%</div></div>
    <div class="tb-cell"><div class="tb-label">Rev.</div><div class="tb-value">2.0</div></div>
    <div class="tb-cell wide"><div><div class="tb-label">${b.tagline}</div><div class="tb-value book-title">${b.title}</div></div><button class="link-btn" onclick="generateLink('${b.id}')">🔗 Share</button></div>
  </div>`;
  if(EDIT_MODE)html+=`<div class="toolbar-row"><button class="save-book-btn" onclick="saveBookEdits('${b.id}')">💾 Save &amp; Publish</button></div>`;
  (b.chapters||[]).forEach((ch,chIdx)=>{
    html+=`<section class="chapter" id="ch-${b.id}-${chIdx}"><div class="chapter-head"><h2 class="chapter-title">${ch.num?'Chapter '+ch.num+' — ':''}${ch.title}</h2><button class="link-btn" onclick="generateLink('${b.id}',${chIdx})">🔗</button></div>`;
    (ch.sections||[]).forEach((s,secIdx)=>{
      const fid=`f-${b.id}-${chIdx}-${secIdx}`;
      if(EDIT_MODE){
        html+=`<div class="sec-block" id="sec-${b.id}-${chIdx}-${secIdx}"><div class="edit-row">
          <input type="text" id="${fid}-title" value="${(s.title||'').replace(/"/g,'&quot;')}" style="flex:1;min-width:120px">
          <select id="${fid}-status"><option value="notstarted" ${s.status==='notstarted'?'selected':''}>Not Started</option><option value="progress" ${s.status==='progress'?'selected':''}>In Progress</option><option value="pending" ${s.status==='pending'?'selected':''}>Pending Approval</option><option value="done" ${s.status==='done'?'selected':''}>Done</option></select>
          <input type="text" id="${fid}-owner" value="${(s.owner||'').replace(/"/g,'&quot;')}" placeholder="Owner" style="width:100px">
        </div><textarea class="edit-field" id="${fid}-content">${(s.content||'').trim()}</textarea>
        <input type="text" id="${fid}-notes" value="${(s.notes||'').replace(/"/g,'&quot;')}" placeholder="Note" style="width:100%;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 8px;border:1px solid var(--hairline)"></div>`;
      }else{
        html+=`<div class="sec-block" id="sec-${b.id}-${chIdx}-${secIdx}"><div class="sec-head"><h3 class="sec-title">${s.title}</h3><div class="sec-meta"><span class="status-pill ${STATUS_CLASS[s.status]}">${STATUS_LABEL[s.status]}</span> ${s.owner||''} <button class="link-btn" onclick="generateLink('${b.id}',${chIdx},${secIdx})">🔗</button></div></div>
        <div class="sec-body">${s.content||'<p style="color:#9c927d;font-style:italic">No draft yet.</p>'}</div>${s.notes?`<div class="note-box"><b>Note:</b> ${s.notes}</div>`:''}</div>`;
      }
    });
    if(EDIT_MODE)html+=`<button class="add-btn" onclick="addSection('${b.id}',${chIdx})">＋ Add Section</button>`;
    html+=`</section>`;
  });
  if(EDIT_MODE)html+=`<button class="add-btn" onclick="addChapter('${b.id}')">＋ Add Chapter</button>`;
  content.innerHTML=html;
}

function startWriting(id){const b=DATA.books.find(x=>x.id===id);b.chapters=(b.outline||[]).map(t=>({title:t,sections:[{title:t,status:'notstarted',owner:'',content:'',notes:''}]}));b.status='progress';renderRail();renderMain();}
function addSection(id,chIdx){const t=prompt('Section title:');if(!t)return;DATA.books.find(x=>x.id===id).chapters[chIdx].sections.push({title:t,status:'notstarted',owner:'',content:'',notes:''});renderMain();}
function addChapter(id){const t=prompt('Chapter title:');if(!t)return;DATA.books.find(x=>x.id===id).chapters.push({title:t,sections:[]});renderMain();}
async function saveBookEdits(id){const b=DATA.books.find(x=>x.id===id);b.chapters.forEach((ch,ci)=>{(ch.sections||[]).forEach((s,si)=>{const f=`f-${b.id}-${ci}-${si}`;const te=document.getElementById(f+'-title');if(!te)return;s.title=te.value;s.status=document.getElementById(f+'-status').value;s.owner=document.getElementById(f+'-owner').value;s.content=document.getElementById(f+'-content').value;s.notes=document.getElementById(f+'-notes').value;});});await saveContent();renderRail();renderMain();}

function renderCommand(){
  const content=document.getElementById('content');
  let all=[];DATA.books.forEach(b=>{(b.chapters||[]).forEach(ch=>{(ch.sections||[]).forEach(s=>all.push({bookNum:b.num,chapter:ch.title,section:s.title,status:s.status,owner:s.owner});});});
  const counts={done:0,pending:0,progress:0,notstarted:0};all.forEach(s=>counts[s.status]++);
  const alex=all.filter(s=>s.owner&&s.owner.includes('Alex')).length,garret=all.filter(s=>s.owner&&s.owner.includes('Garret')&&!s.owner.includes('Alex')).length;
  let html=`<div class="cmd-header"><h1>IAG Status Dashboard</h1><div class="mono">Document Completion Tracker</div></div>
  <div class="metrics-row">
    <div class="metric"><div class="num">${all.length}</div><div class="lbl">Total Workstreams</div></div>
    <div class="metric"><div class="num">${counts.pending}</div><div class="lbl">Pending Approval</div></div>
    <div class="metric"><div class="num">${counts.progress}</div><div class="lbl">In Progress</div></div>
    <div class="metric"><div class="num">${counts.notstarted}</div><div class="lbl">Not Started</div></div>
    <div class="metric"><div class="num">${alex}/${garret}</div><div class="lbl">Alex / Garret</div></div>
  </div><div class="gauge-grid">`;
  DATA.books.forEach(b=>{const pct=bookPercent(b);html+=`<div class="gauge-card" onclick="selectBook('${b.id}')"><div class="book-num">BOOK ${String(b.num).padStart(2,'0')}</div><div class="book-name">${b.title}</div>${gaugeSVG(pct,90)}<div class="mono" style="margin-top:6px;font-size:11px">${pct}%</div></div>`;});
  html+=`</div><div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="board"><tr><th>Book</th><th>Chapter</th><th>Section</th><th>Status</th><th>Owner</th></tr>
  ${all.map(s=>`<tr><td class="mono">Bk ${s.bookNum}</td><td>${s.chapter}</td><td>${s.section}</td><td><span class="status-pill ${STATUS_CLASS[s.status]}">${STATUS_LABEL[s.status]}</span></td><td class="owner-tag">${s.owner||''}</td></tr>`).join('')}</table></div>`;
  content.innerHTML=html;
}

function onSearch(q){
  q=q.trim().toLowerCase();
  if(!q){if(currentView!=='risk')renderMain();return;}
  let hits=[];DATA.books.forEach(b=>{(b.chapters||[]).forEach(ch=>{(ch.sections||[]).forEach(s=>{if((s.title+' '+(s.content||'')+' '+(s.notes||'')).toLowerCase().includes(q))hits.push({book:b,section:s});});});});
  const content=document.getElementById('content');
  document.getElementById('crumb').textContent=`SEARCH · "${q}" · ${hits.length} RESULT${hits.length===1?'':'S'}`;
  if(!hits.length){content.innerHTML=`<div class="locked-page"><h1>No matches</h1><div class="mono" style="color:#9c927d">Try a different keyword.</div></div>`;return;}
  content.innerHTML=hits.map(h=>`<div class="sec-block"><div class="sec-head"><h3 class="sec-title">${h.book.title} — ${h.section.title}</h3><div class="sec-meta"><span class="status-pill ${STATUS_CLASS[h.section.status]}">${STATUS_LABEL[h.section.status]}</span></div></div><div class="sec-body">${h.section.content||'<p style="color:#9c927d;font-style:italic">No draft yet.</p>'}</div></div>`).join('');
}

async function initApp(){await loadContent();await loadLinks();if(!resolveDeepLink()){renderRail();renderMain();}}
initApp();
</script>
</body>
</html>
