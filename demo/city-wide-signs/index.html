<meta name="description" content="Manage sign inventory, panel leases, inspections, clients, and incoming requests for City Wide Signs.">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Product polish: clearer keyboard focus, safer small-screen tables, and print-friendly reports. */
:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 3px solid var(--amber-bright);
  outline-offset: 3px;
}
button:active { transform: translateY(1px); }
@media (max-width: 560px) {
  .card { padding: 14px; }
  .s-block { padding-block: 54px; }
  .s-form { padding: 18px; }
  .s-hero .in { padding-block: 46px 62px; }
}
@media print {
  .top, .newbtn, .topbtn, .tabs, .btn, button, .preview-bar { display: none !important; }
  body, main.app { background: #fff !important; color: #111 !important; padding: 0 !important; }
  .card, .big { box-shadow: none !important; break-inside: avoid; }
  .tablewrap { overflow: visible !important; }
  table { font-size: 10pt; }
}


</style>







</head>

<body>



<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Overpass+Mono:wght@500;600&display=swap">

<style>



/* Layout concept: one calm workspace in roadside-sign colors. Sign green for structure, white panels, amber for anything open or needing a decision. */

:root {

  --bg: #f3f5f1;

  --card: #ffffff;

  --soft: #eef2ec;

  --ink: #142019;

  --ink-2: #48564d;

  --muted: #758078;

  --line: #dde2db;

  --green: #17402f;

  --green-2: #215a43;

  --accent: #0e6e49;

  --accent-ink: #ffffff;

  --accent-soft: #dcefe4;

  --amber: #b77900;

  --amber-bright: #f2b230;

  --amber-soft: #fdf2d8;

  --red: #b42318;

  --red-soft: #fde6e3;

  --sign: #fbfbf7;

  --sign-ink: #10231a;

  --shadow: 0 1px 2px rgba(20, 32, 25, .05), 0 6px 20px rgba(20, 32, 25, .07);

  --f: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;

  --mono: "Overpass Mono", ui-monospace, Menlo, monospace;

  --r: 10px;

}

@media (prefers-color-scheme: dark) {

  :root:not([data-theme="light"]) { --bg: #0e1512; --card: #16201b; --soft: #1b2721; --ink: #e8eee9; --ink-2: #b9c5bd; --muted: #8b998f; --line: #27352e; --green: #123526; --green-2: #1d4a37; --accent: #3cbf86; --accent-ink: #07150e; --accent-soft: #1b3a2c; --amber: #f2b230; --amber-soft: #3a2e12; --red: #f07167; --red-soft: #3d1c19; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark; }

}

:root[data-theme="dark"] { --bg: #0e1512; --card: #16201b; --soft: #1b2721; --ink: #e8eee9; --ink-2: #b9c5bd; --muted: #8b998f; --line: #27352e; --green: #123526; --green-2: #1d4a37; --accent: #3cbf86; --accent-ink: #07150e; --accent-soft: #1b3a2c; --amber: #f2b230; --amber-soft: #3a2e12; --red: #f07167; --red-soft: #3d1c19; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }

html { scroll-padding-top: 80px; }

body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.5; margin: 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--green); }

h1, h2, h3 { margin: 0; line-height: 1.1; text-wrap: balance; }

p { margin: 0; }

button, input, select, textarea { font: inherit; color: inherit; }

button { cursor: pointer; }

:focus-visible { outline: 3px solid var(--amber-bright); outline-offset: 2px; }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.wrapw { max-width: 1240px; margin: 0 auto; }



/* Top bar */

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--green); color: #eef5f0; }

.top-in { display: flex; align-items: center; gap: 18px; padding-block: 10px; }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 17px; white-space: nowrap; }

.mark { width: 32px; height: 32px; border-radius: 6px; background: #eef5f0; color: #17402f; display: grid; place-items: center; flex: none; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }

.tabs button { background: none; border: 0; color: #bcd3c6; font-weight: 700; font-size: 15px; padding: 9px 14px 7px; border-radius: 8px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }

.tabs button:hover { color: #fff; background: rgba(255,255,255,.06); }

.tabs button[aria-current="page"] { color: #fff; background: rgba(255,255,255,.14); }

.tabs .dot { background: var(--amber-bright); color: #3b2a00; border-radius: 999px; font-size: 11px; padding: 1px 7px 0; font-family: var(--mono); }

.topbtn { background: rgba(255,255,255,.1); border: 0; color: #fff; border-radius: 8px; padding: 8px 12px 6px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }

.topbtn:hover { background: rgba(255,255,255,.18); }



main.app { padding-block: 24px 60px; }

.page-h { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }

.page-h h1 { font-size: 30px; font-weight: 900; letter-spacing: -.01em; }

.page-h p { color: var(--ink-2); margin-top: 6px; max-width: 64ch; }



/* Shared pieces */

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }

.card h2 { font-size: 18px; font-weight: 800; }

.card .sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 14px 7px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; color: var(--ink); }

.btn:hover { border-color: var(--ink-2); }

.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.btn.pri:hover { filter: brightness(1.06); }

.btn.amb { background: var(--amber-bright); border-color: var(--amber-bright); color: #3b2a00; }

.btn.danger { color: var(--red); }

.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

.btn.sm { padding: 6px 10px 4px; font-size: 13px; }

.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }

.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px 5px; font-weight: 700; font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 7px; align-items: center; }

.chip .c { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.chip[aria-pressed="true"] .c { color: var(--bg); opacity: .75; }

.input { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 12px 8px; width: 100%; }

.search { position: relative; flex: 1 1 280px; min-width: 0; }

.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

.search .input { padding-left: 38px; }

.lbl { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px 1px; white-space: nowrap; }

.pill.open { background: var(--amber-soft); color: var(--amber); }

.pill.full { background: var(--accent-soft); color: var(--accent); }

.pill.bad { background: var(--red-soft); color: var(--red); }

.pill.grey { background: var(--soft); color: var(--ink-2); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.grow { flex: 1; min-width: 0; }

.empty { text-align: center; color: var(--ink-2); padding: 40px 16px; display: grid; gap: 10px; justify-items: center; }

.tablewrap { overflow-x: auto; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }

th, td { text-align: left; padding: 11px 12px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }

th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

td.r, th.r { text-align: right; }

tbody tr:last-child td { border-bottom: 0; }

tr.click { cursor: pointer; }

tr.click:hover td { background: var(--soft); }



/* Overview */

.big4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }

.big { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 4px; align-content: start; }

.big .v { font-size: 34px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.big .s { color: var(--ink-2); font-size: 14px; }

.big.hero { background: var(--green); border-color: var(--green); color: #eef5f0; }

.big.hero .lbl { color: #a9c6b6; }

.big.hero .s { color: #cfe0d6; }

.big .v.amb { color: var(--amber); }

.big .v.red { color: var(--red); }

.ov { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }

.todo { display: grid; gap: 0; margin-top: 10px; }

.todo-i { display: flex; gap: 12px; align-items: center; padding: 12px 0 10px; border-bottom: 1px solid var(--line); }

.todo-i:last-child { border-bottom: 0; }

.todo-i .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; font-weight: 900; }

.ic.red { background: var(--red-soft); color: var(--red); }

.ic.amb { background: var(--amber-soft); color: var(--amber); }

.ic.grn { background: var(--accent-soft); color: var(--accent); }

.todo-i b { font-weight: 700; }

.todo-i .t { flex: 1; min-width: 0; }

.todo-i .t small { display: block; color: var(--muted); font-size: 13px; }

.mk { display: grid; grid-template-columns: 120px minmax(0, 1fr) 90px; gap: 12px; align-items: center; padding: 10px 0 8px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }

.mk:last-child { border-bottom: 0; }

.mk:hover .mk-n { color: var(--accent); }

.mk-n { font-weight: 800; }

.meter { height: 12px; border-radius: 6px; overflow: hidden; display: flex; gap: 2px; background: transparent; }

.meter i { display: block; height: 100%; border-radius: 3px; }

.meter .f { background: var(--accent); }

.meter .o { flex: 1; background: repeating-linear-gradient(135deg, var(--amber-bright) 0 3px, var(--amber-soft) 3px 7px); }

.mk .r { text-align: right; font-family: var(--mono); font-size: 14px; font-weight: 600; }

.mk small { display: block; color: var(--muted); font-size: 12.5px; font-family: var(--f); font-weight: 400; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }

.legend span { display: inline-flex; gap: 6px; align-items: center; }

.legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }



/* Signs */

.filters { display: grid; gap: 12px; margin-bottom: 16px; }

.signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }

.sign { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; text-align: left; align-content: start; }

.sign:hover { border-color: var(--ink-2); box-shadow: var(--shadow); }

.sign-h { display: flex; justify-content: space-between; gap: 8px; align-items: start; }

.sign-h b { font-size: 19px; font-weight: 900; display: block; line-height: 1.1; }

.sign-h small { color: var(--muted); font-size: 13px; }

.kio { background: var(--green); border-radius: 6px; padding: 7px; display: flex; gap: 6px; }

.side { flex: 1 1 0; min-width: 0; display: grid; gap: 3px; align-content: start; }

.side-l { font-family: var(--mono); font-size: 10.5px; color: #a9c6b6; text-align: center; }

.slot { height: 15px; border-radius: 2px; font-size: 10.5px; font-weight: 700; line-height: 16px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--sign); color: var(--sign-ink); }

.slot.free { background: transparent; border: 1px solid #5d8574; color: #cfe0d6; line-height: 13px; }

.slot.unb { box-shadow: inset 3px 0 0 #e5484d; color: #b42318; }

.slot.open { background: rgba(242, 178, 48, .1); border: 1px dashed #d9a23a; color: #f3cd72; line-height: 13px; font-weight: 600; }

.slot.hit { outline: 2px solid var(--amber-bright); outline-offset: 1px; }

.slot.dim { opacity: .3; }

.kio.off { background: repeating-linear-gradient(135deg, var(--green) 0 8px, var(--green-2) 8px 16px); min-height: 54px; align-items: center; justify-content: center; color: #eef5f0; font-size: 13px; font-weight: 700; }

.sign-f { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink-2); }

.sign-f b { font-family: var(--mono); color: var(--ink); font-weight: 600; }



/* Drawer + modal */

dialog { border: 0; padding: 0; color: var(--ink); background: var(--card); }

dialog::backdrop { background: rgba(8, 16, 12, .5); }

dialog.drawer { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(580px, 100%); max-width: 100%; overflow-x: hidden; }

.dr { padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 18px; }

.dr > * { min-width: 0; }

.dr-h { display: flex; justify-content: space-between; gap: 12px; align-items: start; }

.dr-h h2 { font-size: 28px; font-weight: 900; }

.x { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.facts div { background: var(--soft); border-radius: 8px; padding: 10px 12px 8px; }

.facts b { display: block; font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; }

.dr .kio { padding: 10px; gap: 8px; }

.dr .slot { height: 24px; line-height: 25px; font-size: 13px; }

.dr .slot.free, .dr .slot.open { line-height: 23px; }

.dr .slot.open { cursor: pointer; }

.dr .slot.open:hover { background: rgba(242, 178, 48, .25); }

.plist { display: grid; gap: 8px; }

.pi { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 8px; }

.pi .t { flex: 1; min-width: 0; }

.pi .t b { display: block; }

.pi .t small { color: var(--muted); font-size: 13px; }

.pi .m { font-family: var(--mono); font-weight: 600; white-space: nowrap; }

.note { border-radius: 8px; padding: 10px 12px 8px; font-size: 14px; }

.note.amb { background: var(--amber-soft); }

.note.red { background: var(--red-soft); }

dialog.modal { border-radius: 14px; width: min(500px, calc(100% - 24px)); max-height: calc(100% - 24px); }

.mf { padding: 22px; display: grid; gap: 14px; }

.mf h2 { font-size: 22px; font-weight: 900; }

.mf p.help { color: var(--ink-2); font-size: 14px; }

.fld { display: grid; gap: 6px; }

.fld > label, .fld legend { font-weight: 700; font-size: 14px; }

.fld small { color: var(--muted); font-size: 12.5px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.checks { display: flex; gap: 8px; flex-wrap: wrap; }

.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 4px; cursor: pointer; font-size: 14px; white-space: nowrap; }

.checks input { accent-color: var(--accent); }

.err { color: var(--red); font-size: 13.5px; min-height: 1px; }

.mfoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.menu { display: grid; gap: 8px; }

.menu button, .menu label { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px 14px 10px; cursor: pointer; }

.menu button:hover, .menu label:hover { border-color: var(--ink-2); }

.menu b { display: block; }

.menu small { color: var(--muted); font-size: 13px; }

.menu .ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--soft); flex: none; }



/* Money */

.money { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }

.hb { display: grid; grid-template-columns: 130px minmax(0, 1fr) 80px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }

.hb .bar { height: 14px; border-radius: 3px; background: var(--accent); }

.hb .bar.grey { background: var(--muted); opacity: .45; }

.hb .r { text-align: right; font-family: var(--mono); font-weight: 600; }

.hb .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

svg.ch { width: 100%; display: block; }

svg.ch text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }

svg.ch .g { stroke: var(--line); }

.whatif { display: grid; gap: 14px; }

.whatif input[type="range"] { width: 100%; accent-color: var(--accent); }

.answer { font-size: 18px; line-height: 1.45; }

.answer b { font-weight: 900; }

.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 7px 10px 5px; font-size: 13px; box-shadow: var(--shadow); }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 10px; justify-items: start; }

.drop.over { border-color: var(--accent); background: var(--accent-soft); }



.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px 8px; border-radius: 10px; font-weight: 700; font-size: 14px; z-index: 80; display: flex; gap: 12px; align-items: center; }

.toast button { background: none; border: 0; color: var(--amber-bright); font-weight: 800; padding: 0; }

.foot { color: var(--muted); font-size: 13px; margin-top: 28px; }



/* ---------- Website (public page) ---------- */

.site { --s-bg: #f4f5f0; --s-ink: #10231a; --s-ink2: #44554b; --s-line: #d5dad2; background: var(--s-bg); color: var(--s-ink); font-size: 16px; line-height: 1.6; }

.site .in { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

.site .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }

.s-hero { background: #17402f; color: #fbfbf7; position: relative; overflow: hidden; }

.s-hero::after { content: ""; position: absolute; inset: auto 0 0; height: 10px; background: repeating-linear-gradient(90deg, #f2b230 0 48px, transparent 48px 96px); }

.s-hero .in { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: center; padding-block: 64px 84px; }

.s-hero h1 { font-size: clamp(42px, 6vw, 80px); font-weight: 900; letter-spacing: -.02em; line-height: 1.02; }

.s-hero h1 em { color: #f2b230; }

.s-hero .eyebrow { color: #f2b230; margin-bottom: 16px; }

.s-hero .lede { font-size: 19px; color: #d4e3da; max-width: 52ch; margin-top: 20px; }

.s-ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }

.sbtn { display: inline-flex; gap: 10px; align-items: center; font-weight: 800; font-size: 16px; border-radius: 6px; padding: 13px 20px 11px; text-decoration: none; border: 2px solid transparent; cursor: pointer; background: none; color: inherit; }

.sbtn.amb { background: #f2b230; color: #3b2a00; }

.sbtn.ghost { border-color: rgba(251,251,247,.5); color: #fbfbf7; }

.skio { justify-self: center; width: min(420px, 100%); }

.skio-cap { background: #2c6a51; border-radius: 6px 6px 0 0; padding: 10px 16px 8px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: #d4e3da; }

.skio-body { background: #0b241a; padding: 12px; display: grid; gap: 8px; border-radius: 0 0 4px 4px; box-shadow: 0 30px 60px rgba(0,0,0,.35); }

.sp { background: #fbfbf7; color: #10231a; border-radius: 3px; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 0; font-weight: 800; font-size: 21px; }

.sp small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .12em; color: #4c5e53; font-family: var(--mono); text-transform: uppercase; margin-top: -2px; }

.sp.open { background: transparent; border: 2px dashed #f2b230; color: #f2b230; }

.sp.open small { color: #e9cf8f; }

.skio-posts { display: flex; justify-content: space-between; padding: 0 22%; }

.skio-posts i { display: block; width: 14px; height: 50px; background: linear-gradient(90deg, #0b241a, #1b4d3a); }

.s-stats { border-bottom: 1px solid var(--s-line); }

.s-stats .in { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }

.s-stat { padding: 26px 20px 24px 0; }

.s-stat + .s-stat { padding-left: 24px; border-left: 1px solid var(--s-line); }

.s-stat b { display: block; font-size: 44px; font-weight: 900; line-height: 1; }

.s-stat b.amb { color: #b47f00; }

.s-stat span { color: var(--s-ink2); font-size: 14.5px; }

.s-block { padding-block: 80px; }

.s-head { display: grid; gap: 12px; max-width: 760px; margin-bottom: 40px; }

.s-head .eyebrow { color: #2c6a51; }

.s-head h2 { font-size: clamp(32px, 4.2vw, 52px); font-weight: 900; letter-spacing: -.015em; }

.s-head p { color: var(--s-ink2); font-size: 18px; }

.s-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 3px solid var(--s-ink); }

.s-step { padding: 20px 22px 0 0; display: grid; gap: 8px; align-content: start; }

.s-step + .s-step { padding-left: 22px; border-left: 1px solid var(--s-line); }

.s-step .k { font-family: var(--mono); font-size: 13px; color: #6c7a71; }

.s-step h3 { font-size: 23px; font-weight: 800; }

.s-step p { color: var(--s-ink2); font-size: 15.5px; }

.s-markets { background: #17402f; color: #fbfbf7; }

.s-markets .s-head .eyebrow { color: #f2b230; }

.s-markets .s-head p { color: #cfe0d6; }

.s-mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

.s-m { background: #215a43; border-radius: 8px; padding: 20px; display: grid; gap: 12px; text-align: left; color: inherit; border: 2px solid transparent; cursor: pointer; }

.s-m:hover { border-color: #f2b230; }

.s-m h3 { font-size: 27px; font-weight: 900; }

.s-m .o { font-family: var(--mono); color: #f2b230; font-size: 13px; font-weight: 600; }

.s-m .bar { display: flex; gap: 3px; height: 16px; }

.s-m .bar i { display: block; border-radius: 2px; background: #fbfbf7; }

.s-m .bar i.o { flex: 1; background: transparent; border: 1.5px dashed #f2b230; }

.s-m .meta { font-size: 14px; color: #cfe0d6; }

.s-m .go { font-weight: 800; color: #f2b230; font-size: 15px; }

.s-aud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; }

.s-aud div { display: grid; gap: 8px; align-content: start; }

.s-aud h3 { font-size: 25px; font-weight: 800; }

.s-aud p { color: var(--s-ink2); }

.s-tag { width: max-content; max-width: 100%; background: #fbfbf7; border: 1px solid var(--s-line); border-radius: 3px; padding: 6px 12px 3px; font-weight: 800; font-size: 15px; }

.s-contact .in { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 52px; }

.s-form { background: #fff; border: 1px solid var(--s-line); border-radius: 10px; padding: 26px; display: grid; gap: 14px; color: #10231a; }

.s-form .fld input, .s-form .fld select, .s-form .fld textarea { background: #f4f5f0; border: 1px solid var(--s-line); border-radius: 6px; padding: 11px 12px 9px; width: 100%; color: #10231a; }

.s-form textarea { min-height: 90px; resize: vertical; }

.s-form .checks label { background: #f4f5f0; border-color: var(--s-line); }

.s-direct { display: grid; gap: 16px; margin-top: 26px; }

.s-direct div { border-left: 3px solid #f2b230; padding-left: 14px; }

.s-direct b { font-size: 20px; font-weight: 800; }

.s-foot { background: #17402f; color: #a9c2b5; font-size: 14px; }

.s-foot .in { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 26px; }

.s-ok { background: #dcefe4; color: #0e3d2a; border-radius: 8px; padding: 14px; }

.preview-bar { background: var(--amber-soft); color: var(--ink); font-size: 14px; }

.preview-bar .wrapw { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-block: 8px; }



@media (max-width: 980px) {

  .big4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .ov, .money { grid-template-columns: minmax(0, 1fr); }

  .s-hero .in, .s-contact .in { grid-template-columns: minmax(0, 1fr); gap: 36px; }

  .s-stats .in { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .s-stat:nth-child(3) { padding-left: 0; border-left: 0; }

  .s-stat:nth-child(n+3) { border-top: 1px solid var(--s-line); }

  .s-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 26px; }

  .s-step:nth-child(3) { padding-left: 0; border-left: 0; }

  .s-mgrid, .s-aud { grid-template-columns: minmax(0, 1fr); }

  .brand .bn { display: none; }

}

@media (max-width: 560px) {

  .big4 { grid-template-columns: minmax(0, 1fr); }

  .big .v { font-size: 28px; }

  .two { grid-template-columns: minmax(0, 1fr); }

  .mk { grid-template-columns: 96px minmax(0, 1fr) 76px; gap: 8px; }

  .hb { grid-template-columns: 100px minmax(0, 1fr) 70px; }

  .facts b { font-size: 18px; }

  .s-steps { grid-template-columns: minmax(0, 1fr); }

  .s-step + .s-step { padding-left: 0; border-left: 0; border-top: 1px solid var(--s-line); padding-top: 16px; }

  .s-stat b { font-size: 34px; }

  .sp { font-size: 18px; height: 46px; }

  .topbtn .tx { display: none; }

  .top-in { flex-wrap: wrap; row-gap: 6px; }

  .brand .bn { display: inline; font-size: 16px; }

  .topbtn { margin-left: auto; }

  .tabs { order: 3; flex-basis: 100%; margin-inline: -6px; }

  .tabs button { padding: 8px 10px 6px; font-size: 14.5px; }

}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }



/* ---- v3 additions: entry-first workflow ---- */

.newbtn { background: var(--amber-bright); color: #3b2a00; border: 0; border-radius: 8px; padding: 8px 14px 6px; font-weight: 800; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }

.newbtn:hover { filter: brightness(1.06); }

.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }

.qa { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; display: flex; gap: 12px; align-items: center; text-align: left; }

.qa:hover { border-color: var(--accent); box-shadow: var(--shadow); }

.qa .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }

.qa b { display: block; font-size: 15px; }

.qa small { color: var(--muted); font-size: 13px; }

.side-col { display: grid; gap: 18px; align-content: start; }

.mini-row { display: flex; gap: 10px; align-items: center; padding: 9px 0 7px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }

.mini-row:last-child { border-bottom: 0; }

.mini-row .grow b { display: block; }

.mini-row .grow small { color: var(--muted); font-size: 12.5px; }

.mini-row .r { font-family: var(--mono); font-weight: 600; }

.rank { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 600; flex: none; }

.tier { font-size: 11px; font-weight: 800; border-radius: 4px; padding: 2px 6px 0; letter-spacing: .04em; white-space: nowrap; }

.tier.A { background: var(--green); color: #eef5f0; }

.tier.B { background: var(--accent-soft); color: var(--accent); }

.tier.C { background: var(--soft); color: var(--ink-2); }

.tier.Z { background: var(--red-soft); color: var(--red); }

.cond { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }

.cond i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.c-good i { background: var(--accent); } .c-good { color: var(--accent); }

.c-repair i { background: var(--amber-bright); } .c-repair { color: var(--amber); }

.c-damaged i, .c-missing i { background: var(--red); } .c-damaged, .c-missing { color: var(--red); }

.c-none i { background: var(--muted); opacity: .5; } .c-none { color: var(--muted); }

.sign .cond { font-size: 12px; }

.seg2 { display: flex; gap: 6px; flex-wrap: wrap; }

.seg2 button { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px 8px; font-weight: 700; font-size: 14px; flex: 1 1 0; min-width: 110px; }

.seg2 button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.seg2 button.good[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.seg2 button.warn[aria-pressed="true"] { background: var(--amber-bright); border-color: var(--amber-bright); color: #3b2a00; }

.seg2 button.bad[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }

.chk { display: grid; gap: 6px; }

.chk-i { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 6px 12px; }

.chk-i > span:first-child { flex: 1; min-width: 0; }

.chk-i .yn { flex: none; }

.yn { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }

.yn button { border: 0; background: var(--card); padding: 6px 12px 4px; font-weight: 700; font-size: 13px; }

.yn button[aria-pressed="true"].y { background: var(--accent); color: var(--accent-ink); }

.yn button[aria-pressed="true"].n { background: var(--red); color: #fff; }

.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }

.thumbs img, .thumbs .ph { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); }

.thumbs .ph { display: grid; place-items: center; color: var(--muted); font-size: 12px; }

.photo-add { width: 76px; height: 76px; border-radius: 8px; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); cursor: pointer; font-size: 12px; text-align: center; }

dialog.modal.wide { width: min(640px, calc(100% - 24px)); }

.mf .scroll { max-height: calc(100vh - 220px); overflow: auto; display: grid; gap: 14px; padding-right: 2px; }

.sect { display: grid; gap: 10px; }

.sect > .lbl { margin-top: 4px; }

.timeline { display: grid; gap: 0; }

.tl { display: grid; grid-template-columns: 92px 14px minmax(0, 1fr); gap: 10px; font-size: 14px; }

.tl .d { color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 2px; text-align: right; }

.tl .dot { position: relative; }

.tl .dot::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--line); }

.tl .dot::after { content: ""; position: absolute; left: 2px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.tl .dot.end::after { background: var(--muted); }

.tl .dot.insp::after { background: var(--amber-bright); }

.tl .t { padding-bottom: 12px; }

.cdir { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }

.clist { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow: auto; padding: 6px; }

.citem { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 10px 10px 8px; }

.citem:hover { background: var(--soft); }

.citem[aria-current="true"] { background: var(--accent-soft); }

.citem .grow b { display: block; font-size: 14.5px; }

.citem .grow small { color: var(--muted); font-size: 12.5px; }

.citem .r { font-family: var(--mono); font-size: 13px; font-weight: 600; }

.prof { display: grid; gap: 16px; }

.prof-h { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: start; }

.prof-h h2 { font-size: 30px; font-weight: 900; }

.stats5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }

.stats5 div { background: var(--soft); border-radius: 8px; padding: 10px 12px 8px; min-width: 0; }

.stats5 b { display: block; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }

.stats5 small { color: var(--muted); font-size: 12px; }

.mgroup { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.mgroup-h { display: flex; justify-content: space-between; padding: 10px 14px 8px; background: var(--soft); font-weight: 800; }

.mgroup-h span { font-family: var(--mono); font-weight: 600; }

.lrow { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 14px 8px; border-top: 1px solid var(--line); font-size: 14px; }

.lrow .code { font-weight: 800; }

.lrow small { color: var(--muted); display: block; font-size: 12.5px; }

.lrow .m { font-family: var(--mono); font-weight: 600; text-align: right; }

.contact { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; }

.contact span { display: inline-flex; gap: 6px; align-items: center; }

.sortsel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.wiz-step { display: grid; gap: 12px; }

.wiz-list { display: grid; gap: 6px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

.wiz-list div { display: flex; justify-content: space-between; gap: 12px; }

.wiz-list span:last-child { font-family: var(--mono); color: var(--muted); white-space: nowrap; }

.radio { display: grid; gap: 8px; }

.radio label { display: flex; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 8px; cursor: pointer; }

.radio label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

.radio small { display: block; color: var(--muted); font-size: 13px; }

.past summary { cursor: pointer; color: var(--ink-2); font-weight: 700; font-size: 14px; padding: 6px 0; }

.repair { display: flex; gap: 12px; align-items: center; padding: 12px 0 10px; border-bottom: 1px solid var(--line); }

.repair:last-child { border-bottom: 0; }

.repair .grow b { display: block; }

.repair .grow small { color: var(--muted); font-size: 13px; }

.selwrap { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }

.selwrap select { width: auto; }

@media (max-width: 980px) {

  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .cdir { grid-template-columns: minmax(0, 1fr); }

  .clist { position: static; max-height: 340px; }

  .stats5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

}

@media (max-width: 560px) {

  .quick { grid-template-columns: minmax(0, 1fr); }

  .stats5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .lrow { grid-template-columns: 70px minmax(0, 1fr) auto; }

  .lrow .btn { display: none; }

  .newbtn .tx { display: none; }

  .tl { grid-template-columns: 74px 14px minmax(0, 1fr); }

}

.filters { display: flex; flex-direction: column; }

.filters .row > * { min-width: 0; }

.filters .row > .chips { max-width: 100%; }

.filters > *, .page-h > * { min-width: 0; }

@media (max-width: 560px) { .filters .row > .chips { flex-basis: 100%; } .page-h .row { width: 100%; } .page-h .row .btn { flex: 1 1 auto; justify-content: center; } }



/* ===== City Wide Signs · enterprise operating system redesign ===== */
:root{--bg:#f4f6fa;--card:#fff;--soft:#f0f3f8;--ink:#172235;--ink-2:#536176;--muted:#7b8798;--line:#e0e6ef;--green:#10243b;--green-2:#18395a;--accent:#1464d2;--accent-ink:#fff;--accent-soft:#e7f0ff;--amber:#a65c00;--amber-bright:#ffbd4a;--amber-soft:#fff4dc;--red:#b42335;--red-soft:#fff0f1;--shadow:0 2px 5px rgba(18,36,59,.035),0 14px 36px rgba(18,36,59,.065);--r:14px;color-scheme:light}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121d2e;--soft:#172438;--ink:#edf3fc;--ink-2:#bdc9da;--muted:#8fa0b7;--line:#29374b;--green:#0d1a2c;--green-2:#18395a;--accent:#6ca8ff;--accent-ink:#06152c;--accent-soft:#172d4b;--amber:#ffd078;--amber-soft:#3c2d16;--red:#ff858e;--red-soft:#3d1d2a;color-scheme:dark}
body{font-size:14px;line-height:1.55;letter-spacing:.005em;background:radial-gradient(ellipse at 10% -10%,rgba(20,100,210,.06),transparent 40%),var(--bg)}

.top-in{max-width:1600px;min-height:70px;gap:20px;padding-block:13px}
.brand{font-size:16px;letter-spacing:-.025em;gap:11px}.mark{width:38px;height:38px;border-radius:11px;background:#f6f9ff;color:#12375d;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tabs{gap:4px}.tabs button{font-size:13px;padding:10px 13px;border-radius:9px;color:#b7c7dc}.tabs button[aria-current="page"]{background:#234a75;color:white;box-shadow:inset 0 -2px 0 #7cb6ff}.tabs button:hover{background:rgba(255,255,255,.09);color:white}
.newbtn{background:#fff;color:#143354;border:0;border-radius:10px;font-weight:800;padding:10px 15px;box-shadow:0 4px 12px rgba(0,0,0,.12)}.newbtn:hover{background:#eaf2ff}.topbtn{border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.08);padding:9px 12px}
main.app{padding-block:32px 72px}.wrapw{max-width:1450px}.page-h{margin-bottom:24px;align-items:center}.page-h h1{font-size:clamp(28px,3vw,36px);font-weight:850;letter-spacing:-.045em;color:var(--ink)}.page-h p{font-size:14px;max-width:72ch;color:var(--ink-2);line-height:1.65}
.card{border-radius:16px;padding:22px;box-shadow:var(--shadow);border-color:var(--line)}.card h2{font-size:16px;letter-spacing:-.02em}.card .sub{font-size:12.5px;line-height:1.55}.btn{border-radius:9px;padding:10px 14px;font-size:13px;transition:transform .15s,box-shadow .15s,border-color .15s}.btn:hover{box-shadow:0 5px 14px rgba(18,36,59,.08);border-color:#9eafc5}.btn.pri{background:var(--accent);border-color:var(--accent);box-shadow:0 5px 12px rgba(20,100,210,.17)}.btn.amb{box-shadow:0 5px 12px rgba(255,189,74,.18)}
.input{border-radius:10px;min-height:42px;background:var(--card);border-color:var(--line)}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);outline:0}.chip{border-radius:10px;font-size:12px;padding:8px 12px}.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:white}

":"Commerce City|Kiosk Key|C-25","side":"WB","clientId":"c24","community":"","panels":1,"rate":0,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p507","signId":"Commerce City|Kiosk Key|C-25","side":"EB","clientId":"c6","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-09-19","end":"","notes":"","source":"spreadsheet"},{"id":"p508","signId":"Commerce City|Kiosk Key|C-25","side":"EB","clientId":"c1","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p509","signId":"Commerce City|Kiosk Key|C-25","side":"EB","clientId":"c1","community":"Turnberry","panels":1,"rate":85,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p510","signId":"Commerce City|Kiosk Key|C-25","side":"EB","clientId":"c10","community":"Arras Park","panels":1,"rate":85,"free":false,"start":"2025-10-28","end":"","notes":"","source":"spreadsheet"},{"id":"p511","signId":"Commerce City|Kiosk Key|C-26","side":"EB","clientId":"c6","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-09-19","end":"","notes":"","source":"spreadsheet"},{"id":"p512","signId":"Commerce City|Kiosk Key|C-27","side":"EB","clientId":"c10","community":"Arras Park","panels":1,"rate":85,"free":false,"start":"2025-10-28","end":"","notes":"","source":"spreadsheet"},{"id":"p513","signId":"Commerce City|Kiosk Key|C-27","side":"EB","clientId":"c1","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p514","signId":"Commerce City|Kiosk Key|C-27","side":"EB","clientId":"c6","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p515","signId":"Commerce City|Kiosk Key|C-27","side":"WB","clientId":"c21","community":"All communities","panels":1,"rate":0,"free":true,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p516","signId":"Commerce City|Kiosk Key|C-27","side":"WB","clientId":"c10","community":"Arras Park","panels":1,"rate":85,"free":false,"start":"2025-10-28","end":"","notes":"","source":"spreadsheet"},{"id":"p517","signId":"Commerce City|Kiosk Key|C-28","side":"EB","clientId":"c3","community":"Second Creek","panels":1,"rate":85,"free":false,"start":"2026-02-06","end":"","notes":"","source":"spreadsheet"},{"id":"p518","signId":"Commerce City|Kiosk Key|C-28","side":"EB","clientId":"c1","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p519","signId":"Commerce City|Kiosk Key|C-29","side":"EB","clientId":"c6","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"},{"id":"p520","signId":"Commerce City|Kiosk Key|C-29","side":"EB","clientId":"c1","community":"Legato","panels":1,"rate":85,"free":false,"start":"2025-03-18","end":"","notes":"","source":"spreadsheet"}],"inspections":[],"leads":[],"settings":{"inspectEvery":90,"checklist":["Sign is standing and level","All panels readable from the road","No graffiti, dirt or fading","Arrows point the right way","Posts and base solid","Nothing blocking the view"]}}</script>

<script>

(() => {

// Website form: paste a form-service URL (e.g. [https://formspree.io/f/xxxx](https://formspree.io/f/xxxx)) so website requests also reach an inbox.

const FORM_ENDPOINT = "";



// ================= State =================

const SEED = JSON.parse(document.getElementById("seed").textContent);

const KEY = "cws.app.v3";

const MARKET_ORDER = ["Aurora", "Brighton", "Commerce City", "Bennett", "Castle Rock", "Timnath"];

const TODAY = (() => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
})();

let S = load();

function load() {

  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.v === 3 && s.signs) return fill(s); } catch (e) {}

  return fill(JSON.parse(JSON.stringify(SEED)));

}

function fill(s) { s.clients ||= []; s.signs ||= []; s.leases ||= []; s.inspections ||= []; s.leads ||= []; s.settings ||= JSON.parse(JSON.stringify(SEED.settings)); return s; }

let undoSnap = null;

function snapshot() { undoSnap = JSON.stringify(S); }

function persist() { try { S.savedAt = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { toast("Couldn't save in this browser. Download a backup from Data."); return false; } }

function save(msg, undoable) { persist(); render(); if (drawerState) reopenDrawer(); if (msg) toast(msg, undoable); }

function undo() { if (!undoSnap) return; S = fill(JSON.parse(undoSnap)); undoSnap = null; save("Undone"); }



// ================= Helpers =================

const $ = (id) => document.getElementById(id);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const money = (n) => (n < 0 ? "−$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US");

const n0 = (n) => Math.round(n).toLocaleString("en-US");

const pct = (n) => Math.round(n * 100) + "%";

const niceDate = (iso, short) => { if (!iso) return "No date"; const d = new Date(iso + "T12:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-US", short ? { month: "short", year: "numeric" } : { month: "short", day: "numeric", year: "numeric" }); };

const days = (a, b = TODAY) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);

const addDays = (iso, n) => new Date(new Date(iso + "T12:00").getTime() + n * 864e5).toISOString().slice(0, 10);

const uid = (p) => (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

const ICON = {

  search: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg>',

  plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>',

  arrow: '<svg width="16" height="14" viewBox="0 0 34 24"><path d="M2 12h26M20 3l9 9-9 9" fill="none" stroke="currentColor" stroke-width="4.5"/></svg>',

  panel: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="13" width="18" height="6" rx="1" stroke-dasharray="3 2"/></svg>',

  clip: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 12l2 2 4-4"/></svg>',

  user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>',

  sign: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h13l4 3-4 3H3z"/><rect x="10.5" y="15" width="3" height="7"/><rect x="10.5" y="2" width="3" height="7"/></svg>',

};

const COND = { "Good": "c-good", "Needs repair": "c-repair", "Damaged": "c-damaged", "Missing": "c-missing", "Not inspected": "c-none" };

const condHTML = (c) => `<span class="cond ${COND[c] || "c-none"}"><i></i>${esc(c)}</span>`;



// ================= Derived model =================

const occupies = (l) => !l.end || l.end > TODAY;                       // holds a slot (current or booked)

const billing = (l) => occupies(l) && (!l.start || l.start <= TODAY); // billing now

const monthly = (l) => (billing(l) && !l.free && l.rate > 0 ? l.rate * l.panels : 0);

const kind = (l) => (l.free ? "free" : l.rate > 0 ? "paid" : "unb");

function monthsBilled(l) { if (!l.start || l.free || !(l.rate > 0)) return 0; const end = l.end && l.end < TODAY ? l.end : TODAY; const d = days(l.start, end); return d > 0 ? d / 30.44 : 0; }

let M;

function derive() {

  const signById = new Map(S.signs.map((s) => [s.id, s]));

  const clientById = new Map(S.clients.map((c) => [c.id, c]));

  const markets = [...new Set(S.signs.map((s) => s.market))].sort((a, b) => (MARKET_ORDER.indexOf(a) + 1 || 99) - (MARKET_ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b));

  const rates = {};

  for (const m of markets) { const r = S.leases.filter((l) => l.rate > 1 && signById.get(l.signId)?.market === m).map((l) => l.rate).sort((a, b) => a - b); rates[m] = r.length ? r[Math.floor(r.length / 2)] : 85; }

  const inspBySign = new Map();

  for (const i of [...S.inspections].sort((a, b) => (a.date < b.date ? 1 : -1))) { if (!inspBySign.has(i.signId)) inspBySign.set(i.signId, []); inspBySign.get(i.signId).push(i); }

  const every = S.settings.inspectEvery || 90;

  const signs = S.signs.map((s) => {

    const all = S.leases.filter((l) => l.signId === s.id), cur = all.filter(occupies), past = all.filter((l) => !occupies(l));

    const active = s.status === "Active";

    const sides = s.sides.map((name) => { const list = cur.filter((l) => l.side === name); const used = list.reduce((a, l) => a + l.panels, 0); const cap = active ? Math.max(s.slots, used) : used; return { name, list, used, cap, open: cap - used }; });

    const used = sides.reduce((a, x) => a + x.used, 0), cap = sides.reduce((a, x) => a + x.cap, 0);

    const insp = inspBySign.get(s.id) || [], last = insp[0];

    const due = !last || days(last.date) >= every;

    return { ...s, cur, past, sides, used, cap, open: cap - used, active, rate: rates[s.market] || 85, mrr: cur.reduce((a, l) => a + monthly(l), 0),

      insp, last, due, cond: last ? last.condition : "Not inspected", sortCode: s.code.replace(/\d+/g, (d) => d.padStart(4, "0")) };

  }).sort((a, b) => markets.indexOf(a.market) - markets.indexOf(b.market) || a.sortCode.localeCompare(b.sortCode));

  const signMap = new Map(signs.map((s) => [s.id, s]));

  // Clients

  const yearAgo = addDays(TODAY, -365);

  const clients = S.clients.map((c) => {

    const ls = S.leases.filter((l) => l.clientId === c.id), cur = ls.filter(occupies);

    const mrr = cur.reduce((a, l) => a + monthly(l), 0);

    const starts = ls.map((l) => l.start).filter(Boolean).sort();

    return { ...c, leases: ls, cur, mrr, panels: cur.reduce((a, l) => a + l.panels, 0), lifetime: ls.reduce((a, l) => a + monthsBilled(l) * l.rate * l.panels, 0),

      signs: new Set(cur.map((l) => l.signId)).size, markets: [...new Set(cur.map((l) => signMap.get(l.signId)?.market).filter(Boolean))],

      communities: [...new Set(cur.map((l) => l.community).filter(Boolean))], since: starts[0] || "",

      added12: ls.filter((l) => l.start && l.start >= yearAgo && l.start <= TODAY).reduce((a, l) => a + l.panels, 0),

      endingSoon: cur.filter((l) => l.end && days(TODAY, l.end) <= 60).length,

      atRisk: cur.filter((l) => { const s = signMap.get(l.signId); return s && (!s.active || ["Damaged", "Missing"].includes(s.cond)); }).length };

  });

  // Tiers: clients making up the first 80% of billing are Key accounts, next 15% Growing, rest Small

  const total = clients.reduce((a, c) => a + c.mrr, 0); let run = 0;

  [...clients].sort((a, b) => b.mrr - a.mrr).forEach((c) => { if (!c.mrr) { c.tier = c.panels ? "Z" : "C"; return; } c.tier = run / total < 0.8 ? "A" : run / total < 0.95 ? "B" : "C"; run += c.mrr; });

  const repairs = S.inspections.filter((i) => i.repair && i.repair.needed && i.repair.status !== "Fixed").map((i) => ({ i, s: signMap.get(i.signId) })).filter((r) => r.s);

  return { signs, signMap, clients, clientById, markets, rates, total, repairs, every };

}

const TIERNAME = { A: "Key account", B: "Growing", C: "Small", Z: "Not paying" };

const tierHTML = (t) => `<span class="tier ${t}">${TIERNAME[t]}</span>`;

const cName = (id) => M.clientById.get(id)?.name || "Unknown client";



function todos() {

  const out = [];

  for (const l of S.leases) {

    if (!occupies(l)) continue;

    const s = M.signMap.get(l.signId); if (!s) continue; const who = `<b>${esc(cName(l.clientId))}</b> on ${esc(s.market)} ${esc(s.code)}`;

    if (kind(l) === "unb") out.push({ k: "red", g: "Panels up with no price", text: who, small: `Earns nothing. Worth ${money(s.rate * l.panels)} a month at the going rate.`, act: "Set price", fn: () => leaseForm({ id: l.id }) });

    else if (kind(l) === "paid" && !l.start) out.push({ k: "amb", g: "Missing start dates", text: who, small: "Add the start date so billing history is right.", act: "Add date", fn: () => leaseForm({ id: l.id }) });

    else if (l.start > TODAY && days(TODAY, l.start) > 120) out.push({ k: "amb", g: "Start dates that look wrong", text: `${who}: starts ${niceDate(l.start)}`, small: "Far in the future, so it isn't billing yet. Probably a typo.", act: "Fix date", fn: () => leaseForm({ id: l.id }) });

    else if (kind(l) !== "free" && !l.community) out.push({ k: "amb", g: "Panels with no community", text: who, small: "Which community does this panel point to?", act: "Add community", fn: () => leaseForm({ id: l.id }) });

    if (l.end && l.end > TODAY && days(TODAY, l.end) <= 30) out.push({ k: "amb", g: "Leases ending in the next 30 days", text: `${who} ends ${niceDate(l.end)}`, small: "Call about renewing, or line up the next client for the slot.", act: "Open", fn: () => openSign(s.id) });

  }

  for (const s of M.signs) if (!s.active) out.push({ k: "red", g: "Signs flagged in the field", text: `<b>${esc(s.market)} ${esc(s.code)}</b> is marked “${esc(s.status)}”`, small: s.notes || "Inspect it to confirm what's there.", act: "Inspect", fn: () => inspectionForm({ signId: s.id }) });

  for (const r of M.repairs) out.push({ k: "red", g: "Open repairs", text: `<b>${esc(r.s.market)} ${esc(r.s.code)}</b>: ${esc(r.i.repair.what || r.i.condition)}`, small: `Found ${niceDate(r.i.date)}${r.i.inspector ? " by " + r.i.inspector : ""} · ${r.i.repair.status}`, act: "Update", fn: () => repairForm(r.i.id) });

  return out;

}



// ================= Routing =================

const TABS = [["home", "Home"], ["signs", "Signs"], ["clients", "Clients"], ["inspections", "Inspections"], ["money", "Money"], ["website", "Website"]];

let tab = (location.hash || "").replace("#", "");

if (!TABS.some((t) => t[0] === tab) && tab !== "site") tab = "home";

const ui = { market: "All", q: "", show: "all", cq: "", ctype: "All", cview: "dir", csort: "mrr", client: null, imarket: "All", sell: 6, months: 12, inspector: "" };

try { Object.assign(ui, JSON.parse(localStorage.getItem("cws.ui.v3") || "{}"), { q: "", cq: "" }); } catch (e) {}

const saveUi = () => { try { const { q, cq, ...rest } = ui; localStorage.setItem("cws.ui.v3", JSON.stringify(rest)); } catch (e) {} };

function go(t) { tab = t; try { history.replaceState(null, "", "#" + t); } catch (e) {} render(); window.scrollTo(0, 0); }

window.addEventListener("hashchange", () => { const t = location.hash.replace("#", ""); if (t !== tab && (TABS.some((x) => x[0] === t) || t === "site")) { tab = t; render(); } });

function renderTabs() {

  const n = todos().length + S.leads.filter((l) => !l.done).length, due = M.signs.filter((s) => s.due).length;

  $("tabs").innerHTML = TABS.map(([k, l]) => `<button type="button" data-tab="${k}" ${tab === k ? 'aria-current="page"' : ""}>${l}${k === "home" && n ? `<span class="dot">${n}</span>` : ""}${k === "inspections" && M.repairs.length ? `<span class="dot">${M.repairs.length}</span>` : ""}</button>`).join("");

}

$("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });

// Global command search: jump directly to a sign, client, or market from any screen.
const gs = $("global-search"), gr = $("global-results");
function drawGlobalSearch() {
  const q = (gs.value || "").trim().toLowerCase();
  if (!q) { gr.hidden = true; gr.innerHTML = ""; return; }
  const hits = [];
  M.signs.forEach(s => { const hay = [s.code,s.market,s.location,s.notes,...s.cur.map(l=>cName(l.clientId)+" "+l.community)].join(" ").toLowerCase(); if (hay.includes(q)) hits.push({type:"Sign",title:s.market+" · "+s.code,sub:(s.location||"No location recorded")+" · "+s.open+" open panels",run:()=>{ui.market=s.market;ui.q=s.code;ui.show="all";saveUi();go("signs");}}); });
  M.clients.forEach(c => { const hay=[c.name,c.email,c.phone,...(c.markets||[])].join(" ").toLowerCase(); if(hay.includes(q)) hits.push({type:"Client",title:c.name,sub:(c.panels||0)+" panels · "+money(c.mrr)+" / month",run:()=>{ui.client=c.id;ui.cview="dir";saveUi();go("clients");}}); });
  M.markets.forEach(m=>{if(m.toLowerCase().includes(q))hits.push({type:"Market",title:m,sub:"Open this market's sign inventory",run:()=>{ui.market=m;ui.show="all";ui.q="";saveUi();go("signs");}})});
  const top=hits.slice(0,9);
  gr.innerHTML=top.length?top.map((h,i)=>`<button type="button" data-global-hit="${i}"><span class="gtype">${h.type}</span><span><b>${esc(h.title)}</b><small>${esc(h.sub)}</small></span></button>`).join(""):`<div style="padding:14px;color:var(--muted);font-size:12px">No matching signs or clients found.</div>`;
  gr._hits=top;gr.hidden=false;
}
gs.addEventListener("input",drawGlobalSearch);
gs.addEventListener("keydown",e=>{if(e.key==="Escape"){gr.hidden=true;gs.blur()}else if(e.key==="Enter"){const h=gr._hits&&gr._hits[0];if(h){h.run();gr.hidden=true;gs.value=""}}else if(e.key==="ArrowDown"){gr.querySelector("button")?.focus();e.preventDefault()}});
gr.addEventListener("click",e=>{const b=e.target.closest("[data-global-hit]");if(!b)return;const h=gr._hits?.[+b.dataset.globalHit];if(h)h.run();gr.hidden=true;gs.value="";});
gr.addEventListener("keydown",e=>{if(e.key==="Escape"){gr.hidden=true;gs.focus()}});
document.addEventListener("click",e=>{if(!e.target.closest("#global-search-wrap"))gr.hidden=true});

function render() {

  M = derive();

  const pub = tab === "site";

  $("topbar").hidden = pub;

  renderTabs();

  const v = $("view");

  if (tab === "website" || pub) { v.innerHTML = (pub ? "" : `<div class="preview-bar gut"><div class="wrapw"><span>This is the public website. Add <b>#site</b> to the end of the address to show it without the team tabs.</span><button class="btn sm" type="button" data-go="home">Back to team view</button></div></div>`) + siteHTML(); wireSite(); return; }

  v.innerHTML = `<main class="app gut"><div class="wrapw" id="page"></div></main>`;

  ({ home, signs: signsPage, clients: clientsPage, inspections: inspPage, money: moneyPage })[tab]();

}

  const T = todos(), leads = S.leads.filter((l) => !l.done), due = sg.filter((s) => s.due).length;
  const renewals = S.leases.filter((l) => occupies(l) && l.end && l.end >= TODAY && days(TODAY, l.end) <= 60);

        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px"><div><div class="lbl">Current monthly billing</div><div class="growth-stat">${money(mrr)}</div></div><div style="text-align:right"><div class="lbl">Monthly target</div><label style="display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:5px"><span style="font-size:12px;color:var(--muted)">$</span><input id="revenue-target" type="number" min="1" step="500" value="${savedTarget}" aria-label="Monthly revenue target" style="width:118px;padding:8px 9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:13px"></label></div></div>

        </div>

    </div>
    <div class="dash-lower">
      <section class="card"><div class="dash-card-head"><div><h2>Market performance</h2><p>Compare billing and capacity by market. Select a market to open its inventory.</p></div><span class="dash-chip">${M.markets.length} markets</span></div>
        <div class="market-list">${marketStats.map(x=>`<button class="market-row" type="button" data-market-open="${esc(x.m)}"><span><span class="market-name">${esc(x.m)}</span><small class="market-meta">${n0(x.open)} open · ${n0(x.mu)}/${n0(x.mc)} leased</small></span><span class="market-track"><i style="width:${x.mc?Math.min(100,x.mu/x.mc*100):0}%"></i></span><span class="market-money">${money(x.mrr)}<small>per month</small></span></button>`).join("") || `<div class="empty">No market records yet.</div>`}</div>
      </section>
      <section class="card"><div class="dash-card-head"><div><h2>Top client accounts</h2><p>Largest current billing relationships, based on recorded leases.</p></div><button class="btn sm" type="button" data-cv="rank">View all →</button></div>

      </section>
    </div>

      <section class="card"><div class="dash-card-head"><div><h2>Action queue</h2><p>Items with a next step. Use the action button to work directly in the app.</p></div><span class="dash-chip">${T.length+leads.length+due} items</span></div><div class="todo" id="todo"></div></section>

        <button class="qa" type="button" data-q="insp"><span class="ic">${ICON.clip}</span><span><b>Record inspection</b><small>Log condition or repairs</small></span></button>
        <button class="qa" type="button" data-q="client"><span class="ic">${ICON.user}</span><span><b>Add a client</b><small>Build your account list</small></span></button>
        <button class="qa" type="button" data-q="sign"><span class="ic">${ICON.sign}</span><span><b>Add a sign</b><small>Expand inventory</small></span></button>

  const page = $("page");

  page.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{const v=b.dataset.go;if(v.startsWith("signs:")){ui.market=v.slice(6);ui.q="";saveUi();go("signs");}else go(v);}));
  page.querySelectorAll("[data-market-open]").forEach(b=>b.addEventListener("click",()=>{ui.market=b.dataset.marketOpen;ui.q="";saveUi();go("signs");}));
  page.querySelectorAll("[data-open-client]").forEach(b=>b.addEventListener("click",()=>{ui.client=b.dataset.openClient;ui.cview="dir";saveUi();go("clients");}));
  page.querySelector("[data-cv]").addEventListener("click",()=>{ui.cview="rank";saveUi();go("clients");});
  page.querySelector("#save-target").addEventListener("click",()=>{const v=Math.max(1,Number(page.querySelector("#revenue-target").value)||targetDefault);try{localStorage.setItem("cws.revenueTarget.v1",String(v));}catch(e){}toast("Monthly revenue target saved");home();});

  box.innerHTML=parts.join("")||`<div class="empty"><b>You're all caught up.</b><span style="display:block;margin-top:4px">No open follow-ups or operational issues were found in the current records.</span></div>`;
  box.addEventListener("click",e=>{
    const t=e.target.closest("[data-todo]");if(t){const [g,i]=t.dataset.todo.split(":").map(Number);gl[g][i].fn();return;}
    const m=e.target.closest("[data-more]");if(m){const gi=+m.dataset.more;m.outerHTML=gl[gi].slice(3).map((t,i)=>item(t,gi,i+3)).join("");return;}
    const l=e.target.closest("[data-lead]");if(l){snapshot();const found=S.leads.find(x=>x.id===l.dataset.lead);if(found)found.done=true;save("Request marked complete",true);return;}
    const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);}
  });
}

const qMatch = (q, text) => { q = q.toLowerCase(); return !q || q.split(/\s+/).every((w) => text.toLowerCase().includes(w)); };

function drawSigns() {

  const list = M.signs.filter((s) => (ui.market === "All" || s.market === ui.market)

    && (ui.show === "all" || (ui.show === "open" && s.active && s.open > 0) || (ui.show === "full" && s.active && !s.open) || (ui.show === "due" && s.due) || (ui.show === "check" && (!s.active || ["Damaged", "Missing", "Needs repair"].includes(s.cond))))

    && qMatch(ui.q, [s.code, s.market, s.location, s.notes, ...s.cur.map((l) => cName(l.clientId) + " " + l.community)].join(" ")));

  const open = list.reduce((a, s) => a + s.open, 0);

  $("sres").innerHTML = list.length ? `<p style="color:var(--muted);margin-bottom:12px">${list.length} sign${list.length > 1 ? "s" : ""} · ${open} open panel${open === 1 ? "" : "s"} worth ${money(list.reduce((a, s) => a + s.open * s.rate, 0))} a month</p><div class="signs">${list.map(signCard).join("")}</div>`

    : `<div class="card empty"><b>No signs match.</b><span>Try another search or market.</span><button class="btn" type="button" id="clr">Clear filters</button></div>`;

  const c = $("clr"); if (c) c.onclick = () => { ui.q = ""; ui.show = "all"; ui.market = "All"; saveUi(); signsPage(); };

  $("sres").onclick = (e) => { const b = e.target.closest("[data-sign]"); if (b) openSign(b.dataset.sign); };

}

function slotsHTML(s, side, big) {

  const h = big ? 24 : 15, q = big ? "" : ui.q;

  const hit = (l) => { if (!q) return null; const t = (cName(l.clientId) + " " + l.community).toLowerCase(); return q.toLowerCase().split(/\s+/).some((w) => w && t.includes(w)); };

  return side.list.map((l) => { const k = kind(l), x = hit(l), fut = l.start > TODAY; return `<div class="slot ${k === "free" ? "free" : k === "unb" ? "unb" : ""}${x === true ? " hit" : x === false ? " dim" : ""}" style="height:${l.panels * h + (l.panels - 1) * 3}px${fut ? ";opacity:.7" : ""}" title="${esc(cName(l.clientId) + (l.community ? " · " + l.community : "") + (fut ? " · starts " + niceDate(l.start) : ""))}" ${big ? `data-lease="${esc(l.id)}" role="button" tabindex="0" style="cursor:pointer"` : ""}>${esc(k === "free" && cName(l.clientId) === "HBA" ? "HBA" : cName(l.clientId))}${l.panels > 1 ? " ×" + l.panels : ""}</div>`; }).join("")

    + Array.from({ length: side.open }, () => `<div class="slot open${q ? " dim" : ""}" ${big ? `data-addside="${esc(side.name)}" role="button" tabindex="0"` : ""}>${big ? "+ Open: lease this panel" : "Open"}</div>`).join("");

}

function kioskHTML(s, big) {

  if (!s.active) return `<div class="kio off">${esc(s.status)}</div>`;

  return `<div class="kio">${s.sides.map((sd) => `<div class="side">${s.sides.length > 1 ? `<div class="side-l">${esc(sd.name)}</div>` : ""}${slotsHTML(s, sd, big)}</div>`).join("")}</div>`;

}

function signCard(s) {

  const pill = !s.active ? `<span class="pill bad">${esc(s.status)}</span>` : s.open ? `<span class="pill open">${s.open} open</span>` : `<span class="pill full">Full</span>`;

  return `<button type="button" class="sign" data-sign="${esc(s.id)}"><div class="sign-h"><div><b>${esc(s.code)}</b><small>${esc(s.market)}${s.location ? " · " + esc(s.location) : ""}</small></div>${pill}</div>${kioskHTML(s)}<div class="sign-f"><span><b>${money(s.mrr)}</b>/mo</span>${condHTML(s.due && s.last ? s.cond + " · due" : s.cond)}</div></button>`;

}



// ================= Drawer: sign =================

let drawerState = null;

function reopenDrawer() { if (!drawerState || !$("drawer").open) return; if (drawerState.type === "sign") openSign(drawerState.id, true); }

function openSign(id, keep) {

  const s = M.signMap.get(id); if (!s) { if ($("drawer").open) $("drawer").close(); return; }

  drawerState = { type: "sign", id };

  const leaseRow = (l, ended) => `<div class="pi"><div class="t"><b>${esc(cName(l.clientId))}${l.panels > 1 ? ` <span class="pill grey">${l.panels} panels</span>` : ""}</b><small>${esc(l.community || "No community")}${s.sides.length > 1 ? " · " + esc(l.side) : ""} · ${ended ? `${niceDate(l.start)} to ${niceDate(l.end)}` : l.start > TODAY ? "starts " + niceDate(l.start) : "since " + niceDate(l.start)}${l.end && !ended ? " · ends " + niceDate(l.end) : ""}</small></div><span class="m">${kind(l) === "paid" ? money(l.rate * l.panels) : kind(l) === "free" ? '<span class="pill grey">No charge</span>' : '<span class="pill bad">No price</span>'}</span><button class="btn sm" type="button" data-lease="${esc(l.id)}">Edit</button></div>`;

  $("drawer-in").innerHTML = `

$("drawer").addEventListener("click", (e) => {

  const id = drawerState.id;

  const a = e.target.closest("[data-addside]"); if (a) { leaseForm({ signId: id, side: a.dataset.addside }); return; }

  const l = e.target.closest("[data-lease]"); if (l) { leaseForm({ id: l.dataset.lease }); return; }

  const ins = e.target.closest("[data-insp]"); if (ins) { inspectionView(ins.dataset.insp); return; }

  const act = e.target.closest("[data-act]"); if (!act) return;

  ({ lease: () => leaseForm({ signId: id }), inspect: () => inspectionForm({ signId: id }), edit: () => signForm(id) })[act.dataset.act]();

});

$("drawer").addEventListener("keydown", (e) => { if (e.key !== "Enter" && e.key !== " ") return; const t = e.target.closest?.("[data-addside],[data-lease]"); if (t) { e.preventDefault(); t.click(); } });

function modal(html, onReady, wide) { $("modal").classList.toggle("wide", !!wide); $("modal-in").innerHTML = html; if (!$("modal").open) $("modal").showModal(); onReady && onReady($("modal-in")); }

const closeModal = () => $("modal").open && $("modal").close();

$("modal").addEventListener("click", (e) => { if (e.target === $("modal") || e.target.closest("[data-cancel]")) closeModal(); });

$("modal").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT" && !["checkbox", "radio", "file"].includes(e.target.type)) { e.preventDefault(); $("modal-in").querySelector("[data-ok]")?.click(); } });

function twoStep(btn, label, fn) { btn.onclick = () => { if (btn.dataset.sure) fn(); else { btn.dataset.sure = 1; btn.textContent = label; } }; }

}

  });

}



// ================= Photos (stored in IndexedDB, not in the main save) =================

let dbp = null;

function db() { return dbp ||= new Promise((res, rej) => { try { const r = indexedDB.open("cws-photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("p"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }

async function putPhoto(id, data) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction("p", "readwrite"); t.objectStore("p").put(data, id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }

async function getPhoto(id) { try { const d = await db(); return await new Promise((res) => { const q = d.transaction("p").objectStore("p").get(id); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }

function shrink(file) { return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file); img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.72)); }; img.onerror = () => rej(new Error("That file isn't a photo.")); img.src = u; }); }

async function fillThumbs(el, ids) { for (const id of ids) { const src = await getPhoto(id); const n = el.querySelector(`[data-ph="${id}"]`); if (n && src) n.outerHTML = `<img src="${src}" alt="Inspection photo" data-ph="${id}">`; } }

function inspectionForm({ signId, id }) {

  const ex = id ? S.inspections.find((x) => x.id === id) : null;

  signId = ex ? ex.signId : signId;

  const checklist = S.settings.checklist || [];

  const st = { cond: ex?.condition || "Good", checks: { ...(ex?.checks || {}) }, panels: { ...(ex?.panels || {}) }, photos: [...(ex?.photos || [])], newPhotos: {} };

  const signOpts = (m) => M.signs.filter((s) => s.market === m).sort((a, b) => (b.due - a.due) || a.sortCode.localeCompare(b.sortCode)).map((s) => `<option value="${esc(s.id)}" ${s.id === signId ? "selected" : ""}>${esc(s.code)}${s.due ? " · due" : ""}${s.active ? "" : " · " + esc(s.status)}</option>`).join("");

  const mk = signId ? M.signMap.get(signId)?.market : ui.imarket !== "All" ? ui.imarket : M.markets[0];

  modal(`<div class="mf"><h2>${ex ? "Edit inspection" : "Inspect a sign"}</h2><div class="scroll">

    <div class="two"><div class="fld"><label for="if-m">Market</label><select class="input" id="if-m" ${ex ? "disabled" : ""}>${M.markets.map((m) => `<option ${m === mk ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></div>

      <div class="fld"><label for="if-s">Sign</label><select class="input" id="if-s" ${ex ? "disabled" : ""}>${signOpts(mk)}</select></div></div>

    <div class="two"><div class="fld"><label for="if-d">Date</label><input class="input" id="if-d" type="date" value="${esc(ex?.date || TODAY)}"></div>

      <div class="fld"><label for="if-by">Inspected by</label><input class="input" id="if-by" value="${esc(ex?.inspector || ui.inspector || "")}" placeholder="Your name"></div></div>

    <div class="sect"><span class="lbl">Overall condition</span><div class="seg2" id="if-c">${[["Good", "good"], ["Needs repair", "warn"], ["Damaged", "bad"], ["Missing", "bad"]].map(([c, k]) => `<button type="button" class="${k}" data-c="${c}" aria-pressed="${st.cond === c}">${c}</button>`).join("")}</div></div>

    <div class="sect" id="if-chk-w"><span class="lbl">Checklist</span><div class="chk" id="if-chk">${checklist.map((c, i) => `<div class="chk-i"><span>${esc(c)}</span><span class="yn" data-i="${i}"><button type="button" class="y" aria-pressed="${st.checks[c] === true}">Yes</button><button type="button" class="n" aria-pressed="${st.checks[c] === false}">No</button></span></div>`).join("")}</div></div>

    <div class="sect" id="if-pan-w"><span class="lbl">Each panel</span><div class="chk" id="if-pan"></div></div>

    <div class="sect"><span class="lbl">Photos</span><div class="thumbs" id="if-ph">${st.photos.map((p) => `<span class="ph" data-ph="${p}">Loading</span>`).join("")}<label class="photo-add" for="if-file">+ Add<br>photo</label></div><input type="file" id="if-file" accept="image/*" capture="environment" multiple hidden></div>

    <div class="fld"><label for="if-no">Notes</label><textarea class="input" id="if-no" rows="2" placeholder="What did you see?">${esc(ex?.notes || "")}</textarea></div>

    <div class="sect"><div class="checks"><label><input type="checkbox" id="if-rep" ${ex?.repair?.needed ? "checked" : ""}> Needs a repair</label></div>

      <div class="fld" id="if-rw" ${ex?.repair?.needed ? "" : "hidden"}><label for="if-rwhat">What needs fixing</label><input class="input" id="if-rwhat" value="${esc(ex?.repair?.what || "")}" placeholder="e.g. Replace KB Home panel, cracked"></div>

      <div class="checks" id="if-stw"></div></div>

    </div><div class="err" id="if-err"></div>

    <div class="mfoot">${ex ? `<button class="btn danger" type="button" id="if-del" style="margin-right:auto">Delete</button>` : ""}<button class="btn" type="button" data-cancel>Cancel</button><button class="btn pri" type="button" data-ok>Save inspection</button></div></div>`, (r) => {

    const q = (x) => r.querySelector(x);

    const sign = () => M.signMap.get(q("#if-s").value);

    const drawPanels = () => { const s = sign(); const ls = s ? s.cur.filter((l) => !(l.start > TODAY)) : []; q("#if-pan-w").hidden = !ls.length || st.cond === "Missing"; q("#if-pan").innerHTML = ls.map((l) => `<div class="chk-i"><span><b>${esc(cName(l.clientId))}</b>${s.sides.length > 1 ? ` <span style="color:var(--muted)">${esc(l.side)}</span>` : ""}${l.panels > 1 ? ` <span style="color:var(--muted)">×${l.panels}</span>` : ""}</span><span class="yn" data-l="${esc(l.id)}">${["OK", "Damaged", "Missing"].map((v) => `<button type="button" class="${v === "OK" ? "y" : "n"}" data-v="${v}" aria-pressed="${(st.panels[l.id] || "") === v}">${v}</button>`).join("")}</span></div>`).join(""); drawStatus(); };

    const target = () => (st.cond === "Missing" ? "Missing" : st.cond === "Damaged" ? "Down / damaged" : "Active");

    const drawStatus = () => { const s = sign(); if (!s) return; const t = target(); q("#if-stw").innerHTML = t !== s.status ? `<label style="white-space:normal"><input type="checkbox" id="if-upd" checked> ${t === "Active" ? `Sign is standing: set ${esc(s.code)} back to Active` : `Mark sign ${esc(s.code)} as ${t}`} <span style="color:var(--muted)">(now ${esc(s.status)})</span></label>` : ""; q("#if-chk-w").hidden = st.cond === "Missing"; };

    q("#if-m").onchange = () => { q("#if-s").innerHTML = signOpts(q("#if-m").value); st.panels = {}; drawPanels(); };

    q("#if-s").onchange = () => { st.panels = {}; drawPanels(); };

    q("#if-c").onclick = (e) => { const b = e.target.closest("[data-c]"); if (!b) return; st.cond = b.dataset.c; q("#if-c").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); if (st.cond !== "Good" && !q("#if-rep").checked) { q("#if-rep").checked = true; q("#if-rw").hidden = false; } if (st.cond === "Missing") q("#if-pan-w").hidden = true; else drawPanels(); drawStatus(); };

    q("#if-chk").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; const yn = b.parentElement; const c = checklist[+yn.dataset.i]; const v = b.classList.contains("y"); st.checks[c] = st.checks[c] === v ? undefined : v; yn.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", st.checks[c] === x.classList.contains("y"))); };

    q("#if-pan").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; const yn = b.parentElement; const lid = yn.dataset.l; st.panels[lid] = st.panels[lid] === b.dataset.v ? undefined : b.dataset.v; yn.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", st.panels[lid] === x.dataset.v)); if (b.dataset.v !== "OK" && st.panels[lid]) { q("#if-rep").checked = true; q("#if-rw").hidden = false; if (!q("#if-rwhat").value) q("#if-rwhat").value = `${b.dataset.v === "Missing" ? "Replace missing" : "Fix damaged"} ${cName(S.leases.find((l) => l.id === lid)?.clientId)} panel`; } };

    q("#if-rep").onchange = () => (q("#if-rw").hidden = !q("#if-rep").checked);

    q("#if-file").onchange = async (e) => { for (const f of e.target.files) { try { const data = await shrink(f); const pid = uid("ph"); st.newPhotos[pid] = data; st.photos.push(pid); q(".photo-add").insertAdjacentHTML("beforebegin", `<img src="${data}" alt="New photo" data-ph="${pid}">`); } catch (x) { q("#if-err").textContent = x.message; } } e.target.value = ""; };

    fillThumbs(q("#if-ph"), st.photos);

    drawPanels();

    q("[data-ok]").onclick = async () => {

      const s = sign(), err = q("#if-err"); if (!s) return (err.textContent = "Choose the sign you inspected.");

      const date = q("#if-d").value; if (!date) return (err.textContent = "Add the inspection date.");

      let lost = 0; for (const [pid, data] of Object.entries(st.newPhotos)) { try { await putPhoto(pid, data); } catch (x) { st.photos = st.photos.filter((p) => p !== pid); lost++; } }

      snapshot();

      const inspector = q("#if-by").value.trim(); ui.inspector = inspector; saveUi();

      const checks = Object.fromEntries(Object.entries(st.checks).filter(([, v]) => v !== undefined)), panels = Object.fromEntries(Object.entries(st.panels).filter(([, v]) => v));

      const needed = q("#if-rep").checked;

      const repair = needed ? { needed: true, what: q("#if-rwhat").value.trim(), status: ex?.repair?.status && ex.repair.needed ? ex.repair.status : "Open", fixed: ex?.repair?.fixed || "" } : { needed: false };

      const data = { signId: s.id, date, inspector, condition: st.cond, checks, panels, photos: st.photos, notes: q("#if-no").value.trim(), repair };

      if (ex) Object.assign(ex, data); else S.inspections.push({ id: uid("i"), ...data });

      const sig = S.signs.find((x) => x.id === s.id);

      if (q("#if-upd")?.checked) sig.status = target();

      closeModal(); save(`Inspection saved for ${s.code}${needed ? " · repair added" : ""}${lost ? ` · ${lost} photo${lost > 1 ? "s" : ""} couldn't be saved in this browser` : ""}`, true);

    };

    if (ex) twoStep(q("#if-del"), "Delete inspection?", () => { snapshot(); S.inspections = S.inspections.filter((x) => x.id !== ex.id); closeModal(); save("Inspection deleted", true); });

  }, true);

}
