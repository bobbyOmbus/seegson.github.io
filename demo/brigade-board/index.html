<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Brigade Board helps culinary instructors run lab check-ins, rotate brigade roles, scale recipes, and track term participation.">
<meta name="theme-color" content="#121417">
<meta name="color-scheme" content="dark light">
<title>Brigade Board — Culinary Lab Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the pass. Steel-dark kitchen line, heat-lamp amber as the one accent, station assignments printed as tickets hung on a rail. */
:root{
  --bg:#121417; --surface:#1A1E22; --surface-2:#22282D; --line:#2E353B;
  --fg:#E8EBED; --fg-dim:#98A2AB; --fg-faint:#69737C;
  --heat:#F2A93B; --heat-ink:#1E1404; --heat-text:#F5B556; --heat-wash:rgba(242,169,59,.12);
  --ticket:#F6F3EA; --ticket-ink:#1B1A17; --ticket-dim:#6B675D; --ticket-rule:#D9D3C3;
  --steel-hi:#8B949C; --steel-lo:#4A5259;
  --ok:#6CC08B; --ok-wash:rgba(108,192,139,.14); --late:#EB7D5F; --late-wash:rgba(235,125,95,.14);
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#E7EAEC; --surface:#FFFFFF; --surface-2:#F2F4F5; --line:#D2D8DC;
  --fg:#151A1E; --fg-dim:#56626B; --fg-faint:#808B93;
  --heat:#EDA032; --heat-ink:#1E1404; --heat-text:#94590A; --heat-wash:rgba(237,160,50,.16);
  --ticket:#FFFDF6; --ticket-ink:#1B1A17; --ticket-dim:#6B675D; --ticket-rule:#E3DDCD;
  --steel-hi:#B7BFC5; --steel-lo:#7D868D;
  --ok:#23864B; --ok-wash:rgba(35,134,75,.10); --late:#B9472A; --late-wash:rgba(185,71,42,.10);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#E7EAEC; --surface:#FFFFFF; --surface-2:#F2F4F5; --line:#D2D8DC;
  --fg:#151A1E; --fg-dim:#56626B; --fg-faint:#808B93;
  --heat:#EDA032; --heat-ink:#1E1404; --heat-text:#94590A; --heat-wash:rgba(237,160,50,.16);
  --ticket:#FFFDF6; --ticket-ink:#1B1A17; --ticket-dim:#6B675D; --ticket-rule:#E3DDCD;
  --steel-hi:#B7BFC5; --steel-lo:#7D868D;
  --ok:#23864B; --ok-wash:rgba(35,134,75,.10); --late:#B9472A; --late-wash:rgba(185,71,42,.10);
  color-scheme:light;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px}
h1,h2,h3,h4{margin:0;font-family:var(--display);text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--heat);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 64px}
.narrow{max-width:640px;margin-inline:auto}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px}
.mark{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.mark .lamp{width:12px;height:12px;border-radius:50%;background:var(--heat);box-shadow:0 0 0 4px var(--heat-wash),0 0 18px var(--heat)}
.mark b{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.crumb{font-family:var(--mono);font-size:12px;color:var(--fg-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:4px 2px;color:var(--fg-dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.crumb button:hover{color:var(--heat-text)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--fg-faint)}
.btn.heat{background:var(--heat);color:var(--heat-ink);border-color:var(--heat)}
.btn.heat:hover{filter:brightness(1.06)}
.btn.ghost{background:none}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.lg{padding:14px 22px;font-size:16px}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;color:var(--heat-text);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:500}

/* forms */
label.lbl,.lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);margin:0 0 6px}
input[type=text],input[type=number],input[type=time],input[type=search],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:15px}
textarea{resize:vertical;line-height:1.55;min-height:120px}
input:focus,select:focus,textarea:focus{border-color:var(--heat);outline:none}
.hint{font-size:12.5px;color:var(--fg-dim);margin:6px 0 0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--heat)}
.field{display:flex;flex-direction:column;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}

/* cards & sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-h h3{font-size:19px;font-weight:700;font-stretch:88%}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{min-height:1.4em;font-size:13.5px;margin:10px 0 0;color:var(--fg-dim)}
.msg.warn{color:var(--late)} .msg.ok{color:var(--ok)}
.notice{border:1px dashed var(--late);color:var(--fg-dim);border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.5}
.notice b{color:var(--fg)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--fg-dim)}
.empty h4{font-size:20px;color:var(--fg);margin-bottom:6px;font-stretch:85%}

/* home */
.hero{padding-block:34px 30px;display:grid;gap:30px}
.hero h1{font-size:clamp(40px,8.4vw,86px);line-height:.92;font-weight:800;font-stretch:66%;text-transform:uppercase;letter-spacing:-.005em;max-width:13ch}
.hero h1 em{font-style:normal;color:var(--heat-text)}
.hero .lede{font-size:17px;color:var(--fg-dim);max-width:52ch;margin:0}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.doors{grid-template-columns:1fr}}
.door{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--heat);transform:translateY(-2px)}
.door h2{font-size:32px;font-weight:800;font-stretch:70%;text-transform:uppercase}
.door p{margin:0;color:var(--fg-dim);font-size:14.5px}
.door .go{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--heat-text)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);margin-top:6px}
@media (max-width:760px){.facts{grid-template-columns:1fr}}
.fact{padding:16px 16px 4px 0}
.fact b{display:block;font-family:var(--display);font-stretch:85%;font-size:16px;margin-bottom:4px}
.fact span{font-size:13.5px;color:var(--fg-dim)}

/* class list */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.class-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.class-card:hover{border-color:var(--heat)}
.class-card h3{font-size:22px;font-stretch:80%;font-weight:750;line-height:1.1}
.class-card .who{color:var(--fg-dim);font-size:14px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--fg-dim);white-space:nowrap}
.chip.code{color:var(--heat-text);border-color:var(--heat)}
.chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-wash)}
.chip.late{color:var(--late);border-color:var(--late);background:var(--late-wash)}
.new-card{border-style:dashed;align-items:flex-start;justify-content:center;color:var(--fg-dim)}

/* class header + tabs */
.class-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.class-head h1{font-size:clamp(30px,5vw,46px);font-weight:800;font-stretch:70%;text-transform:uppercase;line-height:.95}
.class-head .who{color:var(--fg-dim);margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--fg-dim);font-weight:600;white-space:nowrap;font-size:14.5px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--heat)}

/* today */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:860px){.today-grid{grid-template-columns:1fr}}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.roll{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 18px;max-height:440px;overflow-y:auto}
@media (max-width:480px){.roll{grid-template-columns:1fr}}
.roll li label{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.roll input{width:17px;height:17px;accent-color:var(--heat);flex-shrink:0}
.roll .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roll li.out .nm{color:var(--fg-faint);text-decoration:line-through}
.stamp{font-family:var(--mono);font-size:11.5px;color:var(--ok);font-variant-numeric:tabular-nums;white-space:nowrap}
.stamp.late{color:var(--late)}
.stamp.chef{color:var(--fg-dim)}
.stamp.none{color:var(--fg-faint)}
.inline{display:flex;gap:8px}
.inline select{flex:1;min-width:0}
.setup-sum{font-size:13px;color:var(--fg-dim);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

/* the rail and tickets */
.board{margin-top:26px}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.board-h h2{font-size:28px;font-stretch:70%;font-weight:800;text-transform:uppercase}
.rail{position:relative;padding-top:20px}
.rail::before{content:"";position:absolute;left:-4px;right:-4px;top:0;height:9px;border-radius:5px;background:linear-gradient(var(--steel-hi),var(--steel-lo));box-shadow:0 2px 4px rgba(0,0,0,.25)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px 14px;align-items:start}
.ticket{position:relative;background:var(--ticket);color:var(--ticket-ink);font-family:var(--mono);font-size:13px;padding:16px 14px 20px;box-shadow:0 10px 18px -12px rgba(0,0,0,.55);min-width:0;animation:hang .38s ease-out both}
.ticket:nth-child(odd){transform:rotate(-.5deg)} .ticket:nth-child(3n){transform:rotate(.4deg)}
.ticket::before{content:"";position:absolute;top:-14px;left:50%;width:34px;height:16px;margin-left:-17px;border-radius:2px;background:linear-gradient(var(--steel-hi),var(--steel-lo))}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:7px;background:radial-gradient(circle at 5px 7px,transparent 4.5px,var(--ticket) 5px) 0 0/10px 7px repeat-x}
@keyframes hang{from{transform:translateY(-10px) rotate(-2deg)}}
.t-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px dashed var(--ticket-rule);padding-bottom:8px;margin-bottom:8px;gap:8px}
.t-head b{font-family:var(--display);font-stretch:66%;font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.t-head span{font-size:11px;color:var(--ticket-dim)}
.ticket ul{list-style:none;margin:0;padding:0}
.ticket li{padding:3px 0;overflow-wrap:anywhere}
.ticket.lead{background:var(--ticket)}
.ticket.lead .t-head{border-bottom-style:solid;border-bottom-color:var(--heat)}
.ticket.lead .t-who{font-family:var(--display);font-stretch:80%;font-weight:750;font-size:22px;line-height:1.1}
.ticket.lead .t-note{font-size:11px;color:var(--ticket-dim);margin-top:6px}
.ticket .flag{display:inline-block;background:var(--heat);color:var(--heat-ink);font-size:10px;font-weight:600;padding:1px 6px;border-radius:2px;letter-spacing:.06em}
.tasks{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 18px 10px}
.tasks h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);font-weight:600;margin:14px 0 4px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .what{font-weight:500;min-width:0}
.task .who{font-family:var(--mono);font-size:13px;color:var(--heat-text);white-space:nowrap}
.task .sub{grid-column:1/-1;font-size:12.5px;color:var(--fg-dim)}
.task .sub b{color:var(--fg);font-weight:500}

/* pass display */
.pass{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:22px}
.pass:fullscreen{border:0;border-radius:0;padding:36px;overflow:auto}
.pass-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.pass-top h2{font-size:clamp(28px,4.6vw,54px);font-stretch:66%;font-weight:800;text-transform:uppercase;line-height:.95}
.clock{font-family:var(--mono);font-size:clamp(24px,3.6vw,42px);font-variant-numeric:tabular-nums;color:var(--heat-text);line-height:1}
.callout{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:640px){.callout{grid-template-columns:1fr}}
.bigcode{font-family:var(--mono);font-weight:600;font-size:clamp(44px,9vw,104px);letter-spacing:.12em;color:var(--heat-text);line-height:1;padding:18px 26px;border:2px solid var(--heat);border-radius:10px;background:var(--heat-wash);text-align:center}
.callout p{margin:0;font-size:clamp(17px,2vw,22px);color:var(--fg-dim)}
.callout p b{color:var(--fg)}
.in-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.in-chips span{font-family:var(--mono);font-size:14px;padding:6px 12px;border-radius:999px;background:var(--ok-wash);color:var(--ok);border:1px solid var(--ok)}
.pass.big .tickets{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pass.big .ticket{font-size:16px}
.pass.big .t-head b{font-size:34px}

/* student */
.code-input{font-family:var(--mono);font-size:30px !important;letter-spacing:.16em;text-transform:uppercase;text-align:center;padding:14px !important}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.name{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;font-weight:500;text-align:left;min-width:0}
.name:hover:not(:disabled){border-color:var(--heat)}
.name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{font-family:var(--mono);font-size:11px;color:var(--ok)}
.name:disabled{cursor:default;background:var(--ok-wash);border-color:var(--ok);color:var(--fg-dim)}
.stub{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--ticket);color:var(--ticket-ink);padding:22px 18px 26px;position:relative;margin-top:8px}
.stub::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:7px;background:radial-gradient(circle at 5px 7px,transparent 4.5px,var(--ticket) 5px) 0 0/10px 7px repeat-x}
.stub .who{font-family:var(--display);font-stretch:70%;font-weight:800;font-size:38px;text-transform:uppercase;line-height:1}
.stub .when{font-family:var(--mono);font-size:14px;color:var(--ticket-dim)}
.stub .verdict{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:2px}
.stub .verdict.on{background:#2E7D4F;color:#fff} .stub .verdict.late{background:#B9472A;color:#fff}
.assign{margin-top:22px}
.assign-big{font-family:var(--display);font-stretch:66%;font-weight:800;font-size:clamp(46px,14vw,80px);text-transform:uppercase;line-height:.9;color:var(--heat-text)}

/* reports */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--fg-dim)}
.tablewrap{overflow-x:auto}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.rep th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim);font-weight:600}
table.rep td.n{font-variant-numeric:tabular-nums;text-align:right}
table.rep th.n{text-align:right}
.bar{display:flex;align-items:center;gap:8px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--ok);min-width:2px}
.bar i.low{background:var(--late)}
.bar em{font-style:normal;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;width:3.2em;text-align:right}

/* recipes */
.recipe-list{display:flex;flex-direction:column;gap:0}
.recipe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.recipe:first-child{border-top:0}
.recipe h4{font-size:18px;font-stretch:85%;font-weight:700}
.recipe p{margin:2px 0 0;font-size:13px;color:var(--fg-dim);font-family:var(--mono);overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.demo-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--fg-dim);background:var(--heat-wash);border:1px solid var(--heat);border-radius:8px;padding:8px 12px;margin:-12px 0 22px}
.demo-bar b{color:var(--heat-text);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* Market polish: stronger hierarchy, focus states, responsive tools, and theme control. */
:root{--radius-lg:16px;--shadow-card:0 16px 40px rgba(0,0,0,.12)}
body{background:radial-gradient(ellipse at 12% 0%,rgba(242,169,59,.055),transparent 38%),var(--bg);transition:background .2s,color .2s}
.wrap{max-width:1180px;padding-top:22px}
.topbar{position:relative;gap:16px;margin-bottom:24px}
.mark{min-height:42px}
.mark .lamp{flex:0 0 12px}
.mark b{letter-spacing:.055em}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:8px 12px;min-height:38px;cursor:pointer;font-size:13px;font-weight:600}
.icon-btn:hover{border-color:var(--heat)}
.hero{padding-block:40px 32px;gap:26px}
.hero h1{max-width:12ch;font-size:clamp(44px,8vw,92px);letter-spacing:-.035em}
.hero .lede{font-size:clamp(16px,2vw,19px);line-height:1.65;max-width:62ch}
.doors{gap:18px}
.door{min-height:230px;padding:26px;background:linear-gradient(145deg,var(--surface),var(--surface-2));border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.door h2{letter-spacing:-.025em}
.door .go{font-weight:600}
.facts{margin-top:8px}
.fact{padding:20px 18px 8px 0}
.fact b{font-size:17px}
.card,.tile,.class-card,.pass{border-radius:var(--radius-lg)}
.card{box-shadow:0 8px 28px rgba(0,0,0,.055)}
.btn,.tab,.class-card,.name,.door,.icon-btn{transition:all .16s ease}
.btn{border-radius:8px}
.btn.heat{box-shadow:0 5px 15px rgba(242,169,59,.12)}
.class-head{margin-bottom:22px}
.class-head h1{letter-spacing:-.025em}
.class-grid{gap:16px}
.class-card{padding:22px;min-height:158px;box-shadow:0 8px 22px rgba(0,0,0,.05)}
.class-card h3{letter-spacing:-.02em}
.class-card .who{line-height:1.5}
.class-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.class-tools input{max-width:420px}
.class-tools .hint{margin:0}
.dash-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 18px}
.dash-stat{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:15px 17px}
.dash-stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.dash-stat span{display:block;color:var(--fg-dim);font-size:12px;margin-top:5px}
.tabs{gap:8px;border-bottom-color:var(--line)}
.tab{border-radius:8px 8px 0 0;padding-inline:15px}
.tab[aria-selected="true"]{background:var(--heat-wash)}
.ticket{border-radius:3px}
.ticket .t-head b{letter-spacing:-.02em}
.pass{box-shadow:var(--shadow-card)}
.toast{border:1px solid var(--line)}
.demo-bar{border-radius:10px;padding:10px 14px}
.demo-bar span{flex:1;min-width:180px}
input,select,textarea{transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--heat-wash)}
.empty{background:color-mix(in srgb,var(--surface) 65%,transparent)}
@media(max-width:640px){body{padding-inline:12px}.wrap{padding-top:12px}.topbar{margin-bottom:16px}.top-actions .icon-btn .action-label{display:none}.hero{padding-top:28px}.door{min-height:190px;padding:21px}.dash-summary{grid-template-columns:1fr 1fr}.dash-stat:last-child{grid-column:1/-1}.class-tools input{max-width:none}.card{padding:16px}.pass{padding:14px}}
@media(prefers-reduced-motion:reduce){body,*{transition:none!important}}
@media print{body{background:#fff!important;color:#111!important;padding:0}.topbar,.crumb,.demo-bar,.tabs,.btn,.icon-btn{display:none!important}.wrap{max-width:none;padding:0}.pass,.ticket{box-shadow:none!important;break-inside:avoid}.ticket{border:1px solid #bbb}.pass{border:0}}

<div class="wrap" id="app">

<script>
/* ==================================================================
   Brigade Board — standalone backend.
   Two modes:
   1. DEMO (default): a local database kept in this browser. Changes
      sync live between tabs on the same browser, so you can open the
      student view in one tab and the instructor view in another.
   2. LIVE: paste a Firebase project config below and every phone and
      laptop shares one Firestore database in real time.
   ================================================================== */
const FIREBASE_CONFIG = null;
/* Example:
const FIREBASE_CONFIG = {
  apiKey: "…", authDomain: "your-app.firebaseapp.com", projectId: "your-app",
  storageBucket: "your-app.appspot.com", messagingSenderId: "…", appId: "…"
};
*/

window.BB_BACKEND = (function () {
  const downloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: 'text/csv' }));
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  };

  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }

  async function firebaseDb() {
    const v = '10.12.2';
    await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);
    return firebase.firestore();
  }

  /* ---------- local database (Firestore-shaped subset) ---------- */
  const KEY = 'bb-demo-db-v1';
  function read() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  let mem = read();
  const listeners = new Set();
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} notify(); }
  function notify() { setTimeout(() => listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }), 0); }
  window.addEventListener('storage', e => { if (e.key === KEY) { mem = read() || {}; notify(); } });

  const clone = o => JSON.parse(JSON.stringify(o));
  const docSnap = (path) => { const d = mem[path]; return { id: path.split('/').pop(), exists: !!d, data: () => d ? clone(d) : undefined }; };
  const OPS = { '==': (a, b) => a === b, '!=': (a, b) => a !== b, '<': (a, b) => a < b, '<=': (a, b) => a <= b, '>': (a, b) => a > b, '>=': (a, b) => a >= b };

  function docRef(path) {
    return {
      id: path.split('/').pop(),
      async get() { return docSnap(path); },
      async set(data) { mem[path] = clone(data); persist(); },
      async update(data) { if (!mem[path]) throw { code: 'not_found', message: 'Document does not exist' }; mem[path] = { ...mem[path], ...clone(data) }; persist(); },
      async delete() { delete mem[path]; persist(); },
      onSnapshot(cb) { const fn = () => cb(docSnap(path)); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); }
    };
  }
  function query(path, filters = [], order = null, lim = null) {
    const run = () => {
      const pre = path + '/';
      let docs = Object.keys(mem).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes('/'))
        .map(k => ({ id: k.slice(pre.length), d: mem[k] }));
      filters.forEach(([f, op, v]) => { docs = docs.filter(x => (OPS[op] || OPS['=='])(x.d[f], v)); });
      if (order) docs.sort((a, b) => (a.d[order.f] > b.d[order.f] ? 1 : a.d[order.f] < b.d[order.f] ? -1 : 0) * (order.dir === 'desc' ? -1 : 1));
      else docs.sort((a, b) => a.id.localeCompare(b.id));
      if (lim) docs = docs.slice(0, lim);
      const out = docs.map(x => ({ id: x.id, exists: true, data: () => clone(x.d) }));
      return { docs: out, size: out.length, empty: !out.length };
    };
    return {
      where(f, op, v) { return query(path, filters.concat([[f, op, v]]), order, lim); },
      orderBy(f, dir) { return query(path, filters, { f, dir }, lim); },
      limit(n) { return query(path, filters, order, n); },
      doc(id) { return docRef(path + '/' + id); },
      async get() { return run(); },
      onSnapshot(cb) { const fn = () => cb(run()); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); }
    };
  }
  const localDb = { collection: p => query(p), doc: p => docRef(p) };

  /* ---------- demo seed ---------- */
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function seed() {
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const pick = a => a[Math.floor(rnd() * a.length)];
    const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const db = {};
    const classes = {
      carlos: { name: 'Advanced Cajun & Creole', instructor: 'Chef Carlos Reyes', code: 'CARLOS', startTime: '08:00', stations: 6,
        roster: ['Eduardo','Niki','Emma','Day','Rodrigo','Jacob','Nakeyia','Hipolito','Bobby','Halle','Robert','Jean','Adriana','Hong','Nathen','Alicia','Kayla','Larry','Jesse','Rosslyn','Genesis','Victor','Catherine','Tori'],
        equipment: ['Cutting boards','Pots & pans','Soapy water buckets'], cleaning: ['Dish pit','Floor & trash','Sanitizing buckets','Walk-in & dry storage'] },
      okafor: { name: 'Garde Manger & Charcuterie', instructor: 'Chef Marcus Okafor', code: 'OKAFOR', startTime: '12:30', stations: 5,
        roster: ['Femi','Callie','Trent','Bianca','Soren','Rashida','Milo','Anya','Dev','Quinn','Estelle','Malik','Joaquin','Petra','Gideon'],
        equipment: ['Cutting boards','Knife kits','Sanitizing buckets'], cleaning: ['Dish pit','Cooler & cure room check','Floor & trash'] },
      renata: { name: 'Pastry Fundamentals', instructor: 'Chef Renata Diaz', code: 'RENATA', startTime: '07:30', stations: 4,
        roster: ['Marisol','Owen','Priya','Deshawn','Ingrid','Talia','Mateo','Brynn','Youssef','Naomi','Colton','Hana','Dario','Skyler'],
        equipment: ['Sheet pans','Mixing bowls','Bench scrapers','Soapy water buckets'], cleaning: ['Dish pit','Floor & trash','Proof box & oven wipe-down'] }
    };
    const recipes = {
      carlos: [
        ['Chicken & andouille gumbo', ['1/2 cup all-purpose flour','1/2 cup vegetable oil','1 cup diced onion','1/2 cup diced celery','1/2 cup diced bell pepper','2 tsp minced garlic','1 lb chicken thighs','1/2 lb andouille','2 qt chicken stock','2 bay leaves','1 tsp Creole seasoning','1/4 cup sliced green onion']],
        ['Shrimp étouffée', ['1 stick butter','1/3 cup all-purpose flour','1 cup diced onion','1/2 cup diced celery','1/2 cup diced bell pepper','1 tbsp minced garlic','1 lb peeled shrimp','2 cups shrimp stock','1 tbsp lemon juice','2 cups cooked rice']],
        ['Red beans & rice', ['1 lb dried red beans','1 cup diced onion','1/2 cup diced celery','1/2 cup diced bell pepper','1/2 lb smoked sausage','2 qt water','1 tsp thyme','2 cups cooked rice']]
      ],
      okafor: [['Country pâté', ['2 lb pork shoulder','1/2 lb pork fatback','1/4 lb chicken livers','1/2 cup diced shallot','2 tsp minced garlic','2 tbsp brandy','2 eggs','1/2 cup heavy cream','1 tbsp kosher salt','1 tsp pâté spice']]],
      renata: [['Pâte brisée', ['2 1/2 cups all-purpose flour','1 tsp salt','1 tsp sugar','2 sticks cold butter','1/2 cup ice water']], ['Crème pâtissière', ['2 cups whole milk','1/2 cup sugar','4 egg yolks','3 tbsp cornstarch','2 tbsp butter','1 tsp vanilla']]]
    };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    Object.entries(classes).forEach(([id, c]) => {
      db['classes/' + id] = c;
      (recipes[id] || []).forEach(([name, ingredients], i) => { db[`classes/${id}/recipes/r${i}`] = { name, ingredients, updatedAt: Date.now() }; });
      /* ten past lab days of history */
      const days = []; const d = new Date(today);
      while (days.length < 10) { d.setDate(d.getDate() - 1); if (d.getDay() !== 0 && d.getDay() !== 6) days.unshift(new Date(d)); }
      const [h, m] = c.startTime.split(':').map(Number);
      days.forEach((day, di) => {
        const date = iso(day);
        const present = c.roster.filter(() => rnd() < 0.88);
        present.forEach(name => {
          const late = rnd() < 0.12; const t = new Date(day); t.setHours(h, m + (late ? 7 + Math.floor(rnd() * 15) : -Math.floor(rnd() * 12)), 0, 0);
          db[`classes/${id}/checkins/${date}_${name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`] = { date, name, checkedInAt: t.getTime(), late, via: 'student' };
        });
        const order = shuffle(present); const sous = order[0], expo = order[1]; const line = order.slice(2);
        const teams = Array.from({ length: c.stations }, () => []); line.forEach((n, i) => teams[i % c.stations].push(n));
        const rec = (recipes[id] || [])[di % ((recipes[id] || []).length || 1)];
        let li = 0; const who = () => line[(li++) % line.length];
        const labor = [];
        (rec ? rec[1] : []).forEach(ing => labor.push({ who: who(), category: 'ingredient', label: ing, detail: '' }));
        c.equipment.forEach(e => labor.push({ who: who(), category: 'equipment', label: e, detail: 'One set to every station' }));
        c.cleaning.forEach(e => labor.push({ who: who(), category: 'cleaning', label: e, detail: 'For the whole kitchen' }));
        const called = new Date(day); called.setHours(h, m + 12);
        db[`classes/${id}/sessions/${date}`] = { date, calledAt: called.getTime(), present, stationCount: c.stations, stationTeams: teams, leadership: { sousChef: sous, expediter: expo }, laborAssignments: labor, ingredientLines: rec ? rec[1] : [], recipeName: rec ? rec[0] : '' };
      });
      /* a few students already checked in today so roll call looks alive */
      const date = iso(today);
      shuffle(c.roster).slice(0, Math.round(c.roster.length * 0.4)).forEach((name, i) => {
        const t = new Date(today); t.setHours(h, m - 14 + i, 0, 0);
        db[`classes/${id}/checkins/${date}_${name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`] = { date, name, checkedInAt: t.getTime(), late: false, via: 'student' };
      });
    });
    return db;
  }

  function resetDemo() { mem = seed(); persist(); }
  if (!FIREBASE_CONFIG && !mem) { mem = seed(); try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
  if (!mem) mem = {};

  return {
    mode: FIREBASE_CONFIG ? 'live' : 'demo',
    downloads,
    resetDemo,
    async getDb() {
      if (FIREBASE_CONFIG) { try { return await firebaseDb(); } catch (e) { console.error('Firebase failed to load', e); return null; } }
      return localDb;
    }
  };
})();
</script>

<script>
/* ==================================================================
   Brigade Board — check-in, brigade assignment and term records for
   culinary lab classes. Shared state lives in the artifact `db`:
     classes/{id}                     class setup + roster
     classes/{id}/checkins/{date_slug} one per student per day
     classes/{id}/sessions/{date}     the brigade called that day
     classes/{id}/recipes/{rid}       saved recipe ingredient lists
   ================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const root = $('#root');
const crumb = $('#crumb');

let db = null, downloads = null, dbResolved = false;
const pad2 = n => String(n).padStart(2, '0');
function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
const TODAY = isoDate(new Date());
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '') || 'x';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
function fmtTime(ms) { return ms ? new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''; }
function fmtDate(iso, opts) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString([], opts || { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtStart(hhmm) { if (!hhmm) return ''; const [h, m] = hhmm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return fmtTime(d.getTime()); }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
function lines(text) { return String(text || '').split('\n').map(s => s.trim()).filter(Boolean); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* subscriptions scoped to the current screen */
let subs = [];
function hold(u) { if (u) subs.push(u); return u; }
function releaseAll() { subs.forEach(u => { try { u(); } catch (e) {} }); subs = []; }

/* ---------------- app state ---------------- */
const S = {
  view: 'home',          // home | student | classes | class
  classes: [], classesLoaded: false,
  stuClassId: null,
  classId: null, tab: 'today'
};
let K = null; // live context for the open class (instructor)

/* ---------------- ingredient engine ---------------- */
const UNIT_MAP = { cup:'cup',cups:'cup',c:'cup',tbsp:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',tbs:'tbsp',tbls:'tbsp',tlbs:'tbsp',tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',stick:'stick',sticks:'stick',quart:'qt',quarts:'qt',qt:'qt',pint:'pt',pints:'pt',pt:'pt',gallon:'gal',gallons:'gal',gal:'gal',g:'g',gram:'g',grams:'g',kg:'kg',kilogram:'kg',kilograms:'kg',ml:'ml',milliliter:'ml',milliliters:'ml',l:'l',liter:'l',liters:'l',bunch:'bunch',bunches:'bunch',clove:'clove',cloves:'clove',can:'can',cans:'can',each:'',ea:'' };
const UNICODE_FRACTIONS = { '¼':' 1/4','½':' 1/2','¾':' 3/4','⅓':' 1/3','⅔':' 2/3','⅛':' 1/8','⅜':' 3/8','⅝':' 5/8','⅞':' 7/8' };
const WHOLE = [
  { k:['onion'], whole:'onion', per:{ cup:1, lb:0.5 } },
  { k:['garlic'], whole:'clove', per:{ tsp:1, tbsp:1/3, cup:1/48 } },
  { k:['parsley','cilantro'], whole:'bunch', per:{ cup:1 } },
  { k:['lemon'], whole:'lemon', per:{ tbsp:3, cup:0.25 } },
  { k:['lime'], whole:'lime', per:{ tbsp:2, cup:0.125 } },
  { k:['carrot'], whole:'carrot', per:{ cup:0.67, lb:0.17 } },
  { k:['celery'], whole:'stalk', per:{ cup:0.5 } },
  { k:['potato'], whole:'potato', per:{ cup:1, lb:0.33 } },
  { k:['bell pepper','pepper'], whole:'pepper', per:{ cup:1 } },
  { k:['tomato'], whole:'tomato', per:{ cup:1, lb:0.33 } },
  { k:['butter'], whole:'stick', per:{ cup:0.5, tbsp:8 } },
  { k:['apple'], whole:'apple', per:{ cup:1 } },
  { k:['shallot'], whole:'shallot', per:{ cup:2, lb:1.5 } },
  { k:['egg'], whole:'egg', per:{ cup:0.25 } },

function pluralize(w) { return /(o|ch|sh|ss|x)$/.test(w) ? w + 'es' : (/[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'); }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function formatQty(v) {
  if (v <= 0) return '0';
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  const whole = Math.floor(v), den0 = 24; let num = Math.round((v - whole) * den0);
  if (num === 0) return String(whole); if (num === den0) return String(whole + 1);
  const g = gcd(num, den0); return (whole ? whole + ' ' : '') + (num / g) + '/' + (den0 / g);

function parseLine(raw) {
  const line = raw.replace(/[¼½¾⅓⅔⅛⅜⅝⅞]/g, ch => UNICODE_FRACTIONS[ch]).replace(/^\s+/, '').replace(/(\d)\s+(?=\d+\/)/, '$1 ');
  const m = line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.\d+|\d+)/);
  if (!m) return { amount: null, unit: null, name: raw.trim() };
  const a = m[1]; let amount;
  if (a.includes(' ')) { const [w, f] = a.split(/\s+/); const [n, d] = f.split('/').map(Number); amount = Number(w) + n / d; }
  else if (a.includes('/')) { const [n, d] = a.split('/').map(Number); amount = n / d; }
  else amount = parseFloat(a);
  let rest = line.slice(m[0].length).trim();
  const words = rest.split(/\s+/); const firstRaw = (words[0] || '').replace(/[^a-zA-Z]/g, ''); const key = firstRaw.toLowerCase();
  let unit = null;
  if (firstRaw === 'T') { unit = 'tbsp'; rest = words.slice(1).join(' '); }
  else if (firstRaw === 't') { unit = 'tsp'; rest = words.slice(1).join(' '); }
  else if (key in UNIT_MAP) { unit = UNIT_MAP[key] || null; rest = words.slice(1).join(' '); }
  rest = rest.replace(/^of\s+/i, '').trim();
  return { amount, unit, name: rest || raw.trim() };
}
const PLURAL_UNIT = { cup:'cups', stick:'sticks', bunch:'bunches', clove:'cloves', can:'cans' };
function unitLabel(amtStr, unit) { if (!unit) return amtStr; const n = parseFloat(amtStr) + (/\//.test(amtStr) && / /.test(amtStr) ? 1 : 0); return amtStr + ' ' + ((n > 1 && PLURAL_UNIT[unit]) ? PLURAL_UNIT[unit] : unit); }
function totalLabel(it, n) { return it.amount == null ? it.name : unitLabel(formatQty(it.amount * n), it.unit) + ' ' + it.name; }
function perLabel(it) { return it.amount == null ? '' : unitLabel(formatQty(it.amount), it.unit); }
function wholeNote(it, n) {
  if (it.amount == null || !it.unit) return '';
  const lower = it.name.toLowerCase(); const m = WHOLE.find(c => c.k.some(k => lower.includes(k)));
  if (!m || !(it.unit in m.per)) return '';
  const raw = it.amount / m.per[it.unit]; if (!(raw >= 0.5)) return '';
  const each = Math.ceil(raw - 1e-9); if (!Number.isFinite(each) || each <= 0) return '';
  const total = each * n;
  return `about ${each} whole ${each === 1 ? m.whole : pluralize(m.whole)} per station, ${total} ${total === 1 ? m.whole : pluralize(m.whole)} total`;
}

/* ---------------- fairness ---------------- */
function historyCounts(roster, sessions) {
  const c = {}; roster.forEach(n => c[n] = { sous: 0, expo: 0, labor: 0, days: 0, stations: {} });
  sessions.forEach(s => {
    const L = s.leadership || {};
    if (L.sousChef && c[L.sousChef]) c[L.sousChef].sous++;
    if (L.expediter && c[L.expediter]) c[L.expediter].expo++;
    (s.laborAssignments || []).forEach(t => { if (c[t.who]) c[t.who].labor++; });
    (s.present || []).forEach(n => { if (c[n]) c[n].days++; });
    (s.stationTeams || []).forEach((team, i) => team.forEach(n => { if (c[n]) c[n].stations[i] = (c[n].stations[i] || 0) + 1; }));
  });
  return c;
}
function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
function pairCounts(sessions) {
  const p = {}; sessions.forEach(s => (s.stationTeams || []).forEach(t => { for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) { const k = pairKey(t[i], t[j]); p[k] = (p[k] || 0) + 1; } })); return p;
}
function fairPicker(people, seed) {
  const load = new Map(people.map(p => [p, seed(p)]));
  return { load, pick() { const min = Math.min(...load.values()); const c = shuffle(people.filter(p => load.get(p) === min)); const x = c[0]; load.set(x, load.get(x) + 1); return x; } };
}
function buildTeams(people, n, pairs, counts) {
  const teams = Array.from({ length: n }, () => []);
  const cap = Math.ceil(people.length / n);
  for (const p of shuffle(people)) {
    let best = 0, bestScore = Infinity;
    teams.forEach((t, i) => {
      if (t.length >= cap) return;
      const repeat = t.reduce((s, q) => s + (pairs[pairKey(p, q)] || 0), 0);
      const sameStation = (counts[p] && counts[p].stations[i]) || 0;
      const score = t.length * 1000 + repeat * 10 + sameStation * 3 + Math.random();
      if (score < bestScore) { bestScore = score; best = i; }
    });
    teams[best].push(p);
  }
  return teams;
}

function callBrigade() {
  const msg = $('#todayMsg'); msg.className = 'msg'; msg.textContent = '';
  if (!db) { msg.className = 'msg warn'; msg.textContent = 'Calling the brigade needs the published page.'; return; }
  const roster = K.data.roster || [];
  const present = effectivePresent();
  if (!present.length) { msg.className = 'msg warn'; msg.textContent = 'Mark at least one student present first.'; return; }
  let stations = Math.max(1, Math.min(20, parseInt($('#stnIn').value, 10) || K.data.stations || 6));
  const counts = historyCounts(roster, K.sessions);
  const pairs = pairCounts(K.sessions);

  let sous = null, expo = null;
  if ($('#useSous').checked && present.length > 1) sous = fairPicker(present, n => counts[n] ? counts[n].sous : 0).pick();
  if ($('#useExpo').checked && present.length > 2) { const pool = present.filter(n => n !== sous); expo = fairPicker(pool, n => counts[n] ? counts[n].expo : 0).pick(); }
  let line = present.filter(n => n !== sous && n !== expo);
  let note = '';
  if (line.length < stations) { note = `Only ${line.length} cooks on the line, so ${line.length} ${line.length === 1 ? 'station' : 'stations'} today.`; stations = Math.max(1, line.length); }
  const teams = buildTeams(line, stations, pairs, counts);

  const laborPool = line.length ? line : present;
  const picker = fairPicker(laborPool, n => counts[n] ? counts[n].labor : 0);
  const ingLines = lines($('#ingIn').value);
  const labor = [];
  shuffle(ingLines.map(parseLine)).forEach(it => labor.push({ who: picker.pick(), category: 'ingredient', label: totalLabel(it, stations), detail: [perLabel(it) ? perLabel(it) + ' per station' : '', wholeNote(it, stations)].filter(Boolean).join(' · ') }));
  shuffle(K.data.equipment || []).forEach(e => labor.push({ who: picker.pick(), category: 'equipment', label: e, detail: 'One set to every station' }));
  shuffle(K.data.cleaning || []).forEach(e => labor.push({ who: picker.pick(), category: 'cleaning', label: e, detail: 'For the whole kitchen' }));

  const session = {
    date: TODAY, calledAt: Date.now(), present, stationCount: stations, stationTeams: teams,
    leadership: { sousChef: sous, expediter: expo }, laborAssignments: labor,
    ingredientLines: ingLines, recipeName: K.pickedRecipe || (K.today && K.today.recipeName) || ''
  };
  const btn = $('#callBtn'); btn.disabled = true;
  db.doc(`classes/${K.id}/sessions/${TODAY}`).set(session)
    .then(() => { msg.className = 'msg ok'; msg.textContent = (note ? note + ' ' : '') + 'Brigade called. Students see their assignments now.'; $('#board').scrollIntoView({ behavior: 'smooth', block: 'start' }); })
    .catch(() => { msg.className = 'msg warn'; msg.textContent = "Couldn't save the brigade. Check your connection and try again."; })
    .finally(() => { btn.disabled = false; });
}
function paintTodayBoard() {
  const b = $('#board'); if (!b) return;
  const cb = $('#callBtn'); if (cb) cb.textContent = K.today ? 'Reshuffle the brigade' : 'Call the brigade';
  const cl = $('#clearBtn'); if (cl) cl.hidden = !K.today;
  b.innerHTML = K.today ? boardHTML(K.today, false) : `<div class="empty"><h4>No brigade on the rail yet</h4><p style="margin:0">Take roll, load today's recipe, then call the brigade. Tickets for each station, the sous chef and the expediter hang here.</p></div>`;
}
function boardHTML(s, big) {
  const L = s.leadership || {}; const counts = historyCounts(K.data.roster || [], K.sessions);
  const leadTicket = (role, name, key) => name ? `<article class="ticket lead"><div class="t-head"><b>${role}</b><span class="flag">LEAD</span></div><div class="t-who">${esc(name)}</div><div class="t-note">${ordinal((counts[name] ? counts[name][key] : 0) + 1)} time this term</div></article>` : '';
  const stationTickets = (s.stationTeams || []).map((t, i) => `<article class="ticket"><div class="t-head"><b>Stn ${i + 1}</b><span>${t.length} ${t.length === 1 ? 'cook' : 'cooks'}</span></div><ul>${t.map(n => `<li>${esc(n)}</li>`).join('')}</ul></article>`).join('');
  const groups = [['ingredient', 'Gather'], ['equipment', 'Set up'], ['cleaning', 'Clean']];
  const tasks = groups.map(([k, label]) => {
    const rows = (s.laborAssignments || []).filter(t => t.category === k); if (!rows.length) return '';
    return `<h4>${label}</h4>` + rows.map(t => `<div class="task"><span class="what">${esc(t.label)}</span><span class="who">${esc(t.who)}</span>${t.detail ? `<span class="sub">${esc(t.detail)}</span>` : ''}</div>`).join('');
  }).join('');
  return `
    <div class="board-h"><h2>${big ? 'The brigade' : 'On the rail'}${s.recipeName ? ' · ' + esc(s.recipeName) : ''}</h2><span class="eyebrow">Called ${esc(fmtTime(s.calledAt))} · ${(s.present || []).length} cooks · ${s.stationCount || (s.stationTeams || []).length} stations</span></div>
    <div class="rail"><div class="tickets">${leadTicket('Sous', L.sousChef, 'sous')}${leadTicket('Expo', L.expediter, 'expo')}${stationTickets}</div></div>
    ${tasks ? `<div class="tasks">${tasks}</div>` : ''}`;
}
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function renderReports() {
  const tb = $('#tabBody');
  tb.innerHTML = `

      <div class="tablewrap" id="repTable"></div>
      <p class="hint">Days count class days where you called the brigade. Late counts use student check-in times against your class start time plus a 5-minute grace.</p>
    </section>
    <section class="card" style="margin-top:16px"><div class="card-h"><h3>Lab days</h3></div><div class="tablewrap" id="repDays"></div></section>`;
  K.allCheckins = null; paintReport();
  if (db) db.collection(`classes/${K.id}/checkins`).get().then(s => { if (!K) return; K.allCheckins = s.docs.map(x => x.data() || {}); paintReport(); }).catch(() => { K.allCheckins = []; paintReport(); });
  $('#csvBtn').addEventListener('click', exportCSV);
  $('#wipeBtn').addEventListener('click', confirmStep($('#wipeBtn'), 'Tap again to erase all lab days', async () => {
    try { const s = await db.collection(`classes/${K.id}/sessions`).get(); for (const d of s.docs) await db.doc(`classes/${K.id}/sessions/${d.id}`).delete(); toast('Term history cleared'); }
    catch (e) { toast("Couldn't clear history. Try again."); }
  }));
}
function reportRows() {
  const roster = K.data.roster || []; const sessions = K.sessions.concat(K.today ? [K.today] : []);
  const counts = historyCounts(roster, sessions); const days = sessions.length;
  const lateMap = {}; (K.allCheckins || []).forEach(c => { if (c.late && c.name) lateMap[c.name] = (lateMap[c.name] || 0) + 1; });
  return { days, rows: roster.map(n => { const c = counts[n]; return { name: n, present: c.days, late: lateMap[n] || 0, pct: days ? Math.round(c.days / days * 100) : null, sous: c.sous, expo: c.expo, jobs: c.labor }; }) };
}
function paintReport() {
  const t = $('#repTable'); if (!t) return;
  const { days, rows } = reportRows();
  const avg = rows.length && days ? Math.round(rows.reduce((s, r) => s + r.pct, 0) / rows.length) : 0;
  const lateTotal = rows.reduce((s, r) => s + r.late, 0);
  $('#repTiles').innerHTML = `<div class="tile"><b>${days}</b><span>lab days logged</span></div><div class="tile"><b>${days ? avg + '%' : '—'}</b><span>average attendance</span></div><div class="tile"><b>${K.allCheckins ? lateTotal : '…'}</b><span>late check-ins</span></div><div class="tile"><b>${rows.filter(r => r.pct != null && r.pct < 80).length}</b><span>students under 80%</span></div>`;
  if (!rows.length) { t.innerHTML = '<p class="hint">Add students in class setup to start a term record.</p>'; }
  else t.innerHTML = `<table class="rep"><thead><tr><th>Student</th><th>Attendance</th><th class="n">Days</th><th class="n">Late</th><th class="n">Sous</th><th class="n">Expo</th><th class="n">Jobs</th></tr></thead><tbody>${rows.slice().sort((a, b) => a.name.localeCompare(b.name)).map(r => `
    <tr><td>${esc(r.name)}</td><td>${r.pct == null ? '<span class="hint">—</span>' : `<span class="bar"><i class="${r.pct < 80 ? 'low' : ''}" style="width:${Math.max(2, r.pct * 0.9)}px"></i><em>${r.pct}%</em></span>`}</td><td class="n">${r.present}</td><td class="n">${K.allCheckins ? r.late : '…'}</td><td class="n">${r.sous}</td><td class="n">${r.expo}</td><td class="n">${r.jobs}</td></tr>`).join('')}</tbody></table>`;
  const all = (K.today ? [K.today] : []).concat(K.sessions);
  $('#repDays').innerHTML = all.length ? `<table class="rep"><thead><tr><th>Date</th><th>Recipe</th><th class="n">Cooks</th><th>Sous chef</th><th>Expediter</th></tr></thead><tbody>${all.map(s => `<tr><td>${esc(fmtDate(s.date))}</td><td>${esc(s.recipeName || '—')}</td><td class="n">${(s.present || []).length}</td><td>${esc((s.leadership || {}).sousChef || '—')}</td><td>${esc((s.leadership || {}).expediter || '—')}</td></tr>`).join('')}</tbody></table>` : '<p class="hint">Lab days appear here each time you call the brigade.</p>';
}
async function exportCSV() {
  const { days, rows } = reportRows();
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const out = [['Student', 'Days present', `Lab days (${days})`, 'Attendance %', 'Late check-ins', 'Sous chef', 'Expediter', 'Jobs'].map(q).join(',')]
    .concat(rows.map(r => [r.name, r.present, days, r.pct == null ? '' : r.pct, r.late, r.sous, r.expo, r.jobs].map(q).join(','))).join('\n');
  try { await downloads.save({ filename: `${slug(K.data.name)}-term-report-${TODAY}.csv`, data: out }); }
  catch (e) { if (e && e.code !== 'declined') toast("Couldn't export the file here."); }
}

      <div class="fields">
        <div class="field"><label class="lbl" for="sCode">Student code</label><input type="text" id="sCode" value="${esc(d.code || '')}" maxlength="10" placeholder="CAJUN2" style="font-family:var(--mono);text-transform:uppercase"></div>
        <div class="field"><label class="lbl" for="sStart">Class starts</label><input type="time" id="sStart" value="${esc(d.startTime || '')}"></div>
        <div class="field"><label class="lbl" for="sStn">Stations</label><input type="number" id="sStn" min="1" max="20" value="${d.stations || 6}"></div>
      </div>
      <p class="hint" style="margin-top:-6px">Students type the code to find your class. Check-ins more than 5 minutes after the start time are marked late.</p>
      <div class="field"><label class="lbl" for="sEq">Equipment & supplies, one per line</label><textarea id="sEq" rows="4" placeholder="Cutting boards&#10;Sanitizing buckets">${esc((d.equipment || []).join('\n'))}</textarea></div>
      <div class="field"><label class="lbl" for="sCl">Cleaning jobs, one per line</label><textarea id="sCl" rows="4" placeholder="Dish pit&#10;Floor & trash">${esc((d.cleaning || []).join('\n'))}</textarea></div>
    </section>
    <section class="card stack">
      <div class="card-h" style="margin:0"><h3>Roster</h3><span class="chip" id="rosterCount">${(d.roster || []).length} students</span></div>
      <div class="field"><label class="lbl" for="sRoster">One student per line</label><textarea id="sRoster" rows="16" placeholder="Paste names from your class list">${esc((d.roster || []).join('\n'))}</textarea>
      <p class="hint">Paste straight from a spreadsheet column. Keep each name the same all term, since history follows the name.</p></div>
      <div class="row"><button class="btn heat lg" type="submit">${isNew ? 'Create class' : 'Save changes'}</button>${isNew ? '' : '<button class="btn ghost danger" type="button" id="delClass">Delete class</button>'}</div>
      <p class="msg" id="sMsg" role="status"></p>
    </section>
  </form>`;
  $('#sRoster').addEventListener('input', e => { const n = new Set(lines(e.target.value)).size; $('#rosterCount').textContent = n + ' students'; });
  $('#setupForm').addEventListener('submit', async e => {
    e.preventDefault(); const m = $('#sMsg'); m.className = 'msg warn';
    const name = $('#sName').value.trim(); const code = $('#sCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    const roster = Array.from(new Set(lines($('#sRoster').value)));
    if (!name) { m.textContent = 'Give the class a name.'; return; }
    if (code.length < 3) { m.textContent = 'Use a student code of at least 3 letters or numbers.'; return; }
    const clash = S.classes.find(c => c.id !== K.id && String(c.data.code || '').toUpperCase() === code);
    if (clash) { m.textContent = `${clash.data.name} already uses ${code}. Pick another code.`; return; }
    if (!roster.length) { m.textContent = 'Add at least one student to the roster.'; return; }
    if (!db) { m.textContent = 'Saving needs the published page.'; return; }
    const data = { name, instructor: $('#sChef').value.trim(), code, startTime: $('#sStart').value || '', stations: Math.max(1, Math.min(20, parseInt($('#sStn').value, 10) || 6)), equipment: lines($('#sEq').value), cleaning: lines($('#sCl').value), roster };
    try {
      if (isNew) { const id = slug(name).slice(0, 40) + '-' + Math.random().toString(36).slice(2, 6); await db.doc(`classes/${id}`).set({ ...data, createdAt: Date.now() }); toast('Class created'); go('class', { classId: id, tab: 'today' }); }
      else { await db.doc(`classes/${K.id}`).update(data); K.data = { ...K.data, ...data }; m.className = 'msg ok'; m.textContent = 'Saved.'; $('#clsTitle').textContent = name; }
    } catch (x) { m.textContent = "Couldn't save. Check your connection and try again."; }
  });
  const del = $('#delClass');
  if (del) del.addEventListener('click', confirmStep(del, 'Tap again to delete this class', async () => {
    try { await db.doc(`classes/${K.id}`).delete(); toast('Class deleted'); go('classes'); } catch (e) { toast("Couldn't delete. Try again."); }
  }));
}

/* two-tap confirmation, since the viewer has no confirm() dialog */
function confirmStep(btn, armedLabel, action) {
  let armed = false, t; const original = btn.textContent;
  return () => {
    if (!armed) { armed = true; btn.textContent = armedLabel; t = setTimeout(() => { armed = false; btn.textContent = original; }, 4000); return; }
    clearTimeout(t); armed = false; btn.textContent = original; action();
  };
}

/* ---------- appearance preferences ---------- */
(function initTheme(){
  const key='bb-theme';
  const apply=theme=>{
    document.documentElement.dataset.theme=theme;
    const btn=$('#themeToggle'), glyph=$('#themeGlyph'), label=$('#themeLabel');
    if(btn){btn.setAttribute('aria-label',theme==='dark'?'Switch to light theme':'Switch to dark theme');}
    if(glyph) glyph.textContent=theme==='dark'?'☾':'☼';
    if(label) label.textContent=theme==='dark'?'Dark mode':'Light mode';
    const meta=$('meta[name="theme-color"]'); if(meta) meta.content=theme==='dark'?'#121417':'#E7EAEC';
  };
  const saved=store.get(key); apply(saved==='light'||saved==='dark'?saved:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  $('#themeToggle')?.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';store.set(key,next);apply(next);});
})();

/* ================================================================
   BOOT
   ================================================================ */
function startFromHash() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'checkin') go('student'); else if (h === 'chef') go('classes'); else render();
}
startFromHash();
(async function boot() {
  const B = window.BB_BACKEND;
  db = await B.getDb();
  downloads = B.downloads;
  if (B.mode === 'demo') {
    $('#demoBar').hidden = false;
    const rb = $('#resetDemo');
    rb.addEventListener('click', confirmStep(rb, 'Tap again to reset everything', () => { B.resetDemo(); location.reload(); }));
  }
  dbResolved = true;
  if (db) {
    db.collection('classes').onSnapshot(snap => {
      S.classes = snap.docs.map(d => ({ id: d.id, data: d.data() || {} })); S.classesLoaded = true;
      if (S.view === 'classes') paintClassGrid();
      else if (S.view === 'class' && S.classId && (!K || !K.data.name) && S.classes.some(c => c.id === S.classId)) render();
      else if (S.view === 'class' && K && S.classId && !S.classes.some(c => c.id === S.classId)) go('classes');
      else if (S.view === 'student' && S.stuClassId && !S.classes.some(c => c.id === S.stuClassId)) go('student', { stuClassId: null });
    }, () => { S.classesLoaded = true; });
  } else { S.classesLoaded = true; }
  render();
})();
</script>
