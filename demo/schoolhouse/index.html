<title>Schoolhouse Daycare — Master List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* sampled from the Schoolhouse Daycare Centers logo */
  --brand:#AA3335; --brand-deep:#8C2628; --brand-soft:#F8E7E7;
  --flag:#426CA5; --flag-soft:#E4EBF4; --flag-deep:#31527D;

  --ink:#2E2A29; --ink-soft:#5F5854; --muted:#948A82;
  --paper:#FDF8EF; --surface:#FFFFFF; --rule:#E8E0D2; --rule-soft:#F5F0E6;

  --sky:var(--flag); --sky-soft:var(--flag-soft); --sky-deep:var(--flag-deep);
  --grass:#4E9E64; --grass-soft:#E4F1E7; --grass-deep:#3D7F50;
  --sun:#E9A522; --sun-soft:#FCF0D6; --sun-deep:#8F6200;
  --coral:var(--brand); --coral-soft:var(--brand-soft); --coral-deep:var(--brand-deep);
  --grape:#7E63B8; --grape-soft:#EDE8F6; --grape-deep:#5C4490;

  --display:'Baloo 2','Trebuchet MS',system-ui,cursive;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(51,64,79,.05),0 8px 22px rgba(51,64,79,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0}

/* ---------- masthead ---------- */
header.mast{background:var(--surface);color:var(--ink);padding:14px 20px 12px;border-bottom:1px solid var(--rule)}
.logo{height:56px;width:auto;display:block}
.mast-id{display:flex;align-items:center;gap:14px;min-width:0}
.mast-id .rule{width:1px;align-self:stretch;background:var(--rule);margin:2px 0}
.mast-in{max-width:1280px;margin:0 auto}
.mast-top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.01em;line-height:1.05}
.brand span{color:#FFE9A8;font-weight:600}
.mast-sub{font-size:12.5px;color:var(--muted);margin:0;letter-spacing:.02em}
.mast-sub b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);font-weight:600;letter-spacing:0}
.mast-acts{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:11px;padding:8px 14px;font-weight:700;font-size:14px;transition:.13s}
.btn:hover{background:var(--rule-soft)}
.btn-primary{background:var(--grass);border-color:var(--grass);color:#fff}
.btn-primary:hover{background:var(--grass-deep)}
.btn-ghost{background:var(--surface);border-color:var(--rule);color:var(--ink-soft)}
.btn-ghost:hover{background:var(--rule-soft);color:var(--ink)}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-xs{padding:4px 9px;font-size:12px;border-radius:9px}
.btn-danger{color:var(--brand-deep);border-color:#EBC9C9}
.btn-danger:hover{background:var(--coral-soft)}

/* ---------- ledger ---------- */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:9px;margin:0 0 16px}
.led{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:11px 14px;box-shadow:var(--shadow);border-top:4px solid var(--brand)}
.led:nth-child(2){border-top-color:var(--flag)}
.led:nth-child(3){border-top-color:var(--grass)}
.led:nth-child(4){border-top-color:var(--sun)}
.led:nth-child(5){border-top-color:var(--grape)}
.led:nth-child(6){border-top-color:var(--ink-soft)}
.led b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.led i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:700}
.led small{color:var(--muted);font-size:11.5px}

/* ---------- tabs ---------- */
nav.tabs{background:var(--brand);padding:0 20px;position:relative}
nav.tabs:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:repeating-linear-gradient(90deg,var(--sun) 0 22px,var(--flag) 22px 44px,var(--grass) 44px 66px,var(--brand-deep) 66px 88px)}
.tabs-in{max-width:1280px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;color:#F0CFCF;padding:11px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.tab .cnt{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.22);border-radius:20px;padding:1px 7px;margin-left:6px;font-weight:500}
.tab[aria-selected="true"] .cnt{background:#fff;color:var(--brand-deep)}

/* ---------- toolbar ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 24px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--rule);border-radius:11px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
select.filter{padding:9px 11px;border:1px solid var(--rule);border-radius:11px;background:var(--surface);font-weight:600}

/* ---------- week strip ---------- */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.wd{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:10px 12px;box-shadow:var(--shadow)}
.wd.today{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky-soft),var(--shadow)}
.wd h4{font-size:14px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:baseline}
.wd h4 em{font-style:normal;font-family:var(--mono);font-size:19px;color:var(--ink);font-weight:600}
.wd .split{font-size:11.5px;color:var(--muted);margin-top:2px}
.wd .staff{font-size:11.5px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--rule);color:var(--ink-soft)}
.wd .staff b{font-family:var(--mono)}

/* ---------- roster ---------- */
.roster{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:15px;padding:12px 15px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center}
.card.flagged{border-left:5px solid var(--sun)}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;flex-shrink:0}
.c-main{min-width:0;cursor:pointer}
.c-name{font-family:var(--display);font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.2}
.c-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.p-ft{background:var(--grass-soft);color:var(--grass-deep)}
.p-pt{background:var(--rule-soft);color:var(--ink-soft)}
.p-infant{background:var(--sun-soft);color:var(--sun-deep)}
.p-pre{background:var(--sky-soft);color:var(--sky-deep)}
.p-half{background:var(--grape-soft);color:var(--grape-deep)}
.p-sub{background:var(--coral-soft);color:var(--coral-deep)}
.p-legacy{background:var(--rule-soft);color:var(--ink-soft);border:1px dashed #CFC3AE}
.p-change{background:var(--grape-soft);color:var(--grape-deep)}
.p-allergy{background:var(--brand);color:#fff}
.c-right{display:flex;align-items:center;gap:14px}

/* ---------- signature: the attendance card ---------- */
.punch{display:flex;gap:3px}
.punch button{width:35px;height:39px;border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;font-family:var(--mono);font-size:13px;font-weight:600;color:#B9B0A2;display:flex;align-items:center;justify-content:center;transition:.12s}
.punch button:hover{border-color:var(--grass);color:var(--grass-deep)}
.punch button.on{background:var(--grass);border-color:var(--grass);color:#fff}
.money{text-align:right;min-width:118px;cursor:pointer}
.money b{font-family:var(--mono);font-size:19px;font-weight:600;display:block;letter-spacing:-.03em}
.money small{font-size:11px;color:var(--muted);display:block}
.money .rc{color:var(--coral-deep);font-size:11.5px;font-family:var(--mono)}

.flagnote{grid-column:1/-1;background:var(--sun-soft);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--sun-deep);display:flex;gap:7px}
.empty{background:var(--surface);border:2px dashed var(--rule);border-radius:15px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:21px}
.grouphdr{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink-soft);margin:18px 0 2px;display:flex;align-items:center;gap:10px}
.grouphdr:after{content:"";flex:1;height:2px;background:var(--rule);border-radius:2px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(51,64,79,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:-8px 0 34px rgba(51,64,79,.2)}
.drawer.open{transform:none}
.dr-head{background:var(--brand);color:#fff;padding:14px 18px 0}
.dr-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dr-title h2{font-size:21px;display:flex;align-items:center;gap:10px;min-width:0}
.dr-title .avatar{width:36px;height:36px;font-size:15px;border:2px solid rgba(255,255,255,.5)}
.dr-sub{font-size:12px;color:#F0CFCF;margin:1px 0 0}
.dr-tabs{display:flex;gap:2px;margin-top:11px;overflow-x:auto;scrollbar-width:none}
.dr-tabs::-webkit-scrollbar{display:none}
.dr-tabs button{background:transparent;border:0;border-bottom:4px solid transparent;color:#F0CFCF;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.dr-tabs button.on{color:#fff;border-bottom-color:#fff}
.dr-body{flex:1;overflow-y:auto;padding:16px 18px 22px}
.dr-foot{border-top:1px solid var(--rule);background:var(--surface);padding:11px 16px;display:flex;gap:8px;justify-content:space-between;align-items:center}
.x{background:transparent;border:0;color:#fff;font-size:26px;line-height:1;padding:0 6px;opacity:.8}
.x:hover{opacity:1}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:11px;background:var(--surface)}
.field textarea{min-height:58px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--rule);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;font-size:13.5px;font-weight:700;color:var(--muted);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--grass);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.hint b{color:var(--ink)}
.cardrate{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sun-soft);border-radius:11px;padding:8px 12px;font-size:12.5px;color:var(--sun-deep);margin-top:7px;font-weight:600}
.cardrate button{border:0;background:#fff;border-radius:8px;padding:4px 11px;font-size:12px;font-weight:800;color:var(--sun-deep);white-space:nowrap}
.calc{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:13px 15px;margin:16px 0 4px}
.calc h4{font-size:16px;color:var(--ink-soft);margin-bottom:8px}
.calcrow{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px dashed var(--rule);gap:10px}
.calcrow:last-child{border:0;padding-top:9px;margin-top:3px;border-top:2.5px solid var(--ink);font-weight:800;font-size:16px}
.calcrow span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.calcrow.neg span:last-child{color:var(--coral-deep)}

/* ---------- people & notes ---------- */
.sec{margin-bottom:20px}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.sec-hd h3{font-size:17px}
.sec-hd p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.person{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:11px 13px;margin-bottom:8px}
.person .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.person .nm{font-weight:800;font-size:15px}
.person .rel{font-size:12.5px;color:var(--muted)}
.person a{color:var(--sky-deep);font-weight:700;text-decoration:none;font-family:var(--mono);font-size:13.5px}
.person a:hover{text-decoration:underline}
.person .row2{margin-top:8px}
.person .fields{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
.person.editing .fields{display:block}
.person.editing .top .nm{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.chip.ok{background:var(--grass-soft);color:var(--grass-deep)}
.chip.no{background:var(--coral-soft);color:var(--coral-deep)}
.chip.id{background:var(--sun-soft);color:var(--sun-deep)}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:11px 13px;margin-bottom:8px;border-left:5px solid var(--rule)}
.note.billing{border-left-color:var(--grass)}
.note.behavior{border-left-color:var(--grape)}
.note.family{border-left-color:var(--sky)}
.note.care{border-left-color:var(--coral)}
.note.general{border-left-color:var(--muted)}
.note .nhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.note .ncat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.note.billing .ncat{color:var(--grass-deep)} .note.behavior .ncat{color:var(--grape-deep)}
.note.family .ncat{color:var(--sky-deep)} .note.care .ncat{color:var(--coral-deep)} .note.general .ncat{color:var(--muted)}
.note .ndate{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.note p{margin:0;font-size:14px;white-space:pre-wrap}
.note .nact{display:flex;gap:6px;margin-top:8px}
.notefilter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.notefilter button{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.notefilter button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.addbox{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:12px 13px;margin-bottom:12px}
.alert{background:var(--coral-soft);border:1px solid #F5C6BB;border-radius:12px;padding:10px 13px;margin-bottom:14px;font-size:13.5px;color:var(--coral-deep);font-weight:600}
.alert b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}

/* ---------- statement ---------- */
.stmt{background:#fff;border:1px solid var(--rule);border-radius:13px;padding:18px}
.stmt-hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid var(--brand);padding-bottom:10px;margin-bottom:12px;gap:10px}
.stmt-hd .logo{height:52px;margin-bottom:8px}
.stmt-hd h3{font-size:19px}
.stmt-hd .lic{font-size:11px;color:var(--muted);text-align:right}
.stmt table{width:100%;border-collapse:collapse;font-size:13.5px}
.stmt td{padding:6px 0;border-bottom:1px dashed var(--rule)}
.stmt td:last-child{text-align:right;font-family:var(--mono)}
.stmt tr.tot td{border-bottom:0;border-top:2.5px solid var(--ink);font-weight:800;font-size:15.5px;padding-top:9px}
.stmt .foot{margin-top:12px;font-size:11.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px 10px 18px;border-radius:26px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:70;box-shadow:0 8px 26px rgba(51,64,79,.35);display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--sun);border:0;color:#4A3300;border-radius:20px;padding:5px 13px;font-weight:800;font-size:13px}
footer.lic{max-width:1280px;margin:0 auto;padding:4px 20px 44px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center}
footer.lic em{font-family:var(--display);font-size:15px;font-style:normal;color:var(--ink-soft)}

@media(max-width:820px){
  .week{grid-template-columns:repeat(2,1fr)}
  .week .wd:last-child{grid-column:1/-1}
}
@media(max-width:760px){
  .card{grid-template-columns:auto 1fr}
  .c-right{grid-column:1/-1;justify-content:space-between;border-top:1px solid var(--rule-soft);padding-top:10px}
  .logo{height:42px}
  .mast-id{gap:10px}
  .mast-sub b{font-size:15px}
  header.mast{padding:11px 14px 10px}
  .wrap{padding:14px 14px 18px}
  .mast-acts{width:100%}
  .mast-acts .btn{flex:1;text-align:center;padding:7px 4px;font-size:12.5px}
  .ledger{grid-template-columns:1fr 1fr;gap:7px}
  .led b{font-size:18px} .led small{display:none}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .search{position:sticky;left:0;flex:0 0 60%;min-width:0}
  select.filter{flex:0 0 auto}
  .punch{flex:1;margin-right:10px}
  .punch button{flex:1;width:auto}
  .row2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
@media print{
  header.mast,nav.tabs,.toolbar,.week,.ledger,.punch,.scrim,.dr-head,.dr-foot,.notefilter,.addbox,.nact,footer.lic,.toast{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid;border-color:#ccc}
  body.printing .wrap{display:none}
  body.printing .drawer{position:static;transform:none;width:100%;box-shadow:none;background:#fff}
  body.printing .dr-body{overflow:visible;padding:0}
  body.printing .stmt{border:0;padding:0}
}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">

/* ---------- storage ---------- */
const store = {
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v = window.localStorage && localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return null;
  },
  async save(data){
    const s = JSON.stringify(data);
    try{ if(window.storage) await window.storage.set(KEY, s); }catch(e){}
    try{ if(window.localStorage) localStorage.setItem(KEY, s); }catch(e){}
  }
};

const $ = id => document.getElementById(id);
const money = n => '$' + (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$' + Math.round(n).toLocaleString('en-US');
const uid = p => (p||'s') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const today = () => new Date().toISOString().slice(0,10);

const avatarFor = s => AVATAR[[...s.name].reduce((a,c) => a + c.charCodeAt(0), 0) % AVATAR.length];

/* ---------- enrolment terms ---------- */
function currentTerm(c){
  const t = c.terms || [];
  if(!t.length) return blankTerm();
  const now = today();
  return t.find(x => (x.start||'') <= now && (!x.end || x.end > now))
      || t.filter(x => (x.start||'') <= now).sort((a,b) => (b.start||'').localeCompare(a.start||''))[0]
      || t.slice().sort((a,b) => (a.start||'').localeCompare(b.start||''))[0];
}
const sectionOf = c => currentTerm(c).section || 'active';
const programOf = c => currentTerm(c).program || 'preschool';
function annualOf(c){ return (c.terms||[]).reduce((a,t) => a + calc(t).annual, 0); }

/* ---------- the math, per term ---------- */
function calc(s){
  const dayCount = DAYS.filter(([k]) => s.days && s.days[k]).length;
  const weekly = s.rateBasis === 'weekly' ? (+s.rate||0) : (+s.rate||0) * dayCount;
  let discount = 0;
  if(s.discountType === 'percent') discount = weekly * (+s.discountValue||0) / 100;
  else if(s.discountType === 'amount') discount = (+s.discountValue||0);
  const rcoe = +s.rcoe || 0;
  const parent = Math.max(0, weekly - discount - rcoe);
  const weeks = weeksIn(s);
  const card = CARD[s.program] || CARD.preschool;
  const cardWeekly = s.rateBasis === 'weekly' ? card.weekly : (card.daily || card.weekly) * dayCount;
  return { dayCount, weekly, discount, rcoe, parent, weeks, annual: (parent + rcoe) * weeks,
           monthly: parent * 52 / 12, card, cardWeekly,
           belowCard: Math.max(0, cardWeekly - weekly),
           underMin: dayCount > 0 && dayCount < card.minDays,
           fullySubsidised: rcoe > 0 && parent === 0 };
}
function weeksIn(s){
  const jan = Date.UTC(YEAR,0,1), dec = Date.UTC(YEAR,11,31);
  const p = d => { if(!d) return null; const [y,m,dd] = d.split('-').map(Number); return Date.UTC(y,m-1,dd); };
  const from = Math.max(p(s.start) ?? jan, jan);
  const to   = Math.min(p(s.end) ?? dec, dec);
  return to <= from ? 0 : Math.round((to - from) / 604800000);
}
function ageOf(s){
  if(!s.dob) return null;
  const [y,m,d] = s.dob.split('-').map(Number);
  const n = new Date();
  let months = (n.getFullYear() - y) * 12 + (n.getMonth()+1 - m);
  if(n.getDate() < d) months--;
  if(months < 0) return null;
  return { months, years: Math.floor(months/12),
           label: months < 24 ? `${months} mo` : `${Math.floor(months/12)}y ${months%12}m` };
}
function agingUp(s){
  const a = ageOf(s);
  if(!a) return '';
  if(programOf(s) === 'infant' && a.years >= 2) return 'Old enough for the Preschool room and rate.';
  if(programOf(s) !== 'infant' && a.years >= 5 && sectionOf(s) !== 'leaving') return 'Turning TK age — worth planning the transition.';
  return '';
}
/* things worth flagging on the child's own card */
function issues(s){
  const c = calc(currentTerm(s)), out = [];
  if(c.underMin) out.push(`Enrolled ${c.dayCount} day a week; the card sets a two day minimum.`);
  const up = agingUp(s); if(up) out.push(up);
  (s.noteList||[]).filter(n => n.pin).forEach(n => out.push(n.text));
  return out;
}
/* profile gaps — counted and filterable, but not shouted on every card */
function gaps(s){
  const out = [];
  if(!(s.emergency||[]).length && !(s.guardians||[]).length) out.push('emergency contact');
  if(!(s.pickup||[]).some(p => p.ok !== false) && !(s.guardians||[]).length) out.push('approved pickup');
  return out;
}

/* ---------- ledger + week ---------- */
function enrolledList(){ return students.filter(s => ['active','monthly'].includes(sectionOf(s))); }

function renderLedger(){
  const en = enrolledList();
  const t = en.reduce((a,s) => { const c = calc(currentTerm(s)); a.parent += c.parent; a.rcoe += c.rcoe; a.below += c.belowCard; if(c.belowCard > .5) a.n++; return a; }, {parent:0,rcoe:0,below:0,n:0});
  const annual = students.filter(s => sectionOf(s) !== 'archived').reduce((a,s) => a + annualOf(s), 0);
  const needs = students.filter(s => sectionOf(s) !== 'archived' && issues(s).length).length;
  const togo = students.filter(s => sectionOf(s) !== 'archived' && gaps(s).length).length;
  $('ledger').innerHTML = `
    <div class="led"><i>Families pay weekly</i><b>${money0(t.parent)}</b><small>collected from parents</small></div>
    <div class="led"><i>RCOE pays weekly</i><b>${money0(t.rcoe)}</b><small>subsidy portion</small></div>
    <div class="led"><i>Projected ${YEAR}</i><b>${money0(annual)}</b><small>all groups, prorated</small></div>
    <div class="led"><i>Below card rate</i><b>${money0(t.below)}</b><small>${t.n} children on older rates</small></div>
    <div class="led"><i>Needs a look</i><b>${needs}</b><small>${en.length} enrolled right now</small></div>
    <div class="led"><i>Profiles to finish</i><b>${togo}</b><small>missing contact details</small></div>`;
  $('cnt').textContent = `${students.length} children on the list`;
}

function renderWeek(){
  const en = enrolledList();
  const todayIdx = new Date().getDay() - 1;
  $('week').innerHTML = DAYS.map(([k,full],i) => {
    const on = en.filter(s => currentTerm(s).days && currentTerm(s).days[k]);
    const inf = on.filter(s => programOf(s) === 'infant').length;
    const pre = on.length - inf;
    const staff = Math.ceil(inf / CARD.infant.ratio) + Math.ceil(pre / CARD.preschool.ratio);
    return `<div class="wd${i === todayIdx ? ' today' : ''}">
      <h4>${full.slice(0,3)}<em>${on.length}</em></h4>
      <div class="split">${inf} infant · ${pre} preschool</div>
      <div class="staff">Staff needed: <b>${staff}</b></div>
    </div>`;
  }).join('');
}

/* ---------- roster ---------- */
function matches(s, q){
  if(!q) return true;
  const hay = [s.name, ...(s.noteList||[]).map(n => n.text),
    ...(s.guardians||[]).map(p => p.name+' '+p.phone), ...(s.emergency||[]).map(p => p.name+' '+p.phone),
    ...(s.pickup||[]).map(p => p.name+' '+p.phone), s.allergies, s.care].join(' ').toLowerCase();
  return hay.includes(q);
}
function visible(){
  const q = $('q').value.trim().toLowerCase();
  const room = $('fRoom').value, sched = $('fSched').value, flag = $('fFlag').value, sort = $('fSort').value;
  let list = students.filter(s => tab === 'all' ? true : sectionOf(s) === tab);
  list = list.filter(s => matches(s, q));
  if(room) list = list.filter(s => programOf(s) === room);
  if(sched) list = list.filter(s => currentTerm(s).schedule === sched);
  if(flag === 'legacy')   list = list.filter(s => calc(currentTerm(s)).belowCard > .5);
  if(flag === 'rcoe')     list = list.filter(s => (+currentTerm(s).rcoe||0) > 0);
  if(flag === 'review')   list = list.filter(s => issues(s).length);
  if(flag === 'allergy')  list = list.filter(s => (s.allergies||'').trim());
  if(flag === 'nocontact')list = list.filter(s => !(s.emergency||[]).length && !(s.guardians||[]).length);
  if(flag === 'nopickup') list = list.filter(s => !(s.pickup||[]).some(p => p.ok !== false) && !(s.guardians||[]).length);
  if(flag === 'agingup')  list = list.filter(s => agingUp(s));
  const key = { name: s => s.name.toLowerCase(), parent: s => -calc(currentTerm(s)).parent,
                weekly: s => -calc(currentTerm(s)).weekly,
                start: s => currentTerm(s).start || '9999', age: s => (ageOf(s) ? ageOf(s).months : 9999) }[sort];
  const order = s => GROUPS.findIndex(g => g[0] === sectionOf(s));
  return list.sort((a,b) => {
    if(tab === 'all' && order(a) !== order(b)) return order(a) - order(b);
    return key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0;
  });
}
function renderTabs(){
  $('tabs').innerHTML = GROUPS.map(([k,label]) => {
    const n = students.filter(s => sectionOf(s) === k).length;
    if(k === 'archived' && !n) return '';
    return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${label}<span class="cnt">${n}</span></button>`;
  }).join('') + `<button class="tab" role="tab" data-tab="all" aria-selected="${tab==='all'}">Everyone<span class="cnt">${students.length}</span></button>`;

function renderRoster(){
  const list = visible(), el = $('roster');

      ${c.rcoe ? `<tr><td>Paid by RCOE</td><td>−${money(c.rcoe)}</td></tr>` : ''}
      <tr class="tot"><td>Due from family each week</td><td>${money(c.parent)}</td></tr>
    </table>
    <div class="foot">Roughly ${money0(c.monthly)} a month. Tuition is based on enrollment, not attendance — your child's space is reserved.</div>
  </div>
  <button class="btn btn-primary btn-sm" id="btnPrint" style="width:100%;margin-top:12px">Print or save as PDF</button>`;
}

/* ---------- persistence + toast ---------- */
function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => store.save(students), 250); }
function toast(msg, undo){
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? `<button id="undoBtn">Undo</button>` : '');
  t.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => t.classList.remove('show'), undo ? 7000 : 2200);
  if(undo) $('undoBtn').onclick = () => {
    students.push(undoBuf); undoBuf = null;
    persist(); render(); t.classList.remove('show'); toast('Brought back');
  };
}

/* ================= EVENTS ================= */
$('roster').addEventListener('click', e => {
  const b = e.target.closest('button[data-day]'); if(!b) return;
  const t = currentTerm(students.find(x => x.id === b.dataset.id));
  t.days[b.dataset.day] = !t.days[b.dataset.day];
  persist(); render();
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if(!b) return;
  tab = b.dataset.tab; render();
});
['q','fRoom','fSched','fSort','fFlag'].forEach(id => $(id).addEventListener('input', renderRoster));

$('drTabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-drtab]'); if(!b) return;
  drTab = b.dataset.drtab; paintDrawer();
});

/* one delegated input handler for every field in the drawer */
$('drBody').addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f){
    const f = t.dataset.f;
    const TERM_F = ['program','rate','rcoe','discountType','discountValue','start','end','section'];
    const target = TERM_F.includes(f) ? editTerm() : draft;
    target[f] = (f === 'rate' || f === 'rcoe' || f === 'discountValue') ? (+t.value || 0) : t.value;
    if(f === 'program'){
      const tm = editTerm();
      if(tm.program === 'halfday'){ tm.rateBasis = 'weekly'; seg('segBasis','weekly'); }
      const cr = cardRateFor(tm); if(cr != null){ tm.rate = cr; $('f_rate').value = cr; }
    }
    if(f === 'discountType') $('f_discountValue').disabled = t.value === 'none';
    if(f === 'name' || f === 'dob' || f === 'program'){
      const age = ageOf(draft);
      $('drName').innerHTML = `<span class="avatar" style="background:${draft.name ? avatarFor(draft) : 'var(--muted)'}">${esc(initials(draft.name||'?'))}</span>
        <span style="min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(draft.name || 'Add child')}</span>
        <span class="dr-sub">${age ? age.label + ' · ' : ''}${CARD[editTerm().program].label}</span></span>`;
    }
    drawCalc();
    return;
  }
  const pf = t.dataset.p;
  if(pf){
    const wrap = t.closest('.person');
    const arr = draft[wrap.dataset.plist];
    const p = arr.find(x => x.id === wrap.dataset.pid);
    p[pf] = t.type === 'checkbox' ? t.checked : t.value;
    if(pf === 'name') wrap.querySelector('.nm').textContent = t.value || 'New contact';
  }
});
$('drBody').addEventListener('click', e => {
  const t = e.target;
  /* day toggles */
  const d = t.closest('button[data-fday]');
  if(d){ const tm = editTerm(); tm.days[d.dataset.fday] = !tm.days[d.dataset.fday];
    d.classList.toggle('on'); d.setAttribute('aria-pressed', tm.days[d.dataset.fday]); drawCalc(); return; }
  const tp = t.closest('button[data-term]');
  if(tp){ termId = tp.dataset.term; paintDrawer(); return; }
  if(t.id === 'btnDelTerm'){
    if(draft.terms.length < 2) return;
    if(!confirm('Delete this rate period? The child stays on the list.')) return;
    draft.terms = draft.terms.filter(x => x.id !== termId);
    termId = currentTerm(draft).id; paintDrawer(); return;
  }
  /* segmented controls */
  const sg = t.closest('#segSched button, #segBasis button');
  if(sg){
    const which = sg.closest('.seg').id;
    const tm = editTerm();
    if(which === 'segSched'){
      tm.schedule = sg.dataset.v;
      tm.rateBasis = sg.dataset.v === 'FT' || tm.program === 'halfday' ? 'weekly' : 'daily';
      const cr = cardRateFor(tm); if(cr != null) tm.rate = cr;
      if(sg.dataset.v === 'FT') DAYS.forEach(([k]) => tm.days[k] = true);
      paintDrawer();
    } else { tm.rateBasis = sg.dataset.v; seg('segBasis', sg.dataset.v); drawCalc(); }
    return;
  }
  /* people */
  const add = t.closest('button[data-addperson]');
  if(add){
    const k = add.dataset.addperson;
    draft[k].push({ id: uid('p'), name:'', rel:'', phone:'', email:'', note:'', ok:true, idCheck:false, primary:false, _edit:true });
    paintDrawer(); return;
  }
  const per = t.closest('.person');
  if(per && t.closest('button[data-pedit]')){
    const arr = draft[per.dataset.plist], p = arr.find(x => x.id === per.dataset.pid);
    p._edit = !p._edit; paintDrawer(); return;
  }
  if(per && t.closest('button[data-pdel]')){
    const arr = draft[per.dataset.plist], p = arr.find(x => x.id === per.dataset.pid);
    if(p.name && !confirm(`Remove ${p.name}?`)) return;
    draft[per.dataset.plist] = arr.filter(x => x.id !== per.dataset.pid);
    paintDrawer(); return;
  }
  /* notes */
  if(t.id === 'nAdd'){
    const text = $('nText').value.trim();
    if(!text){ $('nText').focus(); return; }
    draft.noteList.push({ id: uid('n'), date: $('nDate').value || today(), cat: $('nCat').value, text, pin:false });
    paintDrawer(); return;
  }
  const nf = t.closest('button[data-nf]');
  if(nf){ noteFilter = nf.dataset.nf; paintDrawer(); return; }
  const note = t.closest('.note');
  if(note && t.closest('button[data-npin]')){
    const n = draft.noteList.find(x => x.id === note.dataset.nid); n.pin = !n.pin; paintDrawer(); return;
  }
  if(note && t.closest('button[data-ndel]')){
    if(!confirm('Delete this note?')) return;
    draft.noteList = draft.noteList.filter(x => x.id !== note.dataset.nid); paintDrawer(); return;
  }
  /* rate change */
  if(t.id === 'btnRateChange'){
    const cur = editTerm();
    if(cur.start && cur.start >= today()){ toast('This period starts today or later — change its rate directly'); return; }
    const next = JSON.parse(JSON.stringify(cur));
    next.id = uid('t'); next.start = today(); next.end = cur.end; next.dateNote = '';
    cur.end = today();
    draft.terms.push(next);
    termId = next.id; drTab = 'details'; paintDrawer();
    toast('New rate period started today — set the new rate');
    return;
  }
  if(t.id === 'btnPrint'){
    document.body.classList.add('printing');
    window.print();
    setTimeout(() => document.body.classList.remove('printing'), 500);
  }
});

$('btnAdd').onclick = () => openDrawer(null);
$('drCancel').onclick = closeDrawer;
$('drClose').onclick = closeDrawer;
$('scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('drawer').classList.contains('open')) closeDrawer(); });

$('drSave').onclick = () => {
  if(!draft.name.trim()){ drTab = 'details'; paintDrawer(); $('f_name').focus(); toast('Add a name before saving'); return; }
  (draft.guardians||[]).concat(draft.emergency||[], draft.pickup||[]).forEach(p => delete p._edit);
  draft.terms.sort((a,b) => (a.start||'').localeCompare(b.start||''));
  const i = students.findIndex(s => s.id === draft.id);
  if(i >= 0) students[i] = draft; else students.push(draft);
  persist(); render(); const nm = draft.name; closeDrawer(); toast(i >= 0 ? 'Changes saved' : nm + ' added');
};
$('drDelete').onclick = () => {
  if(!editing) return;
  const s = students.find(x => x.id === editing);
  if(!confirm(`Remove ${s.name} from the list?`)) return;
  undoBuf = s;
  students = students.filter(x => x.id !== editing);
  persist(); render(); closeDrawer(); toast(s.name + ' removed', true);
};

/* ---------- exports ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const csvQ = v => `"${String(v == null ? '' : v).replace(/"/g,'""')}"`;
$('btnCsv').onclick = () => {
  const head = ['Name','Date of birth','Age (months)','Period','Current period','Group','Program','Schedule','Mon','Tue','Wed','Thu','Fri','Days','Rate','Rate basis','Weekly total','Card rate','Under card','Discount','RCOE','Family weekly','Approx monthly','Weeks in '+YEAR,'Projected '+YEAR,'Start','Last day','Allergies','Care notes','Guardians','Emergency contacts','Approved pickup','Notes'];
  const ppl = a => (a||[]).map(p => `${p.name}${p.rel?' ('+p.rel+')':''}${p.phone?' '+p.phone:''}`).join(' | ');
  const rows = [];
  students.forEach(s => {
    const age = ageOf(s), cur = currentTerm(s), terms = s.terms||[];
    terms.forEach((t,i) => { const c = calc(t); rows.push([
      s.name, s.dob, age ? age.months : '', `${i+1} of ${terms.length}`, t.id === cur.id ? 'yes' : '',
      (GROUPS.find(g => g[0] === t.section)||[,t.section])[1], c.card.label, t.schedule,
      ...DAYS.map(([k]) => t.days[k] ? 'X' : ''), c.dayCount, t.rate, t.rateBasis,
      c.weekly.toFixed(2), c.cardWeekly.toFixed(2), c.belowCard.toFixed(2), c.discount.toFixed(2), c.rcoe.toFixed(2),
      c.parent.toFixed(2), c.monthly.toFixed(2), c.weeks, c.annual.toFixed(2), t.start, t.end,
      s.allergies, s.care, ppl(s.guardians), ppl(s.emergency), ppl((s.pickup||[]).filter(p => p.ok !== false)),
      (s.noteList||[]).map(n => `[${n.cat} ${n.date}] ${n.text}`).join(' | ')
    ].map(csvQ).join(',')); });
  });
  download(`master-list-${today()}.csv`, head.map(csvQ).join(',')+'\n'+rows.join('\n'), 'text/csv');
  toast('CSV downloaded');
};
$('btnSheet').onclick = () => {
  const en = enrolledList().slice().sort((a,b) => a.name.localeCompare(b.name));
  const rows = en.map(s => {
    const ok = (s.guardians||[]).map(p => `${p.name} (${p.rel||'guardian'})${p.phone?' '+p.phone:''}`)
      .concat((s.pickup||[]).filter(p => p.ok !== false).map(p => `${p.name} (${p.rel||'approved'})${p.phone?' '+p.phone:''}${p.idCheck?' [ID]':''}`));
    const em = (s.emergency||[]).map(p => `${p.name} (${p.rel||'emergency'})${p.phone?' '+p.phone:''}`);
    return `<tr><td><b>${esc(s.name)}</b><br><small>${esc(CARD[programOf(s)].short)}${s.allergies?' · ALLERGY':''}</small></td>
      <td>${ok.length ? ok.map(esc).join('<br>') : '<i>nobody listed</i>'}</td>
      <td>${em.length ? em.map(esc).join('<br>') : '<i>none</i>'}</td>
      <td>${esc(s.allergies||'')}</td></tr>`;
  }).join('');
  const w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups to open the pickup sheet'); return; }
  w.document.write(`<html><head><title>Pickup & emergency sheet</title><style>
    body{font-family:system-ui,sans-serif;margin:24px;color:#33404F}
    h1{font-size:20px;margin:0} .sub{color:#8695A5;font-size:12px;margin:2px 0 16px}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{text-align:left;background:#F4EFE5;padding:7px;border-bottom:2px solid #33404F}
    td{padding:7px;border-bottom:1px solid #E9E2D6;vertical-align:top}
    small{color:#8695A5} tr{break-inside:avoid}
  </style></head><body>
    <img src="${LOGO}" alt="Schoolhouse Daycare Centers" style="height:46px;display:block;margin-bottom:8px">
    <h1>Pickup &amp; emergency sheet</h1>
    <div class="sub">LIC #334846754 · ${en.length} children · ${fmtDate(today())}</div>
    <table><thead><tr><th>Child</th><th>Approved for pickup</th><th>Emergency contacts</th><th>Allergies</th></tr></thead>
    <tbody>${rows}</tbody></table></body></html>`);
  w.document.close(); setTimeout(() => w.print(), 400);
};
$('btnBackup').onclick = () => {
  download(`master-list-backup-${today()}.json`, JSON.stringify(students,null,1), 'application/json');
  toast('Backup downloaded');
};
$('btnRestore').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data) || !data.length || !data[0].name) throw 0;
      if(!confirm(`Replace the current list with ${data.length} children from this backup?`)) return;
      students = data.map(migrate); persist(); render(); toast('Backup restored');
    }catch(err){ toast('That file is not a Master List backup'); }
  };
  r.readAsText(f); e.target.value = '';
};

/* ---------- migrate older records ---------- */
const TERM_KEYS = ['id','start','end','section','program','schedule','days','rateBasis','rate','discountType','discountValue','rcoe','dateNote'];
function migrate(s){
  if(typeof s.notes === 'string'){
    s.noteList = s.notes.trim() ? [{id:uid('n'),date:today(),cat:'general',text:s.notes,pin:false}] : [];
    delete s.notes;
  }
  ['guardians','emergency','pickup','noteList'].forEach(k => { if(!Array.isArray(s[k])) s[k] = []; });
  ['dob','allergies','care'].forEach(k => { if(s[k] == null) s[k] = ''; });
  if(s.review){ s.noteList.unshift({id:uid('n'),date:today(),cat:'billing',text:s.review,pin:true}); delete s.review; }
  /* flat record from an older backup -> single term */
  if(!Array.isArray(s.terms) || !s.terms.length){
    const t = blankTerm();
    TERM_KEYS.forEach(k => { if(k !== 'id' && s[k] != null) t[k] = s[k]; });
    if(!t.program) t.program = s.room === 'Infant' ? 'infant' : 'preschool';
    s.terms = [t];
    TERM_KEYS.filter(k => k !== 'id').forEach(k => delete s[k]);
  }
  s.terms.forEach(t => {
    if(!t.id) t.id = uid('t');
    if(!t.program) t.program = 'preschool';
    if(!t.days) t.days = {mon:false,tue:false,wed:false,thu:false,fri:false};
    if(!t.section) t.section = 'active';
  });
  return s;
}

/* ---------- go ---------- */
(async function init(){
  const saved = await store.load();
  students = ((saved && saved.length) ? saved : SEED).map(migrate);
  if(!saved) store.save(students);
  render();
})();
</script>
