<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>ChopChop Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F3FA; --surface:#FFFFFF; --surface-2:#F0EBF6; --ink:#26183A; --muted:#6E6384; --line:#E5DFEE;
  --tomato:#FF6B35; --tomato-2:#FF8C61; --coral:#FF5E62; --tomato-ink:#D9481A;
  --butter:#FFC53D; --butter-ink:#8A5A00; --basil:#1FB88A; --basil-ink:#0E7A5A; --berry:#6C5CE7; --sky:#2DA8F0;
  --danger:#E5484D; --warn:#F59E0B;
  --shadow:0 1px 2px rgba(38,24,58,.06),0 8px 24px -8px rgba(38,24,58,.18);
  --shadow-lg:0 2px 4px rgba(38,24,58,.06),0 22px 44px -16px rgba(38,24,58,.32);
  --stage:#140E1B;
  --display:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:76px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ground:#16101E;--surface:#221A2D;--surface-2:#2C2339;--ink:#F4EEFA;--muted:#A99DBB;--line:#3A2F49;
  --tomato-ink:#FF9A70;--butter-ink:#FFD36B;--basil-ink:#5FE0B4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6);--shadow-lg:0 22px 48px -18px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#16101E;--surface:#221A2D;--surface-2:#2C2339;--ink:#F4EEFA;--muted:#A99DBB;--line:#3A2F49;
  --tomato-ink:#FF9A70;--butter-ink:#FFD36B;--basil-ink:#5FE0B4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6);--shadow-lg:0 22px 48px -18px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px;border-radius:10px}
h1,h2,h3,.display{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:34px;font-weight:800} h2{font-size:24px;font-weight:800} h3{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
#app.wide{max-width:1120px}
.screen{padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;animation:screenIn .28s ease both}
.screen.bare{padding-bottom:40px}
@keyframes screenIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.section{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.01em;transition:transform .12s ease,filter .12s ease,box-shadow .12s;user-select:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(180deg,var(--tomato-2),var(--tomato));color:#fff;box-shadow:0 4px 0 #C94A1C,0 10px 20px -8px rgba(255,107,53,.7)}
.btn-primary:active{box-shadow:0 1px 0 #C94A1C;transform:translateY(3px)}
.btn-go{background:linear-gradient(180deg,#34D3A0,var(--basil));color:#fff;box-shadow:0 4px 0 #11875F,0 10px 20px -8px rgba(31,184,138,.7)}
.btn-go:active{box-shadow:0 1px 0 #11875F;transform:translateY(3px)}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-line{background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.btn-sm{min-height:38px;font-size:15px;padding:0 14px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{filter:grayscale(.8);opacity:.5;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:20px;flex:none}
.link{color:var(--tomato-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- chips & pills ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.lock{background:#2B2436;color:#fff}
.pill.warn{background:#FFF1D6;color:#8A5A00}
.pill.good{background:#DDF6EC;color:#0E7A5A}
.pill.heat{background:#FFE3DB;color:#B43A12}
:root[data-theme="dark"] .pill.warn,:root[data-theme="dark"] .pill.good,:root[data-theme="dark"] .pill.heat{background:var(--surface-2);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn,:root:not([data-theme="light"]) .pill.good,:root:not([data-theme="light"]) .pill.heat{background:var(--surface-2);color:var(--ink)}}
.coin{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.coin i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#F2A900);box-shadow:inset 0 0 0 2px #D08A00;display:inline-block;flex:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.card.flat{box-shadow:none;border:2px solid var(--line)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--butter),#FF9F1C);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- top & bottom bars ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 -16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar h2{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud{display:flex;gap:8px}
.hud .pill{background:var(--surface);box-shadow:var(--shadow);padding:6px 12px;font-size:14px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);z-index:40;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);border-radius:24px 24px 0 0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--tomato-ink)}
.nav button[aria-current="page"] .nav-ico{background:color-mix(in srgb,var(--tomato) 16%,transparent)}
.nav-ico{width:52px;height:32px;border-radius:12px;display:grid;place-items:center;transition:background .2s}

/* ---------- landing ---------- */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px 16px;text-align:center;position:relative;overflow:hidden}
.landing::before{content:"";position:absolute;inset:-20% -30% auto;height:70%;background:radial-gradient(closest-side,rgba(255,140,97,.35),transparent),radial-gradient(closest-side at 80% 60%,rgba(108,92,231,.18),transparent);z-index:-1}
.wordmark{font-family:var(--display);font-weight:800;font-size:54px;letter-spacing:-.03em;line-height:.9;color:var(--ink)}
.wordmark b{color:var(--tomato)}
.brand-lock{display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.tagline{font-size:17px;color:var(--muted);max-width:30ch}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;width:100%;max-width:440px}
.who button{background:var(--surface);border-radius:26px;padding:16px 10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.who button:hover{transform:translateY(-3px)}
.who .avatar{border-radius:50%}
.who strong{font-family:var(--display);font-size:22px;line-height:1}
.grownup-link{font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;padding:10px 14px;border-radius:12px}
.grownup-link:hover{background:var(--surface-2)}

/* ---------- home ---------- */
.home-head{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 4px;transition:opacity .2s}
.home-head .wordmark{font-size:46px}
.mini-head{position:fixed;top:0;left:50%;transform:translate(-50%,-110%);width:min(100%,520px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .28s cubic-bezier(.2,.8,.2,1);border-bottom:1px solid var(--line)}
.mini-head.show{transform:translate(-50%,0)}
.mini-head .wordmark{font-size:24px}
.hero{position:relative;border-radius:28px;padding:18px;color:#fff;background:linear-gradient(135deg,#FF8C61 0%,#FF6B35 45%,#F2475B 100%);box-shadow:0 18px 40px -18px rgba(242,71,91,.7);overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-top{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.hero .avatar-wrap{position:relative;flex:none}
.hero .avatar{border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.edit-dot{position:absolute;right:-4px;bottom:-4px;background:#fff;color:var(--tomato-ink);font-size:12px;font-weight:700;border-radius:99px;padding:3px 8px;box-shadow:var(--shadow)}
.hero h1{font-size:32px;color:#fff}
.rank{font-size:14px;opacity:.92;font-weight:500}
.xp-row{display:flex;justify-content:space-between;font-size:13px;margin:14px 0 6px;position:relative;z-index:1;font-weight:500}
.hero .bar{background:rgba(255,255,255,.28);height:14px}
.hero .bar>i{background:linear-gradient(90deg,#FFE38A,#FFF)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.hero-stats div{background:rgba(255,255,255,.18);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column}
.hero-stats b{font-family:var(--display);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:12px;opacity:.9}

.feature{border-radius:26px;overflow:hidden;background:var(--stage);color:#fff;box-shadow:var(--shadow-lg);display:block;text-align:left;width:100%}
.feature .thumb{border-radius:0}
.feature-body{padding:14px 16px 16px;display:flex;align-items:center;gap:12px}
.feature-body h3{font-size:21px}
.feature-body p{font-size:13px;opacity:.75}

.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--stage)}
.thumb svg.scene{width:100%;height:100%;display:block}
.thumb .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.thumb .play::before{content:"";border-left:20px solid var(--tomato);border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(20,14,27,.8);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px}
.thumb .ch{position:absolute;left:10px;top:10px;background:rgba(20,14,27,.8);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px}

.quests{display:flex;flex-direction:column;gap:8px}
.quest{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface-2)}
.quest .tick{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-size:14px;font-weight:800}
.quest.done .tick{background:var(--basil);border-color:var(--basil)}
.quest.done span{text-decoration:line-through;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border-radius:22px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tile .t-ico{font-size:32px;line-height:1}
.tile h3{font-size:19px;color:#fff}
.tile small{font-size:12px;opacity:.9}
.tile::after{content:"";position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}

/* ---------- recipe list ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;min-height:50px;box-shadow:var(--shadow)}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;min-width:0}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rcard{display:flex;flex-direction:column;gap:8px;text-align:left;border-radius:22px;background:var(--surface);padding:8px 8px 12px;box-shadow:var(--shadow);position:relative;transition:transform .15s}
.rcard:hover{transform:translateY(-2px)}
.rcard .plate{aspect-ratio:4/3;max-width:100%;border-radius:16px;display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden}
.rcard .plate::before{content:"";position:absolute;width:74%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.rcard .plate span{position:relative}
.rcard .plate .mini-play{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;background:rgba(20,14,27,.85);color:#fff;border-radius:8px;padding:3px 7px;display:flex;gap:4px;align-items:center}
.rcard h3{font-size:17px;padding:0 4px}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px;font-size:12px;color:var(--muted)}
.rcard.locked .plate{filter:saturate(.35)}
.rcard .lockbadge{position:absolute;right:14px;top:14px}
.stars{color:var(--butter);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.pack-banner{border-radius:22px;padding:16px;color:#fff;display:flex;align-items:center;gap:14px}
.pack-banner .p-ico{font-size:40px}
.pack-banner h3{color:#fff}
.pack-banner p{font-size:13px;opacity:.9}

/* ---------- recipe detail ---------- */
.detail-hero{margin:0 -16px;position:relative}
.detail-hero .thumb{border-radius:0 0 28px 28px}
.detail-hero .icon-btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;z-index:2}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facts div{background:var(--surface);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.facts b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.facts span{font-size:11.5px;color:var(--muted)}
.safety{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:18px;background:#FFF4E5;color:#6B4200}
.safety .s-ico{font-size:24px}
:root[data-theme="dark"] .safety{background:#3A2A16;color:#FFD9A0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .safety{background:#3A2A16;color:#FFD9A0}}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:16px}
.tabs button{flex:1;min-height:40px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ing{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ing-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left}
.ing-item .e{font-size:30px;line-height:1;flex:none}
.ing-item b{display:block;font-size:14px}
.ing-item small{font-size:12px;color:var(--muted);line-height:1.25;display:block}
.ing-item[aria-pressed="true"]{border-color:var(--basil);background:color-mix(in srgb,var(--basil) 12%,var(--surface))}
.chapters{display:flex;flex-direction:column;gap:8px;counter-reset:ch}
.chapter{display:flex;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:16px;background:var(--surface)}
.chapter .mini{width:112px;flex:none;border-radius:12px}
.chapter .n{font-family:var(--display);font-weight:800;color:var(--tomato-ink);font-size:14px}
.chapter p{font-size:13.5px;line-height:1.35}
.nutri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plate-groups{display:flex;gap:8px;flex-wrap:wrap}
.fact-card{border-radius:20px;padding:16px;background:linear-gradient(135deg,#EFEAFF,#E4F4FF);color:#26183A;display:flex;gap:12px}
.fact-card .f-ico{font-size:26px}
.sticky-cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:15}

/* ---------- player ---------- */
.player{display:grid;gap:16px;padding:0 16px 40px;grid-template-columns:1fr}
@media (min-width:900px){.player{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);align-items:start}.player .p-top{grid-column:1/-1}}
.p-top{display:flex;align-items:center;gap:10px;padding-top:12px}
.p-top .title{flex:1;min-width:0}
.p-top .title h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-top .title small{color:var(--muted);font-size:13px}
.stage{position:relative;border-radius:22px;overflow:hidden;background:var(--stage);box-shadow:var(--shadow-lg);color:#fff}
.stage .screenbox{position:relative;aspect-ratio:16/9;max-width:100%}
.stage .screenbox>svg,.stage .screenbox>video{width:100%;height:100%;display:block;object-fit:cover}
.stage.paused svg *{animation-play-state:paused!important}
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 7%;background:linear-gradient(90deg,rgba(20,14,27,.86),rgba(20,14,27,.2));opacity:0;pointer-events:none;transition:opacity .35s}
.titlecard.show{opacity:1}
.titlecard .eyebrow{color:#FFB08F}
.titlecard h2{color:#fff;font-size:clamp(24px,4.4vw,42px);max-width:18ch}
.lower3{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:rgba(20,14,27,.82);border-left:5px solid var(--butter);padding:6px 12px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transform:translateY(6px);transition:.3s}
.lower3.show{opacity:1;transform:none}
.bigplay{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .15s,opacity .2s}
.bigplay::before{content:"";border-left:26px solid var(--tomato);border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:8px}
.bigplay.replay::before{border:0;content:"↻";font-size:40px;color:var(--tomato);font-weight:800;margin:0}
.bigplay[hidden]{display:none}
.controls{display:flex;align-items:center;gap:6px;padding:10px 12px 12px}
.controls .cbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.controls .cbtn:hover{background:rgba(255,255,255,.1)}
.controls .cbtn[aria-pressed="true"]{background:rgba(255,255,255,.16)}
.controls .cbtn svg{width:22px;height:22px}
.scrub{flex:1;height:26px;position:relative;cursor:pointer;min-width:60px}
.scrub .track{position:absolute;left:0;right:0;top:11px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;gap:3px;overflow:hidden}
.scrub .seg{flex:1;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.scrub .seg i{position:absolute;inset:0;right:auto;background:var(--tomato);width:0}
.scrub .seg.done i{width:100%!important;background:var(--basil)}
.speed{font-size:13px;font-weight:700;min-width:44px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff}
.captions{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);font-size:22px;line-height:1.45;font-weight:500;min-height:92px}
.captions.big{font-size:30px}
.captions .w{border-radius:6px;padding:0 1px;transition:background .15s,color .15s;color:var(--muted)}
.captions .w.said{color:var(--ink)}
.captions .w.now{background:var(--butter);color:#26183A}
.p-side{display:flex;flex-direction:column;gap:14px}
.stepcount{display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--basil)}
.dots i.now{background:var(--tomato);width:24px;border-radius:9px}
.grownup{border-radius:20px;padding:14px;background:#FFE9E0;color:#7A2A0C;display:flex;flex-direction:column;gap:10px}
:root[data-theme="dark"] .grownup{background:#3D2019;color:#FFC7B3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grownup{background:#3D2019;color:#FFC7B3}}
.grownup.ok{background:#DDF6EC;color:#0E5A43}
:root[data-theme="dark"] .grownup.ok{background:#15372B;color:#9FF0CF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grownup.ok{background:#15372B;color:#9FF0CF}}
.hold{position:relative;overflow:hidden;min-height:52px;border-radius:16px;background:#fff;color:#7A2A0C;font-weight:700;font-family:var(--display);font-size:17px;border:2px solid #FFB89C;touch-action:none;user-select:none;-webkit-user-select:none}
.hold i{position:absolute;inset:0;right:auto;width:0;background:#FFD2C0}
.hold span{position:relative}
.timer{display:flex;align-items:center;gap:16px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.timer.ding{animation:ding .5s ease 3}
@keyframes ding{50%{transform:scale(1.04);box-shadow:0 0 0 6px var(--butter)}}
.extras{display:flex;gap:8px;flex-wrap:wrap}
.note{border-radius:18px;padding:12px 14px;background:var(--surface-2);font-size:14px;display:flex;gap:10px}
.note b{font-family:var(--display);font-size:15px}
.actions{display:flex;gap:10px}
.actions .btn-go{flex:1;font-size:21px;min-height:60px}
.didit-pulse{animation:pulse 1.4s ease infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #11875F,0 0 0 10px rgba(31,184,138,.22)}}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.counter-mode .captions{font-size:34px}
.counter-mode .actions .btn-go{min-height:80px;font-size:26px}

/* ---------- celebration ---------- */
.celebrate{text-align:center;align-items:center}
.big-stars{font-size:54px;letter-spacing:6px}
.big-stars span{display:inline-block;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both;color:var(--line)}
.big-stars span.on{color:var(--butter);text-shadow:0 4px 0 #D08A00}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reward{background:var(--surface);border-radius:18px;padding:10px 16px;box-shadow:var(--shadow);font-weight:700;font-family:var(--display);font-size:20px}
.photo-drop{border:3px dashed var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;width:100%}
.photo-drop img{border-radius:16px;max-height:240px;object-fit:cover}
.taste{display:flex;gap:10px;justify-content:center}
.taste button{font-size:34px;width:64px;height:64px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.taste button[aria-pressed="true"]{background:var(--butter);transform:scale(1.08)}

/* ---------- academy ---------- */
.tree{position:relative}
.tree svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tier{position:relative;padding:14px 0}
.tier-label{text-align:center;margin-bottom:10px}
.tier-nodes{display:flex;justify-content:space-around;gap:8px}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;text-align:center}
.node .orb{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--surface);border:4px solid var(--line);box-shadow:var(--shadow);position:relative}
.node.mastered .orb{background:linear-gradient(160deg,#8B7CFF,var(--berry));border-color:#fff;box-shadow:0 0 0 3px var(--berry),var(--shadow)}
.node.open .orb{border-color:var(--tomato);animation:glowRing 2s ease infinite}
@keyframes glowRing{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tomato) 25%,transparent)}}
.node.locked .orb{filter:grayscale(1);opacity:.55}
.node b{font-size:12.5px;line-height:1.2;font-weight:600;background:var(--ground);border-radius:6px;padding:1px 4px}
.node .stars{background:var(--ground);border-radius:6px;padding:0 4px}
.tier-label{position:relative;z-index:1}.tier-label.eyebrow{background:var(--ground);width:max-content;margin-inline:auto;padding:0 8px}
@media (max-width:420px){.topbar .hud .pill+.pill{display:none}}
.node .stars{font-size:11px}

/* ---------- games ---------- */
.game-card{display:flex;gap:14px;align-items:center;text-align:left;border-radius:24px;padding:14px;color:#fff;box-shadow:var(--shadow)}
.game-card .g-ico{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:34px;flex:none}
.game-card h3{color:#fff}
.game-card p{font-size:13px;opacity:.92}
.game-card .hs{font-size:12px;font-weight:700;background:rgba(0,0,0,.18);padding:2px 8px;border-radius:8px;display:inline-block;margin-top:4px}
.gamebox{border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);position:relative}
.ghud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700;font-family:var(--display);font-size:18px}
.spot svg{display:block;width:100%;height:auto}
.spot .hz{cursor:pointer}
.spot .found-ring{fill:none;stroke:#1FB88A;stroke-width:6;animation:pop .4s both}
.sort-food{font-size:96px;text-align:center;padding:18px 0 6px;animation:pop .35s both}
.sort-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;padding:12px}
.sort-btns button{min-height:58px;border-radius:16px;color:#fff;font-family:var(--display);font-weight:800;font-size:17px}
.measure-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.mcard{aspect-ratio:3/4;max-width:100%;border-radius:14px;perspective:600px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.flip .in,.mcard.got .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .f{background:linear-gradient(160deg,var(--tomato-2),var(--tomato));box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.mcard .f::after{content:"?";font-family:var(--display);font-size:30px;color:#fff;font-weight:800}
.mcard .b{background:var(--surface-2);transform:rotateY(180deg);flex-direction:column;font-size:clamp(26px,8vw,40px)}
.mcard .b small{font-size:11px;font-weight:600}
.mcard.got .b{background:color-mix(in srgb,var(--basil) 22%,var(--surface))}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- avatar studio ---------- */
.studio-stage{display:grid;place-items:center;padding:12px 0}
.studio-stage .avatar{border-radius:50%;box-shadow:var(--shadow-lg);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.opt{position:relative;border-radius:18px;background:var(--surface);border:3px solid transparent;box-shadow:var(--shadow);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--tomato)}
.opt .sw{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.opt .price{position:absolute;top:6px;right:6px;font-size:11px}
.opt.locked .avatar{opacity:.55}

/* ---------- virtual kitchen ---------- */
.room{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:24px;overflow:hidden;background:linear-gradient(#FFE9DA 0 58%,#DB9A62 58% 61%,#C9884F 61%);box-shadow:var(--shadow-lg)}
.room::before{content:"";position:absolute;inset:0 0 42% 0;background-image:linear-gradient(#F6D3BC 2px,transparent 2px),linear-gradient(90deg,#F6D3BC 2px,transparent 2px);background-size:40px 30px;opacity:.6}
.room .shelf{position:absolute;height:8px;background:#B97843;border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.room .window{position:absolute;left:12%;top:6%;width:22%;height:30%;background:linear-gradient(#BDE7FF,#E8F7FF);border:6px solid #fff;border-radius:10px;box-shadow:0 0 0 3px #26183A22}
.room .item{position:absolute;transform:translate(-50%,-100%);font-size:clamp(30px,9vw,52px);line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.2));animation:pop .5s both}
.room .ghost{opacity:.18;filter:grayscale(1)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shop-item{border-radius:20px;background:var(--surface);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.shop-item .e{font-size:40px;line-height:1}
.shop-item b{font-size:14px;line-height:1.25}
.shop-item small{font-size:12px;color:var(--basil-ink);font-weight:600}
.shop-item.owned{outline:3px solid var(--basil);outline-offset:-3px}

/* ---------- passport ---------- */
.passport{border-radius:24px;padding:18px;background:linear-gradient(160deg,#1E3A5F,#12263F);color:#F3E9D2;box-shadow:var(--shadow-lg)}
.passport h2{color:#F3E9D2}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:12.5px;line-height:1.05;padding:8px;border:3px dashed rgba(243,233,210,.35);color:rgba(243,233,210,.45)}
.stamp.got{border:4px double currentColor;background:rgba(255,255,255,.92);transform:rotate(-8deg);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp.got:nth-child(2n){transform:rotate(7deg)}
@keyframes stampIn{from{transform:scale(1.8) rotate(-20deg);opacity:0}}
.region{border-radius:22px;background:var(--surface);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.region-r{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- shopping ---------- */
.aisle h3{font-size:16px;color:var(--muted);font-family:var(--body);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.shop-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.shop-row .box{width:28px;height:28px;border-radius:9px;border:3px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-weight:800}
.shop-row.done .box{background:var(--basil);border-color:var(--basil)}
.shop-row.done .txt{text-decoration:line-through;color:var(--muted)}
.shop-row .e{font-size:24px}

/* ---------- badges & club ---------- */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{border-radius:22px;background:var(--surface);box-shadow:var(--shadow);padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge .medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#FFF3C4,#FFC53D);box-shadow:inset 0 -4px 0 #D08A00,0 0 0 4px #fff,0 0 0 6px #FFC53D}
.badge.off .medal{background:var(--surface-2);box-shadow:inset 0 0 0 3px var(--line);filter:grayscale(1);opacity:.5}
.badge b{font-size:13px;line-height:1.2}
.badge small{font-size:11px;color:var(--muted);line-height:1.25}
.post{border-radius:22px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.post .pimg{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;font-size:84px;position:relative}
.post .pimg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.post .pbody{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.reacts{display:flex;gap:8px}
.reacts button{padding:6px 12px;border-radius:99px;background:var(--surface-2);font-weight:600;font-size:14px}
.reacts button[aria-pressed="true"]{background:color-mix(in srgb,var(--tomato) 20%,var(--surface))}
.example-tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* ---------- parent zone ---------- */
.pz{--pz:#26183A}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pinpad button{height:72px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-family:var(--display);font-size:28px;font-weight:700}
.pindots{display:flex;gap:14px;justify-content:center}
.pindots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.ptabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;min-height:40px;padding:0 14px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);background:var(--surface-2)}
.ptabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:14px}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .barr{fill:var(--tomato)}
.chart .barr.today{fill:var(--berry)}
.chart .hit:hover+.barr,.chart g:hover .barr{filter:brightness(1.1)}
.hbar{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.hbar .t{height:12px;border-radius:0 6px 6px 0;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--berry)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting .lbl b{display:block;font-size:15px;font-weight:600}
.setting .lbl small{font-size:12.5px;color:var(--muted)}
.switch{position:relative;width:56px;height:32px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--basil)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);flex:1;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border-radius:22px;padding:16px;border:3px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.plan.best{border-color:var(--tomato);position:relative}
.plan .price{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.plan ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:10px}
.day b{font-family:var(--display);font-size:17px}
.day select{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 10px;width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field input{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 12px;font-weight:500}

/* ---------- overlays ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(20,14,27,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--ground);width:min(100%,560px);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.2,.9,.3,1) both}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:up .25s both}
.float{position:fixed;z-index:96;pointer-events:none;font-family:var(--display);font-weight:800;font-size:24px;color:var(--tomato-ink);animation:floatUp 1.3s ease-out forwards;text-shadow:0 2px 0 var(--surface)}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.7);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}to{transform:translate(-50%,-90px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:97;width:100%;height:100%}
.levelup{text-align:center;align-items:center}
.levelup .avatar{border-radius:50%}

/* ---------- SVG scene motion ---------- */
svg.scene [class*="a-"]{transform-box:fill-box;transform-origin:center}
.kb{animation:kb 14s ease-in-out infinite alternate;transform-box:view-box!important;transform-origin:320px 200px!important}
@keyframes kb{to{transform:scale(1.05)}}
.a-stir{animation:stir 1.6s linear infinite;transform-box:view-box!important}
@keyframes stir{0%{transform:translate(-50px,0)}25%{transform:translate(0,8px)}50%{transform:translate(50px,0)}75%{transform:translate(0,-8px)}100%{transform:translate(-50px,0)}}
.a-whisk{animation:whisk .45s ease-in-out infinite alternate}
@keyframes whisk{from{transform:translateX(-34px) rotate(-10deg)}to{transform:translateX(34px) rotate(10deg)}}
.a-splash{animation:splash .9s ease-out infinite}
@keyframes splash{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.a-chop{animation:chop .9s cubic-bezier(.5,0,.5,1) infinite}
@keyframes chop{0%,100%{transform:translateY(-26px) rotate(-4deg)}45%,55%{transform:translateY(40px) rotate(0)}}
.a-slice{animation:slice 3.6s ease infinite}
@keyframes slice{0%{opacity:0;transform:translateX(-24px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.a-pour{animation:none}
.a-wobble{animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(-5deg)}}
.a-stream{animation:stream 1.2s ease-in-out infinite;transform-origin:top center}
@keyframes stream{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1.06)}}
.a-flow{animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}

/* ============================================================
   Scene engine — each cooking action is a short looping
   illustrated clip (SVG + CSS animation), 640×360.
   ============================================================ */
const INK = '#2B1B3D';
const SW = `stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
let _uid = 0;
const uid = () => 'u' + (++_uid);
const A = (cls, delay) => `class="${cls}"${delay != null ? ` style="animation-delay:${delay}s"` : ''}`;

function sceneBg() {
  let tiles = '';
  for (let x = 0; x <= 640; x += 64) tiles += `M${x} 0V268`;
  for (let y = 0; y <= 268; y += 48) tiles += `M0 ${y}H640`;
  return `<rect width="640" height="360" fill="#FFE9DA"/>
  <path d="${tiles}" stroke="#F6D3BC" stroke-width="2"/>
  <rect y="268" width="640" height="92" fill="#DB9A62"/>
  <rect y="262" width="640" height="12" rx="3" fill="#EDB985" ${SW.replace('5', '4')}/>
  <path d="M0 312H640M0 342H640" stroke="#C9884F" stroke-width="3" opacity=".7"/>`;
}

function hand(x, y, rot = 0, skin = '#F6C8A0', cls = '', s = 1) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><g ${cls ? `class="${cls}"` : ''}>
    <rect x="-18" y="18" width="36" height="30" rx="8" fill="#FFFFFF" ${SW}/>
    <rect x="-24" y="-30" width="48" height="54" rx="22" fill="${skin}" ${SW}/>
    <rect x="-38" y="-10" width="20" height="30" rx="10" fill="${skin}" ${SW}/>
    <path d="M-10 -26v14M2 -28v14M14 -26v14" stroke="${INK}" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  </g></g>`;
}

function bowl(cx, base, w, content = '#FFF6D8', fill = '#7FC8F8', extra = '') {
  const rim = base - w * 0.3, h = w / 2;
  return `<ellipse cx="${cx}" cy="${rim}" rx="${h}" ry="${w * 0.07}" fill="${fill}" ${SW}/>
  <ellipse cx="${cx}" cy="${rim + 4}" rx="${h - 10}" ry="${w * 0.05}" fill="${content}"/>
  ${extra}
  <path d="M${cx - h} ${rim} Q${cx - h} ${base} ${cx} ${base} Q${cx + h} ${base} ${cx + h} ${rim} Q${cx} ${rim + w * 0.1} ${cx - h} ${rim} Z" fill="${fill}" ${SW}/>
  <path d="M${cx - h + 18} ${rim + 16} Q${cx - h + 22} ${base - 18} ${cx - 20} ${base - 8}" stroke="#FFFFFF" stroke-width="6" fill="none" opacity=".45" stroke-linecap="round"/>`;
}

function board(x = 130, w = 380) {
  return `<rect x="${x}" y="246" width="${w}" height="20" rx="9" fill="#F3CFA0" ${SW}/>`;
}

function topBoard() {
  return `<rect x="140" y="120" width="360" height="150" rx="20" fill="#F3CFA0" ${SW}/>
  <path d="M170 150h120M330 150h140M170 240h160M360 240h110" stroke="#E2B47C" stroke-width="3" stroke-linecap="round"/>`;
}

function baseShape(type, cx = 320, cy = 190, fillTop = null, cls = '') {
  const top = fillTop ? (s) => `<g ${cls ? `class="${cls}"` : ''}>${s}</g>` : () => '';
  switch (type) {
    case 'muffin': case 'pizza':
      return `<circle cx="${cx}" cy="${cy}" r="62" fill="#E9C089" ${SW}/><circle cx="${cx}" cy="${cy}" r="50" fill="#F4DDB0"/>
        ${type === 'pizza' ? `<circle cx="${cx}" cy="${cy}" r="48" fill="#D8412F"/>` : ''}${top(`<circle cx="${cx}" cy="${cy}" r="46" fill="${fillTop}"/>`)}`;
    case 'tortilla':
      return `<circle cx="${cx}" cy="${cy}" r="72" fill="#F1D39A" ${SW}/><circle cx="${cx - 24}" cy="${cy - 20}" r="5" fill="#D9A95E"/><circle cx="${cx + 30}" cy="${cy + 18}" r="4" fill="#D9A95E"/>${top(`<circle cx="${cx}" cy="${cy}" r="56" fill="${fillTop}"/>`)}`;
    case 'toast':
      return `<ellipse cx="${cx}" cy="${cy}" rx="90" ry="50" fill="#D9974A" ${SW}/><ellipse cx="${cx}" cy="${cy}" rx="74" ry="38" fill="#F2C57C"/>${top(`<ellipse cx="${cx}" cy="${cy}" rx="66" ry="32" fill="${fillTop}"/>`)}`;
    case 'celery':
      return `<rect x="${cx - 120}" y="${cy - 30}" width="240" height="60" rx="30" fill="#8BD34E" ${SW}/><rect x="${cx - 104}" y="${cy - 16}" width="208" height="32" rx="16" fill="#C8EC9A"/>${top(`<rect x="${cx - 100}" y="${cy - 13}" width="200" height="26" rx="13" fill="${fillTop}"/>`)}`;
    case 'tray':
      return `<rect x="${cx - 150}" y="${cy - 62}" width="300" height="124" rx="10" fill="#C3CAD6" ${SW}/><rect x="${cx - 136}" y="${cy - 50}" width="272" height="100" rx="4" fill="#FBF6EC"/>${top(`<rect x="${cx - 124}" y="${cy - 40}" width="248" height="80" rx="18" fill="${fillTop}"/>`)}`;
    case 'bowl':
      return bowl(cx, cy + 70, 230, fillTop || '#EFD9A8');
    case 'hands':
      return hand(cx - 40, cy + 10, -20, '#F6C8A0') + hand(cx + 40, cy + 10, 20, '#F6C8A0');
    default: // bread
      return `<path d="M${cx - 70} ${cy + 60} V${cy - 30} Q${cx - 84} ${cy - 76} ${cx - 30} ${cy - 72} Q${cx} ${cy - 92} ${cx + 30} ${cy - 72} Q${cx + 84} ${cy - 76} ${cx + 70} ${cy - 30} V${cy + 60} Z" fill="#D9974A" ${SW}/>
        <path d="M${cx - 58} ${cy + 50} V${cy - 26} Q${cx - 66} ${cy - 62} ${cx - 26} ${cy - 58} Q${cx} ${cy - 76} ${cx + 26} ${cy - 58} Q${cx + 66} ${cy - 62} ${cx + 58} ${cy - 26} V${cy + 50} Z" fill="#FBE7C2"/>
        ${top(`<path d="M${cx - 52} ${cy + 44} V${cy - 24} Q${cx - 58} ${cy - 54} ${cx - 24} ${cy - 52} Q${cx} ${cy - 68} ${cx + 24} ${cy - 52} Q${cx + 58} ${cy - 54} ${cx + 52} ${cy - 24} V${cy + 44} Z" fill="${fillTop}"/>`)}`;
  }
}

function flames(cx, y, on = true) {
  if (!on) return '';
  let s = '';
  [-56, -28, 0, 28, 56].forEach((dx, i) => {
    s += `<path d="M${cx + dx} ${y} q-9 -14 0 -30 q9 16 0 30z" fill="${i % 2 ? '#FFB02E' : '#4D8BFF'}" ${A('a-flame', i * 0.13)}/>`;
  });
  return s;
}

function steam(cx, y, n = 3) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = cx + (i - (n - 1) / 2) * 34;
    s += `<path d="M${x} ${y} q-12 -20 0 -40 q12 -20 0 -40" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85" ${A('a-steam', i * 0.6)}/>`;
  }
  return s;
}

function stoveTop(on) {
  return `<rect x="140" y="248" width="360" height="22" rx="6" fill="#3A3448" ${SW}/>
    <circle cx="470" cy="300" r="15" fill="#E7E3EE" ${SW}/><path d="M470 300 L${on ? 480 : 470} ${on ? 290 : 286}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
    ${on ? '' : '<text x="470" y="340" text-anchor="middle" font-family="Baloo 2, system-ui" font-weight="800" font-size="20" fill="#2B1B3D">OFF</text>'}`;
}

function pan(cx, y, content) {
  return `<rect x="${cx + 108}" y="${y + 2}" width="120" height="16" rx="8" fill="#2B2436" ${SW}/>
  <path d="M${cx - 114} ${y} H${cx + 114} L${cx + 98} ${y + 30} H${cx - 98} Z" fill="#4A4258" ${SW}/>
  ${content ? `<ellipse cx="${cx}" cy="${y + 2}" rx="100" ry="9" fill="${content}"/>` : ''}`;
}

function knife(cls = 'a-chop') {
  return `<g ${A(cls)}><path d="M330 198 L430 198 L430 150 Q372 150 330 198 Z" fill="#DCE3EC" ${SW}/>
    <path d="M345 188 H424" stroke="#FFFFFF" stroke-width="4" opacity=".8" stroke-linecap="round"/>
    <rect x="428" y="156" width="92" height="26" rx="12" fill="#2B2436" ${SW}/>
    <circle cx="455" cy="169" r="3.5" fill="#E7E3EE"/><circle cx="490" cy="169" r="3.5" fill="#E7E3EE"/></g>`;
}

function butterKnife(cls) {
  return `<g ${A(cls)}><path d="M300 110 H380 Q396 110 396 122 Q396 134 380 134 H300 Z" fill="#DCE3EC" ${SW}/>
    <rect x="394" y="112" width="90" height="20" rx="10" fill="#FF8C61" ${SW}/></g>`;
}

function vessel(kind, c, label) {
  // drawn upright around (400,150); caller rotates it
  if (kind === 'bottle') return `<rect x="370" y="80" width="60" height="120" rx="16" fill="${c}" ${SW}/><path d="M384 80 L392 54 H408 L416 80 Z" fill="#FFFFFF" ${SW}/><rect x="378" y="120" width="44" height="40" rx="8" fill="#FFFFFF" opacity=".75"/>`;
  if (kind === 'spoon') return `<ellipse cx="400" cy="92" rx="32" ry="22" fill="#DCE3EC" ${SW}/><ellipse cx="400" cy="92" rx="22" ry="12" fill="${c}"/><rect x="394" y="112" width="12" height="100" rx="6" fill="#DCE3EC" ${SW}/>`;
  if (kind === 'can') return `<rect x="362" y="86" width="76" height="110" rx="10" fill="#E7E3EE" ${SW}/><rect x="362" y="114" width="76" height="52" fill="#2EAE5B"/><path d="M362 114H438M362 166H438" stroke="${INK}" stroke-width="4"/>`;
  return `<path d="M360 90 H440 L432 196 Q431 204 422 204 H378 Q369 204 368 196 Z" fill="#EEF3F8" ${SW}/>
    <path d="M364 116 H436 L432 196 Q431 204 422 204 H378 Q369 204 368 196 Z" fill="${c}" opacity=".95"/>
    <path d="M440 110 Q472 112 470 140 Q468 166 436 164" fill="none" ${SW}/>
    ${label ? `<text x="400" y="164" text-anchor="middle" font-family="Baloo 2, system-ui" font-weight="800" font-size="22" fill="${INK}">${label}</text>` : ''}`;
}

const SCENES = {
  wash(p, skin) {
    const inner = p.item
      ? `${bowl(348, 250, 170, p.item, '#CFD6E0')}
         ${[0, 1, 2, 3, 4].map(i => `<circle cx="${300 + i * 24}" cy="${192 + (i % 2) * 6}" r="13" fill="${p.item}" ${SW.replace('5', '3')}/>`).join('')}`
      : `${hand(318, 196, -12, skin, 'a-rubL')}${hand(382, 200, 12, skin, 'a-rubR')}
         ${[0, 1, 2, 3, 4, 5].map(i => `<circle cx="${300 + i * 18}" cy="${170}" r="${6 + (i % 3) * 3}" fill="#FFFFFF" stroke="#9EDCFF" stroke-width="2" ${A('a-bubble', i * 0.35)}/>`).join('')}`;
    return `<rect x="220" y="258" width="260" height="14" rx="7" fill="#6B778A"/>
      <path d="M480 262 V64 Q480 46 462 46 H372 Q352 46 352 66 V96" fill="none" stroke="#A6B2C2" stroke-width="22" stroke-linecap="round"/>
      <rect x="470" y="232" width="30" height="34" rx="6" fill="#A6B2C2" ${SW}/>
      <rect x="342" y="104" width="20" height="150" rx="10" fill="#8FD3FF" opacity=".75"/>
      <path d="M352 108 V250" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 16" ${A('a-flow')}/>
      ${inner}`;
  },
  measure(p) {
    const c = p.c || '#FFF8E7';
    return `${bowl(282, 262, 220, c)}
      <g transform="rotate(-50 400 150)"><g ${A('a-wobble')}>${vessel(p.vessel || 'cup', c, p.label)}</g></g>
      <rect x="316" y="138" width="14" height="64" rx="7" fill="${c}" ${SW.replace('5', '3')} ${A('a-stream')}/>`;
  },
  pour(p) { return SCENES.measure(p); },
  mix(p, skin) {
    const bits = (p.bits || []).map((b, i) => [0, 1, 2].map(j => `<circle cx="${250 + j * 60 + i * 18}" cy="${196 + (j % 2) * 5}" r="7" fill="${b}"/>`).join('')).join('');
    return `${bowl(320, 268, 280, p.c || '#F8D98A', '#7FC8F8', bits)}
      <g ${A('a-stir')}><path d="M318 196 L392 66" stroke="#C98B5A" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="314" cy="200" rx="20" ry="11" fill="#C98B5A" ${SW.replace('5', '3')}/>${hand(398, 70, 20, skin)}</g>`;
  },
  whisk(p, skin) {
    return `${bowl(320, 268, 280, p.c || '#FFD24A')}
      <g ${A('a-whisk')}><rect x="324" y="40" width="14" height="92" rx="7" fill="#FF8C61" ${SW}/>
      <path d="M318 130 Q284 196 331 222 Q378 196 344 130 M324 130 Q302 196 331 222 Q360 196 338 130 M331 130 V222" fill="none" stroke="#9AA7B8" stroke-width="5"/>
      ${hand(331, 56, 0, skin)}</g>
      ${[0, 1, 2].map(i => `<circle cx="${290 + i * 30}" cy="176" r="6" fill="${p.c || '#FFD24A'}" ${A('a-splash', i * 0.2)}/>`).join('')}`;
  },
  crack(p, skin) {
    const zig = 'L312 142 L324 130 L312 118 L324 106 L312 94 L324 82 Z';
    return `${bowl(320, 268, 260, '#FFF6D8', '#7FC8F8', '<ellipse cx="300" cy="186" rx="16" ry="9" fill="#FFB52E"/>')}
      <g ${A('a-crackL')}><path d="M320 68 C290 68 280 100 282 120 C284 142 300 154 320 154 ${zig}" fill="#FFF3DD" ${SW}/>${hand(262, 118, -30, skin)}</g>
      <g ${A('a-crackR')}><path d="M320 68 C350 68 360 100 358 120 C356 142 340 154 320 154 ${zig}" fill="#FFF3DD" ${SW}/>${hand(378, 118, 30, skin)}</g>
      <circle cx="320" cy="140" r="15" fill="#FFB52E" ${SW.replace('5', '3')} ${A('a-drop')}/>`;
  },
  spread(p) {
    return `${topBoard()}${baseShape(p.base || 'bread', 300, 196, p.c || '#FFE08A', 'a-growx')}${butterKnife('a-spreadk')}`;
  },
  cut(p, skin) {
    const c = p.c || '#8BD34E';
    return `${board()}
      <rect x="170" y="200" width="170" height="46" rx="22" fill="${c}" ${SW}/>
      <path d="M190 214 H320" stroke="#FFFFFF" stroke-width="5" opacity=".35" stroke-linecap="round"/>
      ${[0, 1, 2, 3].map(i => `<ellipse cx="${372 + i * 30}" cy="236" rx="11" ry="12" fill="${c}" ${SW.replace('5', '3')} ${A('a-slice', i * 0.9)}/>`).join('')}
      ${hand(226, 180, -8, skin)}
      <path d="M204 190 q10 8 22 0 q10 8 22 0" stroke="${INK}" stroke-width="3" fill="none" opacity=".55"/>
      ${knife()}`;
  },
  mash(p, skin) {
    return `${bowl(320, 268, 280, p.c || '#FFE38A', '#7FC8F8', `<ellipse cx="320" cy="190" rx="90" ry="14" fill="${p.c || '#FFE38A'}" ${A('a-squish')}/>`)}
      <g ${A('a-press')}><rect x="313" y="40" width="14" height="140" rx="7" fill="#C98B5A" ${SW}/>
      <path d="M270 184 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12" fill="none" stroke="#9AA7B8" stroke-width="7" stroke-linejoin="round"/>
      ${hand(320, 56, 0, skin)}</g>`;
  },
  thread(p, skin) {

function scene(step, opts = {}) {
  const skin = opts.skin || '#F6C8A0';
  const fn = SCENES[step.scene] || SCENES.plate;
  return `<svg class="scene${opts.still ? ' still' : ''}" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(step.text || '')}">
    ${sceneBg()}<g class="kb">${fn(step, skin)}</g></svg>`;
}

       ${a.eyes === 'sparkle' ? `<path d="M130 80 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#FFC53D"/>` : ''}`;

      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.25);

function confetti(n = 120) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let c = $('#confetti'); if (!c) { c = document.createElement('canvas'); c.id = 'confetti'; document.body.appendChild(c); }
  const ctx = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#FF6B35', '#FFC53D', '#1FB88A', '#6C5CE7', '#2DA8F0', '#FF5E8A'];
  const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  })();
}

function rcard(r, k) {

  return `<button class="rcard ${lock ? 'locked' : ''}" data-go="recipe" data-id="${r.id}">
    <div class="plate" style="background:${r.plate}"><span>${r.emoji}</span><span class="mini-play">▶ ${r.steps.length + 2} clips</span></div>

    <h3>${esc(r.name)}</h3>
    <div class="meta"><span>${r.time} min</span>·<span>${DIFF[r.diff]}</span>·<span>${r.age}+</span></div>
    <div style="padding:0 4px">${d ? starsHTML(d.stars) : `<span class="muted" style="font-size:12px">${lock ? esc(lock.short === 'Learn first' ? 'Learn a skill to unlock' : 'Locked') : 'Not cooked yet'}</span>`}</div>
  </button>`;
}
SCREENS.recipes = (p, k) => {
  const f = UI.filter, q = UI.q.trim().toLowerCase();
  const match = r => (f === 'All' || r.meal === f || (f === 'Ready' && !lockInfo(r, k))) && (!q || r.name.toLowerCase().includes(q)) && prefOK(r);
  const base = RECIPES.filter(r => (r.tier === 'free' || r.tier === 'premium') && match(r));
  const packs = Object.entries(PACKS).map(([id, pk]) => {
    const list = RECIPES.filter(r => r.tier === id && match(r)); if (!list.length) return '';
    const owned = S.parent.packs.includes(id) && S.parent.plan === 'premium';
    return `<section class="section"><div class="pack-banner" style="background:linear-gradient(135deg,${pk.grad[0]},${pk.grad[1]})"><span class="p-ico">${pk.emoji}</span>
      <div class="grow"><h3>${pk.name}</h3><p>${pk.blurb}</p></div>${owned ? '<span class="pill good">Owned</span>' : `<span class="pill lock">$${pk.price} pack</span>`}</div>
      <div class="rgrid">${list.map(r => rcard(r, k)).join('')}</div></section>`;
  }).join('');
  return `<div class="screen">
    <div class="topbar"><h2>Cook-Along</h2>${hudHTML(k)}</div>
    <label class="search"><span aria-hidden="true">🔍</span><input id="rsearch" type="search" placeholder="Find a recipe" value="${esc(UI.q)}" aria-label="Search recipes"></label>
    <div class="chips" role="group" aria-label="Filter">${['All', 'Ready', 'Breakfast', 'Lunch', 'Dinner', 'Snacks', 'Desserts'].map(c => `<button class="chip" data-act="filter" data-f="${c}" aria-pressed="${f === c}">${c === 'Ready' ? 'Ready to cook' : c}</button>`).join('')}</div>
    ${base.length ? `<section class="section"><h3>ChopChop classics</h3><div class="rgrid">${base.map(r => rcard(r, k)).join('')}</div></section>` : ''}
    ${packs}

  </div>`;
};
MOUNT.recipes = () => {

};

SCREENS.recipe = (p, k) => {
  const r = R(p.id); if (!r) return SCREENS.recipes(p, k);
  const lock = lockInfo(r, k), skin = avPick(AV.skin, k.avatar.skin).c;
  const n = r.needs || {}, grownSteps = r.steps.filter(s => s.grown).length;
  const needs = [];
  if (n.knife) needs.push(`<span class="pill heat">🔪 ${KNIFE[n.knife]}</span>`);
  if (n.stove) needs.push('<span class="pill heat">🔥 Stove</span>');
  if (n.oven) needs.push('<span class="pill heat">♨️ Oven</span>');
  if (n.micro) needs.push('<span class="pill heat">📡 Microwave</span>');
  if (n.blender) needs.push('<span class="pill heat">🌀 Blender</span>');
  const tab = UI.rtab;
  const g = UI.gathered[r.id] || [];
  let body = '';
  if (tab === 'ing') body = `<div class="ing">${r.ing.map((x, i) => `<button class="ing-item" data-act="gather" data-id="${r.id}" data-i="${i}" aria-pressed="${g.includes(i)}"><span class="e">${x.e}</span><span><b>${esc(x.q)}</b><small>${esc(x.n)}</small></span></button>`).join('')}</div>
    <p class="eyebrow" style="margin-top:6px">Tools</p><div class="row wrap">${r.tools.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>`;
  if (tab === 'ch') body = `<div class="chapters">${[{ scene: 'mise', text: 'Gather everything first — chefs call it mise en place.', emojis: r.ing.map(x => x.e) }, ...r.steps].map((s, i) => `
      <button class="chapter" ${lock ? 'disabled' : `data-act="play" data-id="${r.id}" data-step="${i}"`}><div class="thumb mini">${scene(s, { still: true, skin })}</div>
      <div class="grow"><span class="n">Clip ${i + 1}${s.grown ? ' · Grown-up' : ''}${s.timer ? ` · ${fmtT(s.timer)}` : ''}</span><p>${esc(s.text)}</p></div></button>`).join('')}</div>`;
  if (tab === 'nut') {
    const scis = r.steps.filter(s => s.sci);
    body = `<div class="nutri facts">${[['Calories', r.nut.cal], ['Protein', r.nut.protein + 'g'], ['Fiber', r.nut.fiber + 'g']].map(([a, b]) => `<div><b>${b}</b><span>${a}</span></div>`).join('')}</div>

      <div><p class="eyebrow">Food groups on your plate</p><div class="plate-groups" style="margin-top:8px">${Object.entries(GROUPS).map(([id, G]) => `<span class="pill" style="${r.groups.includes(id) ? `background:${G.color};color:#fff` : 'opacity:.45'}">${G.name}</span>`).join('')}</div></div>
      ${scis.map(s => `<div class="note"><span>🔬</span><div><b>Kitchen science</b><p>${esc(s.sci)}</p></div></div>`).join('')}`;
  }
  return `<div class="screen">
    <div class="detail-hero"><button class="icon-btn" data-act="back" aria-label="Back">←</button>
      <button class="thumb" ${lock ? 'data-act="noop"' : `data-act="play" data-id="${r.id}"`} aria-label="Start cook-along">${scene(r.steps[0], { skin })}${lock ? '' : '<span class="play"></span>'}<span class="dur">${r.steps.length + 2} clips · ${r.time} min</span></button></div>
    <div class="section">
      <div class="row wrap"><span class="pill">${REGIONS[r.region].place}</span><span class="pill">${r.meal}</span>${PACKS[r.tier] ? `<span class="pill">${PACKS[r.tier].name} pack</span>` : ''}${k.done[r.id] ? starsHTML(k.done[r.id].stars) : ''}</div>
      <h1>${esc(r.name)} ${r.emoji}</h1>
    </div>
    <div class="facts"><div><b>${r.time}</b><span>minutes</span></div><div><b>${r.serves}</b><span>serves</span></div><div><b>${r.age}+</b><span>age</span></div><div><b style="font-size:16px;padding-top:3px">${DIFF[r.diff]}</b><span>level</span></div></div>
    ${needs.length || grownSteps ? `<div class="safety"><span class="s-ico">🛡️</span><div class="section" style="gap:6px"><b>Safety check</b>
      <div class="row wrap">${needs.join('')}</div>${grownSteps ? `<p style="font-size:13.5px">${grownSteps} step${grownSteps > 1 ? 's need' : ' needs'} a grown-up. The clip will pause and ask for them.</p>` : ''}</div></div>` : ''}
    ${lock ? `<div class="card flat section"><h3>🔒 Not unlocked yet</h3><p>${esc(lock.msg)}</p>
      <button class="btn btn-primary" data-act="unlock" data-type="${lock.type}" data-skill="${lock.skill || ''}">${esc(lock.btn)}</button></div>` : ''}
    ${lock ? '' : `<button class="btn btn-soft btn-block" data-act="preview" data-id="${r.id}">👀 Watch the whole video first</button>`}
    <div class="fact-card"><span class="f-ico">🌍</span><p>${esc(r.fact)}</p></div>
    <div class="tabs" role="tablist">${[['ing', 'Ingredients'], ['ch', 'Clips'], ['nut', 'Nutrition']].map(([id, l]) => `<button role="tab" data-act="rtab" data-t="${id}" aria-selected="${tab === id}">${l}</button>`).join('')}</div>
    <div class="section">${body}</div>
    ${lock ? '' : `<div class="sticky-cta"><button class="btn btn-primary grow" data-act="play" data-id="${r.id}">▶ Start cook-along</button><button class="btn btn-line" data-act="addlist" data-id="${r.id}" aria-label="Add ingredients to shopping list">🛒</button></div>`}
  </div>`;
};
const fmtT = s => s >= 3600 ? `${Math.floor(s / 3600)} hr${s % 3600 ? ' ' + Math.round((s % 3600) / 60) + ' min' : ''}` : s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s} sec`;

function addToList(r) {
  let added = 0;
  r.ing.forEach(x => {
    if (S.shopping.some(s => s.n === x.n && !s.done)) return;
    S.shopping.push({ id: 's' + Date.now() + added, e: x.e, q: x.q, n: x.n, aisle: x.aisle, done: false, from: r.name }); added++;
  });
  save(); return added;
}

}
function playNarr() {

}
function pauseNarr() { P.playing = false; setPlayingUI(false); cancelSpeech(); cancelAnimationFrame(P.raf); }

function pickVoice() {
  try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /Samantha|Google US English|Aria|Jenny/i.test(v.name)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speakFrom(idx) {
  if (!voiceOn()) return;
  try {
    speechSynthesis.cancel();
    const ws = P.words.slice(idx), text = ws.join(' ');
    if (!text) return;
    const offs = []; let o = 0; ws.forEach(w => { offs.push(o); o += w.length + 1; });
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95 * P.speed; u.pitch = 1.05; if (VOICE) u.voice = VOICE;
    u.onboundary = e => { if (P?.utter !== u || (e.name && e.name !== 'word')) return; P.byB = true; let j = 0; while (j + 1 < offs.length && offs[j + 1] <= e.charIndex) j++; P.wi = idx + j; };

    P.prevWi = P.wi;
  }
  const frac = P.byB ? Math.min(1, (P.wi + 1) / P.words.length) : Math.min(1, P.t / P.dur);

    <div class="section grow" style="gap:8px"><b>${t.done ? 'Time’s up — ding!' : t.run ? 'Timer running…' : `Set the timer: ${fmtT(t.total)}`}</b>
    <div class="row wrap">${t.done ? '' : t.run ? '<button class="btn btn-sm btn-soft" data-act="tpause">Pause</button>' : '<button class="btn btn-sm btn-primary" data-act="tstart">Start timer</button>'}
    ${t.done ? '' : '<button class="btn btn-sm btn-line" data-act="tskip">It’s done already</button>'}</div></div></div>`;
}
const clock = s => s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function timerStart() {
  const t = P.tm; t.run = true; clearInterval(t.iv);
  t.iv = setInterval(() => {
    t.left = Math.max(0, t.left - 1);
    const C = 2 * Math.PI * 38; $('#tmTxt') && ($('#tmTxt').textContent = clock(t.left)); $('#tmRing')?.setAttribute('stroke-dashoffset', C * (1 - t.left / t.total));
    if (t.left <= 0) timerDone();
  }, 1000);
  renderSide();
}
function timerDone() {
  const t = P.tm; clearInterval(t.iv); t.run = false; t.done = true; t.left = 0;
  sfx('ding'); setTimeout(() => sfx('ding'), 500);
  if (voiceOn()) { try { speechSynthesis.cancel(); speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance('Ding! Time is up!'), { rate: .95 })); } catch (e) {} }
  renderSide(); $('#tmBox')?.classList.add('ding'); $('#didit')?.classList.add('didit-pulse');

/* ---------- side panel ---------- */

  let h = `<div class="stepcount"><span class="eyebrow">${P.preview ? 'Watching the whole video' : c.kind === 'mise' ? 'Get ready' : c.kind === 'clean' ? 'Last step' : `Step ${P.i} of ${P.clips.length - 2}`}</span>${dots}</div>`;

function mountHold() {
  const b = $('#holdBtn'); if (!b) return;
  let raf = 0, t0 = 0;
  const fill = b.querySelector('i');
  const stop = () => { cancelAnimationFrame(raf); fill.style.width = '0'; };
  const step = now => { const f = Math.min(1, (now - t0) / 1500); fill.style.width = f * 100 + '%'; if (f >= 1) { P.grownOK.add(P.i); sfx('step'); toast('Thanks, grown-up! Let’s do this together.'); renderSide(); } else raf = requestAnimationFrame(step); };
  const start = e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); };
  b.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
  b.addEventListener('keyup', stop);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

function didIt(btn) {
  const k = kid(), c = P.clips[P.i];
  if (c.kind === 'mise' && P.gathered.size === P.r.ing.length) P.miseAll = true;
  if (!P.done.has(P.i)) {
    P.done.add(P.i);
    if (c.kind !== 'mise') { const b = btn.getBoundingClientRect(); grant(k, { xp: 10 }, { x: b.left + b.width / 2, y: b.top }); P.xpEarned += 10; }
    sfx('step');
  }
  loadClip(P.i + 1, true);
}

function finishRecipe() {
  const k = kid(), r = P.r;
  const cleanAll = P.cleaned.size === CLEAN.length;
  const stars = 1 + (P.miseAll ? 1 : 0) + (cleanAll ? 1 : 0);
  const hadRegion = stampsOf(k).has(r.region);
  const prev = k.done[r.id];
  k.done[r.id] = { stars: Math.max(stars, prev?.stars || 0), times: (prev?.times || 0) + 1, last: TODAY() };
  if (P.miseAll) k.flags.mise = true;
  if (cleanAll) k.flags.clean = true;
  const xp = 100 + (perk(k, 'spice-rack') ? 10 : 0) + (prev ? 0 : 50);
  const coins = 50 + (perk(k, 'herb-garden') ? 5 : 0) + stars * 5;
  const wid = 'w' + Date.now();
  k.wall.unshift({ id: wid, recipe: r.id, date: TODAY(), photo: null, rating: 0, status: k.controls.share ? 'pending' : 'private' });
  k.wall = k.wall.slice(0, 24);
  logIt(k, `Cooked ${r.name} · ${stars} star${stars > 1 ? 's' : ''}`);
  quest(k, 'cook');
  grant(k, { xp, coins });
  const stamp = !hadRegion;
  save();
  const earnedXp = xp + P.xpEarned;
  P = null;
  go('finish', { rid: r.id, stars, xp: earnedXp, coins, stamp, wid, first: !prev }, { replace: true });
  sfx('ding'); confetti(180);
  setTimeout(() => checkBadges(k), 400);
}

function shrink(file, cb) {
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 560 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .72)); }; img.src = fr.result; };
  fr.readAsDataURL(file);
}

/* ---------- lesson side (watch → quiz → result) ---------- */
function lessonSide(k) {
  const s = P.skill;
  if (P.phase === 'watch') return `<div class="stepcount"><span class="eyebrow">Watch · ${P.clips.length} short clips</span></div>
    <div class="section" style="gap:8px">${P.clips.map((c, i) => `<div class="note" style="${i === P.i ? 'outline:3px solid var(--berry)' : i < P.i ? 'opacity:.6' : ''}"><b>${i + 1}</b><p>${esc(c.text)}</p></div>`).join('')}</div>

  if (P.phase === 'quiz') {

      <div class="card section"><h3>${esc(q.q)}</h3>
      ${q.a.map((a, i) => { const st2 = P.answered == null ? '' : i === q.c ? 'good' : i === P.answered ? 'heat' : ''; return `<button class="btn btn-line btn-block ${st2 ? '' : ''}" style="justify-content:flex-start;font-family:var(--body);font-weight:600;font-size:16px;${st2 === 'good' ? 'border-color:var(--basil);background:color-mix(in srgb,var(--basil) 16%,var(--surface))' : st2 === 'heat' ? 'border-color:var(--danger)' : ''}" data-act="qa" data-i="${i}" ${P.answered != null ? 'aria-disabled="true"' : ''}>${esc(a)}</button>`; }).join('')}

  }
  const n = s.quiz.length, pass = P.score >= Math.ceil(n / 2);
  const stars = P.score === n ? 3 : P.score >= n - 1 ? 2 : 1;
  const opens = RECIPES.filter(r => (r.skills || []).includes(s.id) && !lockInfo(r, k));
  return `<div class="card section" style="align-items:center;text-align:center">
    ${pass ? `<div class="big-stars">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="animation-delay:${i * .2}s">★</span>`).join('')}</div><h2>${s.name} mastered!</h2>

    : `<h2>So close!</h2><p class="muted">${P.score} of ${n} right. Watch the clips once more and try again.</p><button class="btn btn-primary btn-block" data-act="lretry">Watch again</button>`}
  </div>`;
}
function lessonResult() {
  const k = kid(), s = P.skill, n = s.quiz.length;

  P.phase = 'result';
  if (pass) {
    P.firstMaster = !k.skills[s.id];
    k.skills[s.id] = Math.max(stars, k.skills[s.id] || 0);
    if (P.firstMaster) { logIt(k, `Mastered ${s.name}`); grant(k, { xp: 50, coins: 20 }); } else grant(k, { xp: 10 });

  } else sfx('wrong');
  renderSide();
}

GAME_MOUNT.measure = (box, k) => {
  const targets = shuffle([['¼', .25], ['½', .5], ['¾', .75], ['⅓', 1 / 3], ['⅔', 2 / 3]]);
  let r = 0, fill = 0, pouring = false, total = 0, raf = 0, last = 0, stopped = false, perfect = 0;
  $('#ghelp').textContent = 'Press and hold Pour. Let go when the milk reaches the dashed line. Real cooks read cups at eye level!';
  const H = 200, top = 40;
  const cup = () => {
    const [lab, v] = targets[r];
    const marks = [[.25, '¼'], [.5, '½'], [.75, '¾'], [1, '1 cup']].map(([m, l]) => `<path d="M60 ${top + H - m * H} h22" stroke="${INK}" stroke-width="3"/><text x="54" y="${top + H - m * H + 4}" text-anchor="end" font-size="13" font-weight="700" fill="currentColor">${l}</text>`).join('')
      + [[1 / 3, '⅓'], [2 / 3, '⅔']].map(([m, l]) => `<path d="M198 ${top + H - m * H} h-22" stroke="${INK}" stroke-width="3"/><text x="204" y="${top + H - m * H + 4}" font-size="13" font-weight="700" fill="currentColor">${l}</text>`).join('');
    return `<svg viewBox="0 0 260 270" width="240" style="max-width:100%;color:var(--ink)" aria-label="Measuring cup">
      <defs><clipPath id="cupc"><rect x="62" y="${top}" width="136" height="${H}" rx="10"/></clipPath></defs>
      <rect x="62" y="${top}" width="136" height="${H}" rx="10" fill="#EAF4FF" opacity=".5"/>
      <g clip-path="url(#cupc)"><rect id="milk" x="62" y="${top + H - fill * H}" width="136" height="${fill * H}" fill="#FFFFFF" stroke="#BFD8EA" stroke-width="2"/></g>
      <path d="M62 ${top + H - v * H} H198" stroke="#FF6B35" stroke-width="3" stroke-dasharray="8 6"/>
      <rect x="62" y="${top}" width="136" height="${H}" rx="10" fill="none" stroke="${INK}" stroke-width="5"/>
      <path d="M198 ${top + 30} q40 4 38 50 q-2 40 -38 44" fill="none" stroke="${INK}" stroke-width="5"/>${marks}</svg>`;
  };
  const draw = (msg) => {
    const [lab] = targets[r];
    box.innerHTML = `<div class="ghud"><span>Round ${r + 1} / ${targets.length}</span><span class="num">${total} pts</span></div>
      <div class="measure-wrap"><h2>Pour exactly ${lab} cup</h2>${cup()}<p style="min-height:24px;font-weight:600">${msg || ''}</p>
      ${stopped ? `<button class="btn btn-primary" id="mnext">${r < targets.length - 1 ? 'Next round' : 'See score'}</button>` : `<button class="btn btn-go btn-block" id="pour" style="min-height:64px;font-size:22px;touch-action:none">Hold to pour 🥛</button>`}</div>`;
    const p = $('#pour', box);
    if (p) {
      const start = e => { e.preventDefault(); if (stopped) return; pouring = true; last = performance.now(); raf = requestAnimationFrame(tick); };
      const end = () => { if (!pouring) return; pouring = false; cancelAnimationFrame(raf); judge(); };
      p.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => p.addEventListener(ev, end));
      p.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); }); p.addEventListener('keyup', end);
      p.addEventListener('contextmenu', e => e.preventDefault());
    }
    $('#mnext', box)?.addEventListener('click', () => { r++; if (r >= targets.length) return endGame(k, 'measure', total, perfect ? `${perfect} perfect pour${perfect > 1 ? 's' : ''}!` : 'Nice pouring!', 'Tip: for liquids, bend down so your eyes are level with the line.'); fill = 0; stopped = false; draw(); });
  };
  const tick = now => {
    const dt = (now - last) / 1000; last = now; fill += dt * (0.22 + r * 0.03);
    const m = $('#milk', box); if (m) { m.setAttribute('y', top + H - Math.min(fill, 1.08) * H); m.setAttribute('height', Math.min(fill, 1.08) * H); }
    if (fill >= 1.06) { pouring = false; return judge(); }
    raf = requestAnimationFrame(tick);
  };
  const judge = () => {
    stopped = true; const v = targets[r][1], diff = Math.abs(fill - v);
    let pts = fill > 1.02 ? 0 : Math.max(0, Math.round(100 - diff * 500));
    if (diff < 0.02 && fill <= 1.02) { pts = 120; perfect++; k.flags.perfectPour = true; sfx('ding'); } else sfx(pts > 50 ? 'coin' : 'wrong');
    total += pts;
    draw(fill > 1.02 ? 'Overflow! Milk everywhere 😅' : diff < 0.02 ? 'PERFECT pour! +120' : `${diff < 0.06 ? 'So close!' : fill < v ? 'A little more next time.' : 'A little too much.'} +${pts}`);
  };
  leaveHooks.push(() => cancelAnimationFrame(raf));
  draw();
};

const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function minutesChart(k) {
  const days = [6, 5, 4, 3, 2, 1, 0].map(n => { const d = new Date(); d.setDate(d.getDate() - n); return { key: dayKey(d), lbl: n === 0 ? 'Today' : WD[d.getDay()], v: k.minutes[dayKey(d)] || 0, today: n === 0 }; });
  const lim = k.controls.limit || 0;
  const max = Math.max(15, Math.ceil(Math.max(lim, ...days.map(d => d.v)) / 15) * 15);
  const X0 = 34, X1 = 332, Y0 = 16, Y1 = 142, bw = (X1 - X0) / 7, w = bw * .56;
  const y = v => Y1 - v / max * (Y1 - Y0);
  const peak = days.reduce((a, d) => d.v > a.v ? d : a, days[0]);
  let s = `<svg class="chart" viewBox="0 0 340 172" role="img" aria-label="Minutes cooking and learning per day, last 7 days">`;
  [0, max / 2, max].forEach(v => { s += `<line class="gl" x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}"/><text x="${X0 - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  days.forEach((d, i) => {
    const x = X0 + i * bw + (bw - w) / 2, top = y(d.v);
    s += `<g><title>${d.lbl}: ${d.v} min</title><rect x="${X0 + i * bw}" y="${Y0}" width="${bw}" height="${Y1 - Y0}" fill="transparent"/>`;
    if (d.v > 0) s += `<path class="barr${d.today ? ' today' : ''}" d="M${x} ${Y1} V${top + 4} Q${x} ${top} ${x + 4} ${top} H${x + w - 4} Q${x + w} ${top} ${x + w} ${top + 4} V${Y1} Z"/>`;
    if (d.v > 0 && (d === peak || d.today)) s += `<text x="${x + w / 2}" y="${top - 5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${d.v}</text>`;
    s += `<text x="${x + w / 2}" y="${Y1 + 18}" text-anchor="middle">${d.lbl}</text></g>`;
  });
  s += `<line x1="${X0}" x2="${X1}" y1="${Y1}" y2="${Y1}" stroke="var(--muted)" stroke-width="1.5"/>`;
  if (lim) s += `<line x1="${X0}" x2="${X1}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${X1}" y="${y(lim) - 5}" text-anchor="end" style="fill:var(--ink)">Daily limit ${lim} min</text>`;
  return s + '</svg>';
}

        <button class="btn btn-primary" data-act="addweek">Add the week to the shopping list</button></section>`;
  }
  if (tab === 'club') {
    const pend = S.kids.flatMap(x => x.wall.filter(w => w.status === 'pending').map(w => ({ w, x })));
    body = `<div class="note"><span>🛡️</span><p>Nothing reaches Chef Club without your OK. Posts show first name and age only — no last names, locations or comments.</p></div>
      ${pend.length ? pend.map(({ w, x }) => { const r = R(w.recipe); return `<div class="card row" style="align-items:stretch"><div class="post" style="width:110px;flex:none;box-shadow:none"><div class="pimg" style="background:${r.plate};font-size:48px">${w.photo ? `<img src="${w.photo}" alt="">` : r.emoji}</div></div>
        <div class="section grow" style="gap:6px"><b>${esc(x.name)} · ${esc(r.name)}</b><span class="muted" style="font-size:12px">${w.photo ? 'With photo' : 'No photo'} · ${w.date}</span>
        <div class="row"><button class="btn btn-sm btn-go" data-act="approve" data-kid="${x.id}" data-w="${w.id}" data-ok="1">Approve</button><button class="btn btn-sm btn-line" data-act="approve" data-kid="${x.id}" data-w="${w.id}" data-ok="0">Keep private</button></div></div></div>`; }).join('')
      : '<div class="card flat"><p>All caught up. New posts will show up here.</p></div>'}`;
  }
  if (tab === 'plan') {
    const prem = P2.plan === 'premium';
    body = `<div class="plan-grid">
        <div class="plan ${prem ? '' : 'best'}"><span class="eyebrow">Free</span><span class="price">$0</span><ul><li>4 starter recipes</li><li>Chef Academy lessons</li><li>All 4 games</li><li>Coins, avatar & kitchen</li></ul>${prem ? '<button class="btn btn-sm btn-line" data-act="setplan" data-v="free">Switch to Free</button>' : '<span class="pill">Your plan</span>'}</div>
